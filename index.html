<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>软件测试面试题库 · 刷题台</title>
<style>
:root{
  --bg:#f4f6f4; --surface:#ffffff; --surface-2:#f7f9f7; --border:#e2e6e2;
  --text:#1f2328; --muted:#6b7280; --brand:#16a34a; --brand-soft:#e8f5ec;
  --warn:#d97706; --danger:#dc2626; --radius:10px;
  --shadow:0 1px 2px rgba(16,24,20,.05),0 8px 24px rgba(16,24,20,.06);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#111413; --surface:#191d1b; --surface-2:#1f2422; --border:#303632;
    --text:#e6eae8; --muted:#9aa4a0; --brand:#22c55e; --brand-soft:#1b2a21;
    --warn:#f59e0b; --danger:#f87171; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font:14px/1.7 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
}
button{font:inherit;cursor:pointer}
a{color:var(--brand)}
.top{
  position:sticky; top:0; z-index:10; background:var(--surface);
  border-bottom:1px solid var(--border);
}
.top-inner{
  max-width:1180px; margin:0 auto; padding:14px 20px;
  display:flex; align-items:center; gap:16px; flex-wrap:wrap;
}
.brand{display:flex; align-items:center; gap:10px; font-weight:700; font-size:16px}
.logo{
  width:30px; height:30px; border-radius:8px; background:var(--brand); color:#fff;
  display:grid; place-items:center; font-size:15px; font-weight:700;
}
.grow{flex:1}
.search{
  flex:1 1 260px; max-width:420px; display:flex; align-items:center; gap:8px;
  background:var(--surface-2); border:1px solid var(--border); border-radius:999px; padding:6px 12px;
}
.search input{
  flex:1; border:0; outline:0; background:transparent; color:var(--text); font:inherit;
}
.progress-mini{display:flex; align-items:center; gap:8px; color:var(--muted); font-size:12px; white-space:nowrap}
.bar{width:110px; height:6px; border-radius:999px; background:var(--border); overflow:hidden}
.bar > i{display:block; height:100%; width:0; background:var(--brand); transition:width .25s}
main{
  max-width:1180px; margin:0 auto; padding:20px;
  display:grid; grid-template-columns:250px minmax(0,1fr); gap:20px;
}
@media (max-width:860px){
  main{grid-template-columns:1fr}
  aside{order:2}
}
aside{position:sticky; top:82px; align-self:start; max-height:calc(100vh - 100px); overflow:auto}
.panel{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow)}
.panel-h{padding:12px 14px; border-bottom:1px solid var(--border); font-weight:600; font-size:13px; color:var(--muted)}
.cat{
  width:100%; text-align:left; border:0; background:transparent; color:var(--text);
  padding:9px 14px; display:flex; gap:8px; align-items:center; border-bottom:1px solid var(--border);
}
.cat:hover{background:var(--surface-2)}
.cat.on{background:var(--brand-soft); color:var(--brand); font-weight:600}
.cat .n{flex:1; font-size:13px; line-height:1.35}
.cat .c{font-size:11px; color:var(--muted); white-space:nowrap}
.stage{min-width:0}
.filters{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px}
.chip{
  border:1px solid var(--border); background:var(--surface); color:var(--muted);
  padding:6px 14px; border-radius:999px; font-size:13px;
}
.chip.on{background:var(--brand); border-color:var(--brand); color:#fff}
.card{
  background:var(--surface); border:1px solid var(--border); border-radius:14px;
  box-shadow:var(--shadow); padding:22px;
}
.qtop{display:flex; align-items:center; gap:10px; flex-wrap:wrap; color:var(--muted); font-size:12px; margin-bottom:10px}
.badge{background:var(--brand-soft); color:var(--brand); border-radius:999px; padding:2px 10px; font-weight:600}
.badge.warn{background:rgba(217,119,6,.12); color:var(--warn)}
.qtext{font-size:19px; line-height:1.55; margin:0 0 18px; font-weight:700}
.self-label{display:flex; justify-content:space-between; align-items:center; color:var(--muted); font-size:12px; margin-bottom:6px}
textarea{
  width:100%; min-height:130px; resize:vertical; padding:12px 14px; font:inherit; line-height:1.7;
  color:var(--text); background:var(--surface-2); border:1px solid var(--border); border-radius:10px; outline:0;
}
textarea:focus{border-color:var(--brand); box-shadow:0 0 0 3px var(--brand-soft)}
.actions{display:flex; gap:10px; flex-wrap:wrap; margin-top:14px}
.btn{
  border:1px solid var(--border); background:var(--surface); color:var(--text);
  padding:8px 16px; border-radius:8px; font-size:13px;
}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--brand); border-color:var(--brand); color:#fff}
.btn.primary:hover{filter:brightness(1.05)}
.btn.ghost{color:var(--muted)}
.btn.done{border-color:var(--brand); color:var(--brand); background:var(--brand-soft)}
.answer{
  margin-top:18px; border-top:1px dashed var(--border); padding-top:16px;
}
.answer h3{font-size:13px; color:var(--muted); margin:0 0 8px; font-weight:600}
.answer ul{margin:0; padding-left:20px}
.answer li{margin:5px 0}
.navbar{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:16px; flex-wrap:wrap}
.count{color:var(--muted); font-size:12px}
.empty{padding:40px; text-align:center; color:var(--muted)}
details{margin-top:16px}
summary{cursor:pointer; color:var(--muted); font-size:13px}
.grid{
  display:grid; grid-template-columns:repeat(auto-fill,minmax(52px,1fr)); gap:8px; margin-top:12px;
}
.gbtn{
  border:1px solid var(--border); background:var(--surface-2); color:var(--text);
  border-radius:8px; padding:8px 4px; font-size:12px; position:relative;
}
.gbtn:hover{border-color:var(--brand)}
.gbtn.on{background:var(--brand); border-color:var(--brand); color:#fff}
.gbtn.star::after{content:"★"; position:absolute; top:-1px; right:3px; font-size:9px; color:var(--warn)}
.gbtn.done{border-color:var(--brand)}
.gbtn.done::before{content:""; position:absolute; left:4px; top:4px; width:5px; height:5px; border-radius:50%; background:var(--brand)}
footer{max-width:1180px; margin:0 auto; padding:8px 20px 40px; color:var(--muted); font-size:12px}
.type-filters{margin-top:-6px}
.type-filters .flabel{color:var(--muted); font-size:12px; align-self:center; margin-right:2px}
.opt{
  display:block; width:100%; text-align:left; margin:8px 0; padding:10px 14px;
  border:1px solid var(--border); border-radius:8px; background:var(--surface-2); color:var(--text);
}
.opt:hover{border-color:var(--brand)}
.opt:disabled{opacity:1; cursor:default}
.opt.correct{background:var(--brand-soft); border-color:var(--brand); color:var(--brand); font-weight:600}
.opt.wrong{background:rgba(220,38,38,.08); border-color:var(--danger); color:var(--danger)}
.fillrow{display:flex; gap:10px; flex-wrap:wrap}
.fillrow input{
  flex:1 1 260px; padding:10px 14px; border-radius:8px; border:1px solid var(--border);
  background:var(--surface-2); color:var(--text); font:inherit; outline:0;
}
.fillrow input:focus{border-color:var(--brand); box-shadow:0 0 0 3px var(--brand-soft)}
.verdict{margin-top:10px; font-weight:600}
.verdict.ok{color:var(--brand)}
.verdict.bad{color:var(--danger)}
.code-input{font-family:Consolas,"Courier New",monospace; min-height:190px; line-height:1.6}
pre.code{
  margin:0; padding:14px; border:1px solid var(--border); border-radius:10px;
  background:var(--surface-2); overflow:auto; white-space:pre-wrap;
  font:13px/1.65 Consolas,"Courier New",monospace;
}
.toast{
  position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(10px);
  background:var(--text); color:var(--surface); padding:8px 16px; border-radius:999px;
  font-size:13px; opacity:0; pointer-events:none; transition:.2s; z-index:20;
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0)}

.b-short{display:none}

/* ---------- 手机端适配 ---------- */
@media (max-width:700px){
  html{-webkit-text-size-adjust:100%}
  body{font-size:15px}
  .top-inner{
    display:grid; grid-template-columns:auto 1fr auto; align-items:center;
    gap:8px 10px; padding:9px 12px;
  }
  .brand{grid-row:1; grid-column:1; min-width:0}
  .brand .b-full{display:none}
  .brand .b-short{display:inline}
  .logo{width:26px; height:26px; border-radius:7px; font-size:13px}
  .grow{display:none}
  .search{grid-row:2; grid-column:1 / -1; max-width:none; padding:5px 12px}
  .search input{font-size:16px} /* 小于16px iOS 会自动放大 */
  .progress-mini{grid-row:1; grid-column:2; justify-self:end; font-size:11px; gap:6px}
  .bar{width:64px}
  #reset{grid-row:1; grid-column:3; padding:6px 10px; font-size:12px}

  main{grid-template-columns:1fr; padding:12px; gap:14px}
  /* 分类改为题目上方的横向滑动条，先选分类再看题 */
  aside{position:static; order:-1; max-height:none; overflow:visible; min-width:0}
  aside .panel{box-shadow:none; border-radius:10px; overflow:hidden}
  .panel-h{padding:9px 12px; font-size:12px}
  #cats{
    display:flex; gap:8px; overflow-x:auto; padding:9px 12px;
    max-width:100%;
    scrollbar-width:none; -webkit-overflow-scrolling:touch;
  }
  #cats::-webkit-scrollbar{display:none}
  .cat{
    width:auto; flex:0 0 auto; border:1px solid var(--border); border-radius:999px;
    padding:7px 12px; border-bottom:0; gap:6px; white-space:nowrap;
  }
  .cat .n{font-size:13px; flex:none}
  .cat .c{display:none} /* 小屏隐藏题量，避免横向占位过长 */

  .filters{gap:6px; margin-bottom:10px}
  .chip{padding:7px 12px; font-size:13px}
  #random{display:none} /* 小屏用底部“下一题”即可，避免挤占 */
  .type-filters{margin-top:-2px; flex-wrap:nowrap; overflow-x:auto; scrollbar-width:none}
  .type-filters::-webkit-scrollbar{display:none}
  .type-filters .chip{flex:0 0 auto; padding:7px 9px; font-size:12px}
  .flabel{display:none}

  .card{padding:16px; border-radius:12px}
  .qtop{gap:6px; font-size:11px; margin-bottom:8px}
  .qtext{font-size:17px; line-height:1.5; margin-bottom:14px}
  .opt{padding:12px 14px; margin:8px 0}
  .fillrow{flex-direction:column; gap:8px}
  .fillrow input{flex:none; width:100%; font-size:16px; padding:11px 12px}
  .fillrow .btn{width:100%; min-height:42px}
  textarea{font-size:16px; padding:11px 12px} /* 防止 iOS 聚焦缩放 */
  .code-input{min-height:150px; font-size:14px}
  pre.code{font-size:12px; padding:12px}
  .actions{display:grid; grid-template-columns:1fr 1fr; gap:8px}
  .actions .btn{width:100%; min-height:42px}
  .actions .btn:last-child:nth-child(odd){grid-column:1/-1}
  .navbar{gap:8px}
  .navbar .btn{flex:1 1 auto; min-height:40px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(46px,1fr)); gap:6px}
  .gbtn{padding:9px 4px}
  footer{padding:8px 12px 72px}
  .toast{bottom:calc(20px + env(safe-area-inset-bottom))}
  .answer{margin-top:14px; padding-top:12px}
  .answer ul{padding-left:18px}
}

@media (max-width:380px){
  .qtext{font-size:16px}
  .card{padding:13px}
  .brand .b-short{font-size:14px}
  .progress-mini span{display:none} /* 极窄屏只留进度条 */
}

</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <div class="brand"><span class="logo">测</span><span class="b-full">软件测试面试题库 · 刷题台</span><span class="b-short">面试刷题</span></div>
    <div class="search">
      <span style="color:var(--muted)">⌕</span>
      <input id="search" type="search" placeholder="搜索题目关键词，如：状态机、幂等、P95">
    </div>
    <div class="grow"></div>
    <div class="progress-mini">
      <span id="progText">已掌握 0 / 0</span>
      <div class="bar"><i id="progBar"></i></div>
    </div>
    <button class="btn ghost" id="reset">清空进度</button>
  </div>
</header>

<main>
  <aside>
    <div class="panel">
      <div class="panel-h">题目分类</div>
      <div id="cats"></div>
    </div>
  </aside>

  <section class="stage">
    <div class="filters">
      <button class="chip on" data-f="all">全部</button>
      <button class="chip" data-f="star">★ 高频</button>
      <button class="chip" data-f="todo">未掌握</button>
      <button class="chip" data-f="done">已掌握</button>
      <button class="btn" id="random" style="margin-left:auto">随机一题</button>
    </div>
    <div class="filters type-filters">
      <span class="flabel">题型</span>
      <button class="chip on" data-t="all">全部题型</button>
      <button class="chip" data-t="qa">简答口述</button>
      <button class="chip" data-t="choice">选择题</button>
      <button class="chip" data-t="fill">填空题</button>
      <button class="chip" data-t="code">代码题</button>
    </div>

    <div id="stageBody"></div>

    <details>
      <summary>展开本题库题目清单（当前筛选）</summary>
      <div class="grid" id="grid"></div>
    </details>
  </section>
</main>

<footer>数据来源：你上传的《分类面试题.txt》，另补充选择题、填空题、代码题专项。作答与掌握状态保存在本机浏览器，不会上传。</footer>
<div class="toast" id="toast"></div>

<script>
window.QB_PARTS = window.QB_PARTS || [];
window.QB_PARTS.push({name:"一、测试基础与流程",items:[
{q:"完整的软件测试流程是什么？每个阶段的产出物分别是什么？",s:true,a:"需求评审 → 测试计划 → 用例设计与评审 → 环境与数据准备 → 提测冒烟 → 功能/接口/回归执行 → 缺陷跟踪 → 测试报告 → 上线验证与复盘。\n产出物：需求评审记录、测试计划、测试用例、测试数据、缺陷单、测试报告、上线checklist与复盘纪要。\n一句话：每个阶段都要有可交付、可评审、可追溯的文档，而不是只有执行。"},
{q:"测试人员在整个研发周期里，每个环节应该起什么作用？",s:true,a:"需求阶段：识别歧义、遗漏、可测性与风险，提前问清异常分支和权限规则。\n设计阶段：评审技术方案的可测性，参与接口契约定义。\n开发阶段：接口联调、左移测试、准备用例与环境。\n提测阶段：冒烟把关，不合格直接打回。\n测试阶段：执行、定位、推动缺陷闭环、评估风险。\n上线阶段：验证核心链路、监控、复盘并补回归用例。"},
{q:"测试计划 / 测试方案包含哪些内容？你怎么制定？",a:"范围与目标、测试策略（分层与优先级）、资源与环境、进度与里程碑、准入准出标准、风险与应对、交付物。\n制定方法：先对齐版本目标与变更范围，再按风险排优先级，最后倒排时间并预留 buffer。"},
{q:"测试报告包含哪些内容？你独立输出过完整测试报告吗？",s:true,a:"版本与范围、测试环境与配置、用例执行统计（计划/执行/通过/失败/阻塞）、缺陷统计（等级、模块、趋势、修复率）、遗留问题与风险评估、性能与安全结论、上线建议。\n独立输出过：按模板填写并附缺陷清单、用例执行明细和风险结论，评审后归档。"},
{q:"测试用例包含哪些字段？禅道里的用例有哪些字段？",s:true,a:"通用字段：用例编号、所属模块、标题、前置条件、操作步骤、预期结果、优先级、用例类型、关联需求、执行结果、备注。\n禅道：产品/项目、模块、用例类型（功能/性能/接口等）、阶段、相关需求、优先级、关键词、适用版本、创建人、最后执行人等。"},
{q:"设计一条测试用例需要注意什么？",a:"一条用例只验证一个明确的点；步骤可执行、数据可构造；预期结果可判定；独立可重复，不依赖其他用例的执行顺序。"},
{q:"缺陷单 / bug 包含哪些内容和关键要素？",s:true,a:"标题（现象+模块）、复现步骤、实际结果、预期结果、环境与版本、严重等级与优先级、附件（截图/录屏/日志/请求响应）、指派人、状态、关联需求。\n关键：别人能照着步骤稳定复现。"},
{q:"缺陷管理流程是什么？用什么工具管理缺陷？",s:true,a:"新建 → 确认/指派 → 修复 → 验证 → 关闭；不认可时走沟通或评审，结论可为延期、非缺陷、需求变更。\n工具：禅道、Jira、TAPD、Bugzilla；配合截图、日志与用例编号留痕。"},
{q:"需求评审的意义是什么？评审会上你关注什么、提过哪些问题？",a:"意义：尽早发现歧义和遗漏，统一产品、开发、测试的理解，降低返工。\n关注：业务规则与边界、异常分支、权限与数据范围、数据来源与口径、兼容性、上线与回滚。\n常问：超时怎么办、失败是否可重试、谁能看谁能改、历史数据怎么处理。"},
{q:"需求评审和用例评审分别有哪些人参加？",a:"需求评审：产品、开发、测试、UI/交互，必要时运营与架构。\n用例评审：测试主导，开发与产品参加，确认覆盖与预期是否一致。"},
{q:"用例评审时发现你的用例覆盖不全，后续怎么补？",a:"先补缺口用例并标注来源，再评估影响面和优先级；把新增场景纳入回归集，必要时同步更新测试计划与风险说明。"},
{q:"需求上线标准 / 测试准出标准是什么？",a:"用例执行率 100%、P0/P1 清零、遗留缺陷有明确结论和规避方案、冒烟通过、性能与安全达标、文档与上线步骤齐全、回滚方案可用。"},
{q:"冒烟用例怎么定义？冒烟测试怎么做？",a:"从核心主流程中抽取最小集合（登录、主业务闭环、关键接口），提测后第一时间执行；不通过直接打回，不进入正式测试。"},
{q:"什么是回归测试？在什么节点做？回归完还要做什么？",s:true,a:"回归是验证修改没有破坏原有功能，覆盖缺陷修复点和关联模块。\n节点：开发修复后、版本上线前、线上热修后。\n回归完：更新用例与缺陷状态、输出回归结论与风险、准备上线验证和复盘。"},
{q:"新版本来了，用例执行策略是什么？继承性用例每版都要跑吗？",a:"按变更影响面选测：改动模块全测，关联模块重点测，核心继承用例每版必跑；非核心按风险抽测，自动化兜底。"},
{q:"怎么评估测试用例覆盖是否完整？",a:"需求追踪矩阵（需求→用例→缺陷）、用例评审、接口覆盖率、代码覆盖率参考、线上缺陷反推补用例。"},
{q:"什么是测试左移、什么是测试右移？",a:"左移：测试提前到需求、设计、编码阶段，做评审、接口测试、单元测试，越早发现成本越低。\n右移：测试延伸到线上，做灰度、监控、告警、用户反馈与线上巡检。"},
{q:"黑盒测试和白盒测试的区别和优缺点？白盒测试的用例设计方法有哪些？",a:"黑盒不看内部实现，从输入输出验证，贴近用户、易执行，但难以覆盖内部路径。\n白盒看代码逻辑，覆盖更彻底、能发现隐藏分支，但成本高、依赖代码能力。\n白盒方法：语句覆盖、判定覆盖、条件覆盖、判定/条件覆盖、条件组合覆盖、路径覆盖。"},
{q:"国标里的测试级别分为哪几级？",a:"单元测试、集成测试、系统测试、验收测试（确认测试），部分标准还包含回归测试与安装测试。"},
{q:"测试用例设计方法有哪些？等价类、边界值具体怎么用？",s:true,a:"方法：等价类、边界值、判定表、因果图、正交实验、场景法、状态迁移、错误推测。\n等价类：把输入划分为有效/无效类，每类取代表值。\n边界值：取上点、下点、离点，如 1–100 取 0、1、2、99、100、101。"},
{q:"判定表怎么用？结合你的项目举一个例子。",a:"列出条件桩与动作桩，枚举条件组合形成规则，再合并简化。\n例：领用审批——金额>5000、是否外部人员、是否有库存，三个条件组合决定走哪级审批或直接拒绝。"},
{q:"状态迁移法怎么设计用例？怎么保证状态机覆盖完整、能识别非法跳变？",a:"先画状态图，列出「当前状态 × 事件 → 目标状态」矩阵；覆盖全部合法迁移、每个状态的进入/退出、重复触发、非法跳转和超时/撤销分支。"},
{q:"正交实验法、错误推测法、因果图分别在什么场景用？",a:"正交：多因素多水平组合，用少量用例覆盖组合空间。\n错误推测：凭经验针对易错点设计异常场景。\n因果图：输入之间存在约束/依赖关系，需要分析输入组合对输出的影响。"},
{q:"测试数据一般从哪里来？",a:"生产脱敏数据、造数脚本/Faker、边界与异常构造、上游同步、数据库备份恢复。"},
{q:"测试环境怎么搭建？环境不一致导致的问题怎么处理？",a:"按部署文档准备依赖版本、配置、数据库与中间件，初始化数据和账号权限；用 Docker/Compose 固化环境。\n不一致时：列出差异清单，优先容器化对齐，无法对齐的在上线前用预发/生产同构环境复验。"},
{q:"需求文档写得不全、和开发理解不一致，怎么推进？",a:"拉产品和开发三方对齐，输出会议纪要和问题清单；以原型和接口契约作为补充依据，逐条确认并跟踪闭环。"},
{q:"测试时间被压缩、需求倒排，你怎么排测试优先级？",a:"按业务价值与风险排序：P0 主流程与资损/权限必测，自动化兜底回归；无法覆盖的部分显式上报风险，争取资源或缩小范围。"},
{q:"测试过程中主要有哪些风险？印象最深的一次风险是什么？",a:"需求频繁变更、提测质量差、环境不稳定、数据缺失、时间不足、依赖服务不可用。\n讲一次真实风险：如流程引擎未启动导致审批链路整体不可用，及时升级并补启动检查。"},
{q:"怎么区分一个 bug 是前端问题还是后端问题？",s:true,a:"F12 看请求：请求未发出或参数错 → 前端；请求已发但响应错误/数据错 → 后端；响应正确但页面展示错 → 前端渲染或缓存。\n再用接口直调复验，能绕开前端复现的多为后端或数据问题。"},
{q:"什么是接口联调？",a:"前后端按接口契约联调，验证参数、返回结构、鉴权、异常码与业务状态是否一致，测试参与确认联调结果。"},
{q:"你理解的软件测试是什么？",a:"以最小成本发现并传递质量风险，验证系统在正确性、稳定性、性能、安全等方面满足业务预期，而不是单纯找 bug。"},
{q:"好的测试设计标准是什么？最重要的是哪一点？",a:"覆盖需求与风险、用例可执行可判定、可维护、成本合理。\n最重要的是覆盖关键风险：主流程、资损、权限、数据一致性。"},
{q:"一个从 0 到 1 的新项目，除了用例执行正确，还要关注哪些内容？",a:"需求可测性、架构与依赖风险、环境与数据准备、权限体系、性能与安全、监控告警、发布与回滚方案。"},
{q:"怎么快速上手一个完全陌生的业务？有没有自己的方法论？",a:"看文档与原型 → 画业务流程图和状态机 → 跟一遍真实操作 → 找产品/老员工问关键规则 → 整理术语表 → 先写冒烟用例验证理解。"},
{q:"用例怎么管理？用例库怎么维护？",a:"按产品/模块/版本分层，需求关联与标签管理；核心回归集单独维护，定期评审、去重、更新失效用例。"},
{q:"测试环境和生产环境的差异，你怎么考虑？",a:"关注配置、数据量、依赖服务、网络与权限差异；差异可能导致性能与边界问题，上线前在预发或生产同构环境复验关键链路。"},
{q:"测试中漏测了怎么解决？印象最深的一次漏测是什么？",s:true,a:"先止损（回滚/热修/开关），再复盘根因：是需求遗漏、用例缺口还是执行遗漏；补用例进回归集，评估同类影响面，输出改进项。\n讲漏测时重点讲「怎么发现、怎么补救、怎么防止再犯」。"},
{q:"线上出现问题了怎么处理？",a:"确认影响范围 → 止损（回滚/降级/限流）→ 拉日志与链路定位 → 修复并验证 → 通知相关方 → 复盘与补监控/用例。"},
{q:"有做过自由测试 / 探索式测试吗？用例没覆盖到的部分怎么想思路？",a:"按业务分区做探索：围绕用户目标、异常路径、状态组合、权限边界、并发与中断设计探索章程，边学边测并记录发现。"},
{q:"了解第三方测试吗？了解军软测试文档的编写要求吗？",a:"第三方测试强调独立性与可追溯，按委托方标准和模板输出测试计划、用例、记录、报告；军软通常要求更严格的文档标识、评审与配置管理。"},
{q:"一个测试周期一般多久？版本多久迭代一次？",a:"按实际回答：如双周迭代、测试 5–7 个工作日；大版本含回归与性能则 2–3 周。"},
{q:"你们测试团队几个人？人员配比是怎样的？谁主导测试规划？",a:"按实际回答：如 1 名测试对 3–5 名开发；测试负责人主导计划与排期，组员分工执行与自动化。"}
]});

window.QB_PARTS.push({name:"二、测试用例设计实战题（场景题）",items:[
{q:"登录界面（用户名 + 密码 + 登录按钮）有哪些测试点？",s:true,a:"功能：正确/错误账号密码、空值、长度边界、特殊字符、大小写、前后空格、重复点击、回车登录。\n安全：SQL 注入、XSS、暴力破解与锁定、验证码、密码是否明文、会话与登出。\n界面与兼容：布局、提示文案、多浏览器/分辨率。\n异常：网络中断、超时、服务不可用、并发登录。"},
{q:"登录功能涉及安全，密码是否明文传输怎么验证？",a:"抓包看是否为 HTTPS；查看请求体密码是否明文或可逆加密；检查前端加密逻辑与后端校验；确认日志不打印密码。"},
{q:"手机号注册 / 登录的测试点有哪些？",a:"号段与长度校验、格式与空格、重复注册、验证码有效期/错误/复用/频控、换绑、国际号码、并发注册、异常网络。"},
{q:"动态验证码怎么测试？",a:"正确、错误、过期、重复使用、大小写、刷新后旧码失效、发送频控、绕过（直接调接口）、多端同步。"},
{q:"微信发红包怎么设计测试用例？",s:true,a:"金额：0、负数、小数位、超余额、超单笔上限、拼手气/普通红包。\n个数与领取：1 个/多个、抢完、重复抢、并发抢、超时未领退回。\n流程：支付、失败重试、退款、账单一致性、通知、弱网、防刷与风控。"},
{q:"微信发送语音的功能怎么测？",a:"权限、录制时长上下限、取消发送、松手发送、静音、后台/来电中断、音质与格式、发送失败重试、播放与转文字、删除、弱网。"},
{q:"微信朋友圈评论功能有哪些测试点？",a:"文字/表情/图片、字数上限、敏感词、删除与回复、可见范围、刷新与分页、并发评论、通知、权限与屏蔽。"},
{q:"微信扫一扫识别二维码怎么测？",a:"相机权限、对焦、距离/角度/光线、模糊/破损/反光码、非二维码、多码同框、识别结果正确性、连续扫描、弱网与暗光。"},
{q:"微信视频通话怎么测？",a:"呼叫/接听/拒接/挂断、静音与摄像头切换、前后台切换、弱网与断网重连、多人通话、权限、并发与兼容。"},
{q:"微信上传图片怎么测？换头像后不生效怎么排查？",a:"格式/大小/尺寸/数量、压缩与裁剪、失败重试、删除、并发上传。\n不生效：查接口是否返回新地址、CDN/浏览器缓存、前端是否刷新、后端是否落库。"},
{q:"微信通知怎么测试？",a:"开关与免打扰、系统权限、到达率与延迟、重复/合并、点击跳转、多端同步、杀进程后接收。"},
{q:"淘宝购物车怎么设计测试用例？",a:"增删改查、数量边界与库存、选中/全选、价格与优惠计算、跨端同步、登录合并、失效商品、并发修改。"},
{q:"双 11 晚 8 点秒杀开启，用户点秒杀按钮失效，你怎么排查和测试这个场景？",s:true,a:"先分前端/后端：看按钮是否置灰、时间是否本地时间、请求是否发出、接口返回码。\n排查：客户端时间与服务端时间差、活动配置是否生效、库存/限流、网关与缓存、灰度环境。\n测试：时间边界（提前/准点/延后）、库存、并发、重复点击、降级与监控。"},
{q:"秒杀场景怎么设计用例？怎么做压测？",a:"用例：时间点、限购、库存扣减与超卖、重复下单、支付超时、失败降级、防刷。\n压测：JMeter 梯度加压，监控 TPS、P95、错误率、CPU/连接数，确认拐点与限流策略。"},
{q:"商城礼包 / 道具置顶怎么测？",a:"排序规则、并发置顶、重复领取、库存、上下架与生效时间、权限、多端展示一致性。"},
{q:"游戏礼包怎么测？黑神话悟空 boss 关卡场景怎么测？",a:"礼包：领取条件、重复领取、库存、到账与日志。\nBoss 关卡：数值与技能判定、碰撞、帧率与卡顿、网络延迟/丢包、复活与存档、不同难度与设备。"},
{q:"停车场分段计费（白天 15 分钟内免费、半小时 1.5 元、1 小时 3 元、夜间 1 小时 2 元、上限 24 元）怎么设计场景？",a:"用判定表覆盖时段×时长：0–15 分钟、15–30、30–60、跨时段、跨天、24 小时封顶。\n再补异常：无入场记录、重复出场、免费时段跨段、月卡/优惠、支付失败。"},
{q:"电梯控制系统怎么设计测试？",a:"楼层与方向、开关门、超载、急停、断电恢复、多人同时呼叫、故障告警、消防模式、响应时间与安全。"},
{q:"风扇的测试用例怎么设计？",a:"档位切换、摇头、定时、模式（自然/睡眠）、断电恢复、按键与遥控、噪音、安全与清洗。"},
{q:"手机相机怎么设计测试用例？",a:"拍照/录像、对焦与变焦、闪光、模式切换、存储与权限、来电中断、前后台、兼容性、成像质量与弱光。"},
{q:"手机外设：普通开关机、充电类型、红外传感器、指纹人脸、OTA 升级分别有哪些测试点？",a:"开关机：正常/长按/异常断电/低电。充电：协议、快充、边充边用、异常温度。红外：距离与角度、遮挡。指纹人脸：录入、失败、湿手/暗光。OTA：下载、校验、升级、失败回滚、数据保留。"},
{q:"OTA 大版本升级和小版本升级有什么区别？",a:"大版本涉及功能与架构变更，重点测兼容、数据迁移、回滚；小版本多为修复，重点验证修复点与增量包升级。"},
{q:"列表页支持跨页勾选，最多 500 条，每页只显示 100 条，批量修改送货日期怎么设计用例？",a:"跨页保持勾选、全选/取消、500 上限、翻页后状态、批量提交、部分失败与回滚、并发修改、超时。"},
{q:"勾选的数据里有一部分允许调整、一部分不允许调整，异常场景怎么设计？",a:"可调/不可调混选、全不可调、提示与禁用、后端二次校验、绕过前端直接调接口修改不可调数据。"},
{q:"库存 100 件、其中 60 件已被订单占用，运营要直接改成 50，系统会怎么处理、你怎么测？",a:"预期应拒绝或提示可售仅 40；测试边界、并发下单、提示文案、审计日志、强制调整权限。"},
{q:"上游一次性同步 100 个订单、每个订单 50 个字段，怎么保证 5000 个字段完全一致？",s:true,a:"建立字段映射表，写脚本全量比对源与目标；覆盖类型、精度、空值、默认值、枚举转换。\n再验幂等、失败重试、部分失败、乱序与重复同步；抽样人工复核关键字段。"},
{q:"租户 A 和租户 B 可以互相登录，但登录后不能操作对方数据，怎么设计用例？",a:"A 登录查 B 的数据 ID、列表、详情、导出、附件；直接调接口改 tenantId；缓存与日志是否串租户。"},
{q:"支付异常场景有哪些？支付冻结怎么测？",a:"余额不足、超时、重复支付、回调丢失、退款失败、风控拦截、对账不平。\n冻结：冻结/解冻、冻结中支付、并发、定时解冻、日志与通知。"},
{q:"页面上的柱状图 / 报表怎么测？从第三方接口取数再生成报表怎么测？",a:"核对统计口径与数据源、空数据、极值、时间范围、刷新与导出；第三方异常/超时/字段变更时是否有兜底与提示。"},
{q:"只有一个输入框，怎么设计测试用例？",a:"等价类与边界：空、最短/最长、超长；类型：数字/字母/中文/表情；特殊字符与注入；粘贴、回车、空格；前后端校验一致。"},
{q:"批量导入接口，除了响应时间还要验证哪些结果？",a:"成功/失败条数、错误行定位与原因、部分成功策略、重复数据、事务与回滚、幂等、文件格式与编码。"},
{q:"告警系统怎么设计测试用例？",a:"触发条件与阈值边界、去重/抑制、恢复通知、通知渠道、延迟、误报漏报、告警风暴与降级。"},
{q:"设备每分钟上报一次数据，可能出现重复、乱序、延迟、缺失、异常值，分别怎么设计用例？主要关注哪些指标？",a:"重复：幂等去重；乱序：按时间戳排序；延迟：补传与超时；缺失：断点续传/补采；异常值：阈值过滤与标记。\n指标：到达率、延迟、完整率、准确率、重复率。"},
{q:"A 软件每 100ms 发一次自检命令，B 软件自检后上传数据，A 连续 2 秒收不到就判通信异常，请写测试方法、测试充分性和通过标准。",a:"方法：正常链路、丢包、延迟、重复、乱序、连续 2 秒无响应、恢复后重连。\n充分性：正常+异常+边界+长时间稳定性。\n通过标准：判定准确、误报/漏报为 0、恢复后自动重连、日志可追溯。"},
{q:"上传图片功能怎么设计测试用例？",a:"格式、大小、尺寸、数量、压缩、裁剪、删除、失败重试、并发、安全（改名/木马/越权访问）。"},
{q:"一个完整的下单支付主流程，你会设计哪些测试点？",a:"商品与库存、价格与优惠、地址、支付方式、回调与超时、重复支付、退款、对账、并发与弱网。"}
]});

window.QB_PARTS.push({name:"三、缺陷管理与沟通推动",items:[
{q:"缺陷等级怎么划分（P0-P3 或 70/71）？判定的依据是什么？",s:true,a:"P0：阻断/资损/数据错误/安全漏洞；P1：主流程严重受损但有绕过；P2：一般功能异常；P3：体验/文案/建议。\n依据：影响面、发生频率、是否有绕过、是否涉及资金与数据。"},
{q:"抖音搜索词条和搜索结果完全没关系，定几级？",a:"搜索是核心功能，结果完全不相关会直接影响用户获取内容，通常 P1；若大面积不可用或资损则 P0。"},
{q:"视频清晰度按钮切换成功但画面没变化，定几级？",a:"功能可见但无效，通常 P2；若默认清晰度错误影响大量用户可升 P1。"},
{q:"怎么判断一个缺陷是否需要修复？",a:"看是否偏离需求、影响用户与业务、是否有绕过、修复成本与版本计划；体验类可作为改进项排期。"},
{q:"提交的 bug 开发不认可，怎么处理？",s:true,a:"先补证据：需求条款、复现步骤、日志/请求响应、数据库结果。\n再拉产品三方确认预期；仍不一致则记录结论（非缺陷/需求变更/延期），必要时升级负责人。"},
{q:"开发说「这不是 bug，是设计如此、需求就是这样」，怎么礼貌回应？",a:"先确认需求原文与设计稿，说明用户实际感受与风险；若确实如此，记录为改进建议并推动产品评估，不在情绪上争论。"},
{q:"开发和产品都不在你所在的城市，只能线上沟通，怎么推进问题？",a:"用录屏+截图+日志把问题说清，建群同步，明确责任人和时间点，定期更新状态，风险及时升级。"},
{q:"开发很忙、不配合定位，你怎么办？",a:"先自行缩小范围（前端/后端/数据/环境），提供最小复现包和日志，约定固定时间同步；仍不推进则升级测试负责人。"},
{q:"偶现的 bug 怎么跟进？一直复现不出来怎么办？这种 bug 要不要提？",s:true,a:"要提。记录环境、账号、时间、traceId、日志与截图，标注偶现和复现概率。\n持续跟进：加日志/监控、提高复现频率、灰度观察；不能因为难复现就不提。"},
{q:"测试环境复现不了，上线后用户量上来概率变高，怎么规避？",a:"分析是否与并发、数据量、缓存、网络有关；补监控与日志、灰度发布、压测、开关降级，并准备回滚方案。"},
{q:"提了 bug 开发改了，回归发现没修好怎么办？如果还是没修好呢？",a:"重开 bug 并附回归证据和版本号，说明未修复的具体表现；多次不修则升级负责人并评估上线风险。"},
{q:"开发自己都没跑通就把版本转测给你，你怎么做？",a:"按准入标准打回，要求提供自测清单和冒烟通过记录；先跑冒烟，不通过不进入正式测试。"},
{q:"怎么推动一个缺陷闭环？有没有推动过产品改进？",a:"明确责任人、截止时间、验证标准，定期同步；用数据说明影响，推动产品排期并记录结果。"},
{q:"印象最深的 / 最严重的一个 bug 是什么？怎么发现的？",s:true,a:"按「背景—发现—定位—修复—复盘」讲：如未登录可直接调接口取数据、重复提交生成两条单据、审批通过但库存未扣减。\n重点讲证据链和影响面，不要只说现象。"},
{q:"你认为怎么才算一个 bug？用户体验类问题算不算 bug？",a:"与需求/设计/用户预期不一致且影响使用即为 bug；体验问题可分级为改进建议，但影响转化或理解时应作为缺陷跟踪。"},
{q:"线上偶现失败、线下怎么都复现不了，怎么排查失败原因？",a:"查链路日志与 traceId、监控指标、用户环境与数据差异、并发与缓存、依赖服务超时；必要时加埋点复现。"},
{q:"怎么捞日志？捞的是前端日志还是后端日志？服务端日志怎么捞？",a:"前端看 console 与 Network；后端按时间、关键字、traceId 在日志文件/日志平台检索；服务端常用 tail/grep/awk 或 ELK。"},
{q:"traceId / logId 在排查中怎么用？",a:"从请求入口透传到各服务，按 traceId 串起整条调用链，快速定位失败发生在哪一跳。"},
{q:"业务需求、用户体验、设计美感冲突了怎么办？",a:"以业务目标和用户价值为准，列出各方诉求与代价，拉产品做决策并记录取舍，测试给出风险提示。"},
{q:"开发反馈技术实现有限制，功能做不到，你怎么处理？",a:"确认限制边界与替代方案，评估对需求的影响，推动产品调整范围；无法满足的部分明确记录为已知限制与风险。"}
]});

window.QB_PARTS.push({name:"四、界面自动化（Selenium / UI）",items:[
{q:"UI 自动化整体流程是怎么做的？",s:true,a:"选型与范围 → 搭框架分层 → 挑选稳定主流程 → 编写与调试 → 接入 CI → 生成报告 → 持续维护。\n优先覆盖回归频繁、数据可造、界面稳定的主流程。"},
{q:"元素定位方式有哪些？八大定位分别是什么？",s:true,a:"id、name、class name、tag name、link text、partial link text、xpath、css selector。\n优先 id/name/css，xpath 作为兜底；避免依赖绝对路径和易变文本。"},
{q:"为什么用 xpath？xpath 的原理是什么？",a:"xpath 通过路径、属性、文本在 DOM 树中定位，灵活但性能较低、易受结构变化影响；适合复杂层级和无稳定属性的场景。"},
{q:"id 定位怎么用？有什么限制？",a:"driver.find_element(By.ID, 'xxx')；id 唯一时最快最稳。限制：动态 id、无 id、重复 id 时不适用。"},
{q:"隐式等待、显式等待、强制等待有什么区别？一直定位不到元素会怎样？",s:true,a:"隐式等待：全局轮询查找元素，找不到继续等。\n显式等待：等待某个条件成立（可见/可点击/存在）。\n强制等待：sleep，固定时间。\n一直定位不到：抛 NoSuchElementException / TimeoutException，用例失败。"},
{q:"元素定位不到怎么排查？",s:true,a:"查等待是否足够、是否在 iframe/新窗口、选择器是否唯一、元素是否被遮挡、是否动态渲染、页面是否报错、浏览器缩放与驱动版本。"},
{q:"页面元素加载慢怎么处理？",a:"用显式等待等目标元素或接口返回，避免 sleep；必要时等列表有数据行、等 loading 消失。"},
{q:"怎么保证 UI 自动化脚本的稳定性？难点在哪、怎么改进？",s:true,a:"稳定选择器、显式等待、PO 分层、数据隔离、独立用例、失败重试与截图、环境固定。\n难点：异步渲染、弹窗/iframe、数据污染、环境差异；用统一基类封装等待与点击。"},
{q:"自动化脚本怎么维护？怎么分层？",a:"base（浏览器与公共操作）、pages（页面对象）、cases（业务用例）、data（测试数据）、config（环境配置）；公共逻辑下沉，页面变更只改 pages。"},
{q:"自动化框架怎么搭建？包含哪些目录、每个目录放什么？",a:"config 环境配置、common 工具与客户端、pages 页面对象、tests 用例、data 数据、logs 日志、reports 报告、conftest/fixture 全局准备。"},
{q:"UI 自动化怎么做断言？",a:"断言元素文本/属性/数量/URL/弹窗提示，必要时查接口或数据库验证业务结果；断言要具体、可定位。"},
{q:"新弹出来的页面 / 新窗口怎么定位？",a:"记录 window_handles，switch_to.window 切换后操作，结束再切回原窗口。"},
{q:"iframe 怎么定位？",a:"switch_to.frame(定位或索引) 进入，操作完 switch_to.default_content() 回到主文档；嵌套 iframe 逐层切换。"},
{q:"富文本编辑器怎么定位？",a:"多数是 iframe 或 contenteditable；进入 iframe 后 send_keys，或用 JS 直接设置内容并触发 input 事件。"},
{q:"上传文件时系统弹窗怎么处理？",a:"优先对 input[type=file] 直接 send_keys 路径；系统级弹窗用 pyautogui/AutoIt 或关闭弹窗改用接口上传。"},
{q:"浏览器版本不同导致元素定位出现偏差怎么办？",a:"固定浏览器与驱动版本，使用相对定位和稳定属性，容器化运行环境；必要时做兼容性分支。"},
{q:"登录状态怎么保持？cookie 和 token 怎么获取和复用？",a:"登录一次后保存 cookie/localStorage，后续注入复用；或直接调登录接口拿 token 写入 localStorage，避免每次 UI 登录。"},
{q:"UI 自动化的前置条件和后置清理怎么做？",a:"fixture/setup 造数、teardown 清理；用唯一标识隔离数据，避免残留影响下次执行。"},
{q:"数据驱动怎么做？YAML 里一般存什么数据？",a:"用例参数化读取 YAML/JSON/Excel；存输入、预期、账号、环境、测试数据标识。"},
{q:"底层的公共点击、输入方法做了哪些异常处理？",a:"等待可见/可点击、滚动到元素、JS 点击绕过遮挡、失败截图与日志、必要时重试一次。"},
{q:"单独跑没问题、联跑就报错，是什么原因？",s:true,a:"数据污染、用例顺序依赖、登录态/会话冲突、端口或浏览器实例复用、全局配置被前一条改掉；用独立数据和 fixture 隔离。"},
{q:"自动化用例一直没发现 bug，这套自动化还有意义吗？",a:"有，回归价值在于防劣化和快速反馈；同时应补充新场景、接口层断言和探索性测试，不能只靠 UI 自动化找新 bug。"},
{q:"自动化脚本报错怎么定位？失败用例怎么分析？",a:"看堆栈、截图、日志、请求响应；区分环境、数据、脚本、产品问题；本地复跑最小步骤定位。"},
{q:"自动化里的日志是怎么处理的？",a:"logging 分级输出到文件与控制台，失败自动截图，记录请求 URL/参数/响应摘要，便于回溯。"},
{q:"UI 自动化的覆盖率怎么统计？UI 和接口自动化怎么分工？",a:"覆盖率按核心流程/需求覆盖统计；接口覆盖业务逻辑与异常，UI 只覆盖关键用户路径。"},
{q:"哪些场景适合做界面自动化？投入产出怎么判断值不值？",s:true,a:"适合：稳定、回归频繁、跨版本重复执行的主流程。\nROI：执行频次 × 节省时间 > 开发与维护成本；一次性、频繁变更、强探索的场景不做。"},
{q:"自动化占比多少？脚本多少条？跑一次要多久？",a:"按实际回答，数字要能对应到用例清单和流水线记录，不要编造。"},
{q:"UI 自动化和手工测试的区别和关系？",a:"手工擅长探索、体验与异常发现；自动化擅长重复回归与快速反馈。两者互补，不是替代关系。"},
{q:"前端自动化你都了解多少？",a:"Selenium/WebDriver、Playwright、Cypress；了解 PO 模式、显式等待、断言、CI 集成与报告。"},
{q:"你们跑自动化是在什么阶段？每日执行还是迭代执行？",a:"提测后跑冒烟与主流程，日常每日定时跑接口回归，迭代末跑全量 UI 回归。"}
]});

window.QB_PARTS.push({name:"五、接口自动化与接口测试",items:[
{q:"接口自动化是怎么做的？框架怎么分层？",s:true,a:"分层：config（环境）→ common（HTTP 客户端、登录、DB、日志）→ api（业务接口封装）→ tests（用例）→ data（测试数据）。\n登录态与 token 在 fixture 里统一处理，用例只写业务步骤与断言；最后接 CI 与 Allure 报告。"},
{q:"接口自动化用例由哪几部分组成？",a:"前置条件（登录、造数）、请求构造（URL/方法/头/参数）、响应断言（状态码/业务码/字段/DB）、后置清理。"},
{q:"接口测试的数据怎么管理？和代码分离还是写在一起？",a:"推荐分离：YAML/JSON/Excel 或数据库造数，用例通过参数化读取；动态数据用唯一标识生成，避免互相污染。"},
{q:"新增或变更的接口，脚本怎么维护？",a:"接口地址与业务封装在 api 层，变更只改封装；契约变更走评审并同步更新用例与断言。"},
{q:"接口之间的动态参数怎么解决？",s:true,a:"上一个接口响应中用 JSONPath/正则提取字段，存入变量或 fixture，再传给下一个接口；必要时做等待与重试。"},
{q:"接口断言怎么做？",s:true,a:"断言 HTTP 状态码、业务 code/message、关键字段值与类型、列表结构与数量、响应时间；涉及写操作再查数据库核对。"},
{q:"登录 token 怎么处理？",a:"调登录接口获取 token，缓存到文件/session 级 fixture；失效自动重新登录，请求头统一注入 Bearer。"},
{q:"接口自动化的前置条件和后置条件怎么设计？",a:"前置：登录、造数、依赖服务可用；后置：删除或标记测试数据、释放资源，保证可重复执行。"},
{q:"接口的签名、加密、验签怎么测？",a:"按文档实现签名算法，验证正常签名、篡改参数、错误密钥、过期时间、重复请求；确认服务端确实验签而不是只做前端校验。"},
{q:"接口测试重点关注什么？测哪些维度？",s:true,a:"功能正确性、参数校验、异常与边界、鉴权与越权、幂等与并发、数据一致性、性能与稳定性、兼容性。"},
{q:"怎么设计接口测试用例？维度有哪些？",a:"正向单参数/组合参数；逆向必填缺失、类型错误、长度越界、非法枚举；权限、幂等、并发、依赖异常。"},
{q:"校验入参都要校验哪些内容？",a:"必填、类型、长度、格式（手机/邮箱/日期）、枚举范围、数值边界、特殊字符与注入、多余字段。"},
{q:"给你一个接口，你怎么测试？",s:true,a:"先读文档明确业务与依赖 → 准备账号与数据 → 正常请求验证结构 → 参数异常与边界 → 鉴权/越权 → 幂等与并发 → 查库核对 → 性能与日志。"},
{q:"GET 请求怎么验证？GET 和 POST 有什么区别？",a:"GET 参数在 URL、幂等可缓存、有长度限制；POST 参数在 body、通常非幂等、可传大数据。验证时关注编码、重复参数、超长 URL。"},
{q:"常见响应码有哪些？400、401、403、404、500 分别什么意思？",s:true,a:"200 成功、201 创建、204 无内容；400 参数错误、401 未认证、403 无权限、404 资源不存在、405 方法不允许、429 限流、500 服务端异常、502/504 网关问题。"},
{q:"请求次数过多返回什么码？请求方法错误返回什么码？",a:"次数过多：429 Too Many Requests；方法错误：405 Method Not Allowed。"},
{q:"幂等性怎么测？数据库重复提交的缺陷怎么测？",a:"同一请求重复发送（含并发），验证只产生一条业务数据、余额/库存只扣一次；用唯一业务号与数据库计数核对。"},
{q:"接口出问题怎么定位？",a:"看请求是否到达、参数是否正确、响应码与业务码、服务日志与 traceId、依赖服务、数据库结果；逐层排除前端、网关、应用、DB。"},
{q:"后端接口正常，但前后端交互导致整个功能异常，怎么排查？",a:"抓包比对请求参数与响应结构，检查字段名/类型/序列化、跨域、鉴权头、编码；确认前端是否按契约解析。"},
{q:"接口测试什么时间介入？什么情况下要做接口测试？",a:"接口开发完成或联调阶段介入；多端共用、核心逻辑、权限与数据一致性场景必做。"},
{q:"Web 测试和接口测试有什么区别？",a:"Web 测试偏端到端用户路径与界面；接口测试偏服务逻辑、参数、异常、鉴权与数据，执行更快、定位更准。"},
{q:"用什么工具做接口测试？公司有没有自研平台？",a:"Postman 调试、pytest+requests 自动化、JMeter 压测；有自研平台则支持用例管理、环境切换与报告。"},
{q:"接口自动化接入 Jenkins 后用例大面积挂掉，可能是什么原因？",a:"环境地址/配置错、token 失效、测试数据被污染、依赖服务未启动、并发冲突、时区/编码差异、网络受限。"},
{q:"接口自动化覆盖率怎么算？",a:"按接口数量与业务路径覆盖统计，而不是代码行覆盖；核心接口与主流程优先做到全覆盖。"},
{q:"接口测试做完之后，界面测试算功能测试吗？",a:"算。接口验证服务逻辑，界面验证用户端到端操作与展示，二者都属于功能测试的不同层次。"},
{q:"返回大批量数据的接口怎么验证？",a:"分页与总数自洽、字段抽样+脚本全量比对、排序稳定、性能与内存、导出结果一致。"}
]});

window.QB_PARTS.push({name:"六、Postman",items:[
{q:"用 Postman 怎么做接口测试？具体步骤是什么？",a:"建 Collection → 配 Environment 变量 → 新建请求（方法/URL/Header/Body）→ 写 Tests 断言 → 保存 → Collection Runner 批量执行 → 查看结果。"},
{q:"用 Postman 怎么做断言？断言怎么设计？",a:"在 Tests 里用 pm.test 断言状态码、响应时间、业务码、字段值与 JSON 结构；断言要覆盖成功与失败两类。"},
{q:"Postman 里参数关联怎么做？",a:"在第一个请求的 Tests 中用 JSONPath 提取字段并 pm.environment.set，后续请求用 {{变量}} 引用。"},
{q:"Postman 怎么实现批量执行？",a:"用 Collection Runner 选择集合与环境，设置迭代次数与数据文件；CI 里用 Newman 命令行执行。"},
{q:"Postman 全局变量怎么加？和环境变量有什么区别？",a:"全局变量对所有集合生效，环境变量按环境切换；优先用环境变量，避免环境污染。"},
{q:"Postman 里常见响应码的含义？",a:"200 成功、201 创建、400 参数错误、401 未认证、403 无权限、404 不存在、429 限流、500 服务端异常。"},
{q:"Postman 和 JMeter 做接口测试有什么区别？",a:"Postman 偏调试与功能验证，脚本化弱；JMeter 偏并发与性能，支持线程组、定时器、聚合报告。"}
]});

window.QB_PARTS.push({name:"七、JMeter 与性能测试",items:[
{q:"用 JMeter 做性能测试 / 压测的流程是什么？",s:true,a:"明确指标 → 场景建模 → 编写脚本（线程组/取样器/断言/定时器）→ 准备数据 → 梯度加压 → 监控资源与业务 → 分析瓶颈 → 输出报告。"},
{q:"用 JMeter 做接口测试怎么做？举个例子详细说明。",a:"线程组 + HTTP 请求（方法/路径/参数/头）+ 响应断言 + 查看结果树/聚合报告；登录接口用 JSON 提取 token 供后续请求使用。"},
{q:"场景：500 并发，包含登录接口和新增接口，新增接口达不到指标就报错，脚本怎么编？登录和新增要放两个线程组吗？",a:"建议两个线程组：登录用 setUp 线程组只跑一次或少量，提取 token 写入属性；新增线程组 500 并发引用 token。\n用断言+If 控制器判断失败，聚合报告看新增接口的 TPS 与 P95。"},
{q:"JMeter 里的控制器有哪些？",a:"简单控制器、循环控制器、Once Only、If、Switch、Random、Throughput、事务控制器、Include。"},
{q:"复杂流程控制、多个控制器叠加使用，举个例子说明。",a:"线程组 → 事务控制器包住一次完整下单 → 循环控制器跑 N 次 → If 控制器按库存/条件分支。"},
{q:"要模拟用户随机行为（50% 看订单、30% 下单、20% 看报表），用哪个控制器？",a:"Random Controller 或 Throughput Controller 按百分比分配。"},
{q:"JMeter 常用定时器有哪些？",a:"固定、随机、高斯随机、常数吞吐量、同步定时器（集合点）、BeanShell 定时器。"},
{q:"压测要传数据怎么办？数据量非常大怎么操作？",a:"用 CSV Data Set Config 读取参数文件；超大数据用分片、分布式压测或数据库造数。"},
{q:"JMeter 里登录获取 token 怎么做？",a:"登录请求后置 JSON Extractor 提取 accessToken，存为变量，后续请求在 Header 引用 ${token}。"},
{q:"多接口 / 串联接口怎么做批量压测？",a:"多个 HTTP 取样器按顺序放同一事务控制器，用提取变量做关联；必要时用 Once Only 控制登录。"},
{q:"聚合报告看哪些指标？平均响应时间、P90、P95 拿哪个和需求对比？",s:true,a:"看 Average、Median、90%/95%/99% Line、Min/Max、Error%、Throughput。\n与需求对比优先看 P95，它代表大多数用户的真实体感。"},
{q:"为什么重点看 P95 而不是平均响应时间？",a:"平均值会被少数极快或极慢请求拉偏，P95 能反映大多数用户的实际体验，也更容易暴露长尾问题。"},
{q:"TPS、QPS、RPS 有什么区别？",s:true,a:"TPS 是每秒事务数（一个完整业务动作）；QPS 是每秒查询数；RPS 是每秒请求数。一个事务可能包含多个请求。"},
{q:"TPS 上不去怎么排查？",s:true,a:"看线程与集合点、脚本逻辑、网络带宽、连接池、数据库慢 SQL/锁、CPU/内存/GC、中间件限流、依赖服务瓶颈；逐层压测定位。"},
{q:"响应时间、并发数、吞吐量之间是什么关系？",a:"利特尔法则：并发数 ≈ 吞吐量 × 响应时间。并发增加初期吞吐上升，到拐点后响应时间陡增、吞吐不再增长。"},
{q:"性能测试怎么判断到了拐点？",a:"继续加压但 TPS 不再上升、响应时间明显上升、错误率升高、资源接近饱和，即为拐点。"},
{q:"性能测试的关注点有哪些？指标怎么确定？",s:true,a:"响应时间、TPS、错误率、资源利用率、稳定性。指标来自业务目标、SLA、历史基线和生产日志。"},
{q:"性能测试用例怎么设计？参数是怎么来的？",a:"按业务比例设计场景（浏览/下单/支付），并发与数据来自生产日志、业务峰值预估和目标 SLA。"},
{q:"负载测试、压力测试、稳定性测试有什么区别？",s:true,a:"负载测试：在预期峰值下验证指标；压力测试：持续加压找极限与拐点；稳定性测试：中低负载长时间运行，观察内存泄漏与性能衰减。"},
{q:"稳定性测试怎么做？基于什么维度决定跑多长时间？",a:"固定负载持续 8–12 小时或 7×24 小时，监控错误率、响应时间、内存/句柄；时长按业务周期和发布窗口决定。"},
{q:"压测时出现瓶颈 / 性能不达标，怎么定位？",s:true,a:"分层排查：压测机与网络 → 网关/限流 → 应用线程与 GC → 连接池 → 数据库慢 SQL/锁 → 缓存/消息队列；结合 APM、日志、线程 dump。"},
{q:"你最大并发测到多少？有没有遇到过内存溢出或响应延迟？",a:"按实际回答，讲清场景、指标和定位过程，不要只报数字。"},
{q:"没有接口怎么做性能测试？",a:"通过 UI 录制/协议录制压测，或找开发提供内部接口；UI 压测成本高，通常只做小规模验证。"},
{q:"测试环境和生产环境的性能差异怎么考虑？",a:"配置、数据量、网络、依赖服务都可能不同；结论要标注环境，生产压测需审批、限流和回滚预案。"},
{q:"压测完之后怎么和数据库核对数据准确性？",a:"核对订单数、库存扣减、金额汇总、状态分布与日志，验证无超卖、无重复、无丢失。"},
{q:"性能测试结论怎么写？",a:"测试场景与指标、实际结果、是否达标、瓶颈与风险、优化建议、环境与数据说明。"},
{q:"一个接口一般压多长时间？是在测试环境还是生产环境压？",a:"基线压测 10–30 分钟，稳定性数小时；一般在测试环境，生产压测需严格审批与保护措施。"},
{q:"做压测时主要观测哪些业务上的不准确（比如并发领料）？",a:"超卖/超领、库存负数、重复单据、状态错乱、金额不平、消息重复消费。"}
]});

window.QB_PARTS.push({name:"八、Linux",items:[
{q:"常用的 Linux 命令有哪些？",s:true,a:"ls/cd/pwd/cp/mv/rm/mkdir、tail/head/less/grep/awk/sed、ps/top/free/df/du、netstat/ss、chmod/chown、tar、systemctl、find。"},
{q:"怎么查看日志？怎么抓日志、过滤 error？",s:true,a:"tail -f app.log 实时看，less 翻页；grep -i error app.log 过滤错误；结合 grep -C 看上下文，awk 按时间段筛选。"},
{q:"怎么查 a.log 里昨天 10 点到 11 点的 500 错误？",a:"按日志时间格式用 awk/sed 截取 10:00–11:00 区间，再 grep ' 500 '；或 grep 时间前缀 + grep 状态码。"},
{q:"怎么查日志里的最后 30 行 / 文件末尾 100 行？",a:"tail -n 30 a.log；tail -n 100 a.log。"},
{q:"grep、awk、sed 分别用在什么场景？sed 除了替换还有什么用法？",a:"grep 查找匹配行；awk 按列统计与格式化输出；sed 流编辑。sed 还可删除行、插入、按行号打印、批量替换。"},
{q:"怎么查看磁盘空间、内存、CPU 占用？",a:"df -h 磁盘、du -sh 目录、free -m 内存、top/htop CPU 与进程。"},
{q:"怎么查看占用内存最多的进程？怎么看进程？",a:"ps aux --sort=-%mem | head；ps -ef 看进程，top 按 M 排序。"},
{q:"怎么查网络端口？怎么查防火墙是否关闭？",a:"ss -lntp 或 netstat -tlnp；防火墙 systemctl status firewalld / iptables -L。"},
{q:"修改文件权限用什么命令？可读可写、可读可写可执行分别怎么给？",a:"chmod；读写 6（r+w），读写执行 7（rwx），如 chmod 644 file、chmod 755 dir。"},
{q:"权限的读写执行用数字怎么表示？给文件夹加权限怎么写？",a:"r=4、w=2、x=1；文件夹常用 chmod 755 或 chmod -R 755 dir。"},
{q:"文件查找用什么命令？修改文件名用什么命令？",a:"find /path -name '*.log'；改名用 mv old new。"},
{q:"移动文件、复制文件、两台服务器之间复制文件分别用什么命令？",a:"mv、cp、scp（或 rsync）。"},
{q:"打包压缩文件用什么命令？解压呢？",a:"tar -zcvf x.tar.gz dir；解压 tar -zxvf x.tar.gz。"},
{q:"软链接怎么建？",a:"ln -s /target /link。"},
{q:"怎么确认一个文件是否存在？",a:"test -f file && echo yes；或 [ -f file ]；脚本里用 -e 判断存在。"},
{q:"怎么查 IP、改 IP？",a:"ip addr / ifconfig 查看；修改 /etc/sysconfig/network-scripts 下网卡配置或 nmcli。"},
{q:"Shell 脚本怎么用？你写过什么脚本？",a:"用于启停服务、日志清理、备份、环境巡检、批量执行；讲一个真实脚本的目的与关键步骤。"},
{q:"Shell 里 #、$?、$#、$*、$2 分别代表什么？",a:"# 注释；$? 上一条命令退出码；$# 参数个数；$* 全部参数；$2 第二个参数。"},
{q:"自动化里怎么登录 Linux 服务器执行命令？（Python 连 Linux）",a:"paramiko 建立 SSH 连接执行命令并读取输出；或用 pexpect 处理交互。"},
{q:"怎么查看服务占用了哪些端口？怎么部署服务？",a:"ss -lntp | grep 端口 或 lsof -i:端口；部署 jar 用 nohup java -jar，前端用 nginx。"},
{q:"Linux 怎么排查系统异常？",a:"top/free/df 看资源，dmesg 看内核，journalctl/systemctl 看服务日志，再结合应用日志定位。"},
{q:"CentOS 装包用什么命令？",a:"yum 或 dnf，如 yum install -y 包名。"},
{q:"除了 CentOS，还了解哪些 Linux 系统？",a:"Ubuntu/Debian、CentOS/RHEL、Alma/Rocky、麒麟/统信等国产系统。"}
]});

window.QB_PARTS.push({name:"九、MySQL 与数据库",items:[
{q:"MySQL 增删改查语句分别怎么写？",s:true,a:"insert into t(a,b) values(1,2)；select * from t where id=1；update t set a=2 where id=1；delete from t where id=1。"},
{q:"多表联查怎么写？内连接和外连接的区别和使用场景？",s:true,a:"内连接只返回两表都匹配的行；左/右外连接保留一侧全部行。\n场景：主表+明细用内连接；需要保留主表全部记录（如无明细也要展示）用左连接。"},
{q:"学生表有学号、姓名、性别，怎么查男女各有多少人？",a:"select gender, count(*) from student group by gender;"},
{q:"怎么查单表的第 5 到 8 条数据？怎么确定是第 5 到 8 条？",s:true,a:"select * from t order by id limit 4,4;（limit 偏移, 条数）\n必须先有稳定排序字段，否则分页结果不确定。"},
{q:"索引是什么？你了解哪些索引？怎么判断有没有走索引？",s:true,a:"索引是加速查询的数据结构（MySQL 常用 B+ 树）；有主键、唯一、普通、联合、全文索引。\n用 explain 看 key/type/rows，key 有值且 type 不是 ALL 基本说明走了索引。"},
{q:"了解 SQL 的执行计划吗？怎么看？",a:"explain 加在 SQL 前，关注 type（访问方式）、key（实际索引）、rows（扫描行数）、Extra（是否 filesort/临时表）。"},
{q:"有 10 张表 user1 到 user10，结构一样，给你一个 uid 怎么查它在哪张表？",a:"用 union all 把 10 张表一起查，或用脚本循环查询并在命中时返回表名；数据量大时优先按分表规则直接定位。"},
{q:"写一个你做过的比较复杂的核对 SQL，是为了验证什么？",a:"例如订单金额与明细求和、库存扣减与领用记录、状态分布与业务流水；目的是验证多表数据一致，发现漏记/重复/金额不平。"},
{q:"测试过程中数据库主要用来做什么？",a:"校验落库结果与状态、核对数据一致性、构造与清理测试数据、定位前后端问题。"},
{q:"怎么用数据库验证数据一致性（前端、库、上游三方）？",a:"以业务唯一键关联，比对各方的数量、金额、状态与时间戳；用汇总 SQL 和对账脚本做全量比对。"},
{q:"删除数据、修改数据要注意什么？",a:"先备份或事务，where 条件精确并先 select 确认，避免全表更新；生产环境需审批与权限控制。"},
{q:"Redis 了解多少？在项目里怎么用？",a:"缓存热点数据、分布式锁、会话/验证码；关注缓存穿透/击穿/雪崩、过期策略与一致性。"},
{q:"Kafka 了解吗？",a:"分布式消息队列，用于异步解耦、削峰、日志/事件流；关注分区、消费组、重复消费与积压。"},
{q:"存储单位有哪些？换算关系是什么？",a:"bit → byte(8bit) → KB(1024B) → MB → GB → TB → PB。"}
]});

window.QB_PARTS.push({name:"十、Python",items:[
{q:"Python 常见数据类型有哪些？哪些可变、哪些不可变？",s:true,a:"数字 int/float/complex、布尔 bool、字符串 str、元组 tuple 不可变；列表 list、字典 dict、集合 set 可变。\n不可变对象可作字典键，可变对象不行。"},
{q:"列表和元组的区别？",s:true,a:"列表可变、可增删改，用 []；元组不可变、更轻量、可作字典键，用 ()。\n元组适合固定结构的数据，列表适合需要频繁修改的集合。"},
{q:"列表和字典分别在什么场景用？字典和集合有什么区别？",s:true,a:"列表：有序、可重复、按下标访问，适合队列/结果集。\n字典：键值映射，按 key 快速查找。\n集合：只存唯一元素，用于去重与集合运算；字典存键值对且键唯一。"},
{q:"集合里的元素可以重复吗？",a:"不可以。集合自动去重，且元素必须可哈希；重复加入不会报错但不会增加元素。"},
{q:"is 和 == 的区别？= 和 == 的区别？",s:true,a:"is 比较对象身份（内存地址），== 比较值是否相等；= 是赋值，== 是比较。\n小整数和字符串有驻留机制，is 偶尔为 True 不代表应这样用。"},
{q:"深拷贝和浅拷贝的区别？",s:true,a:"浅拷贝只复制最外层，内层对象仍共享引用（copy.copy、切片、dict.copy）。\n深拷贝递归复制所有层级（copy.deepcopy）；嵌套可变对象改动会互相影响时要深拷贝。"},
{q:"*args 和 **kwargs 的区别？",a:"*args 接收任意位置参数，打包成元组；**kwargs 接收任意关键字参数，打包成字典。\n常用于封装通用函数和装饰器。"},
{q:"装饰器是什么？怎么实现？你用过哪些装饰器？",s:true,a:"装饰器是接收函数并返回新函数的高阶函数，用于在不改原函数的情况下增加日志、计时、重试、权限等能力。\n实现：外层接收 func，内层 wrapper 执行前后逻辑并调用 func，返回 wrapper，用 @decorator 语法。\n用过：日志、耗时统计、失败重试、pytest fixture、allure 步骤。"},
{q:"try / except / else / finally 的执行顺序和执行内容？",s:true,a:"先执行 try；异常则进对应 except；无异常执行 else；finally 无论是否异常都执行，常用于释放资源。"},
{q:"常用的异常类型有哪些？异常处理平时怎么做？",a:"ValueError、TypeError、KeyError、IndexError、AttributeError、FileNotFoundError、TimeoutError。\n处理原则：捕获具体异常、记录日志、必要时重试或抛出，不用裸 except 吞掉所有错误。"},
{q:"生成器是什么？和迭代器有什么区别？可迭代对象有哪些？",a:"生成器用 yield 逐个产出值，惰性计算、省内存；生成器一定是迭代器，迭代器不一定生成器。\n可迭代对象：list、tuple、str、dict、set、range、文件对象。"},
{q:"进程、线程、协程的区别？哪个占资源大？GIL 是什么？",s:true,a:"进程独立内存、资源开销最大；线程共享进程内存、开销较小；协程在单线程内协作式切换、最轻量。\nGIL 是 CPython 全局解释器锁，同一时刻只允许一个线程执行字节码，所以 CPU 密集用多进程，IO 密集用线程/协程。"},
{q:"同步和异步的区别？",a:"同步按顺序等待上一步完成；异步发起后不阻塞，通过回调/await 获取结果，适合 IO 密集场景。"},
{q:"实例方法、类方法、静态方法有什么区别？分别怎么用？",s:true,a:"实例方法第一参数 self，访问实例属性；类方法用 @classmethod，第一参数 cls，可访问类属性、常用于工厂方法；静态方法用 @staticmethod，无 self/cls，相当于放在类里的普通函数。\n工具类方法、无需访问实例时用静态方法。"},
{q:"继承是什么？子类怎么调用父类的方法？super 怎么用？",a:"继承让子类复用父类属性与方法并扩展。\n子类中用 super().方法() 调用父类实现，常见于 __init__ 中初始化父类。"},
{q:"self 的作用是什么？",a:"self 指向当前实例，用于访问实例属性和方法；Python 显式传递 self，名字可改但不建议。"},
{q:"闭包是什么？",a:"内层函数引用外层函数的变量，外层返回内层函数；即使外层执行结束，变量仍被保留。常用于装饰器、工厂函数。"},
{q:"正则表达式里数字怎么表示？你一般在哪些地方用正则？",a:"数字用 \\d 或 [0-9]，多位用 \\d+。\n用于提取响应中的 ID/token、校验手机号/邮箱/日期、日志过滤、字符串替换。"},
{q:"常用的字符串方法有哪些？非空字符和数字怎么表示？",a:"strip、split、join、replace、find、startswith/endswith、upper/lower、format、isdigit。\n正则中非空字符 \\S，数字 \\d。"},
{q:"两个列表合并有哪些方法？",s:true,a:"a + b 生成新列表；a.extend(b) 原地扩展；[*a, *b] 解包；itertools.chain 惰性合并；pandas.concat 处理大数据。"},
{q:"列表去重有哪些方法？去重后再从大到小排序怎么写？",s:true,a:"list(set(lst)) 最简单但会丢顺序；dict.fromkeys(lst) 保序去重；循环判断保序。\n去重后降序：sorted(set(lst), reverse=True)。"},
{q:"sort 和 sorted 有什么区别？升序降序怎么写？",a:"list.sort() 原地修改、返回 None；sorted() 返回新列表、可用于任意可迭代对象。\n升序默认，降序 reverse=True，或 key 自定义排序。"},
{q:"把列表中最后一个元素移到最前面，用什么方法？",a:"lst = lst[-1:] + lst[:-1]；或 lst.insert(0, lst.pop())。"},
{q:"字典怎么合并？怎么加一个键值对？怎么遍历输出键和值？",a:"合并：d1.update(d2) 或 {**d1, **d2} 或 d1 | d2。\n新增：d[key] = value。\n遍历：for k, v in d.items(): print(k, v)。"},
{q:"字典怎么转 JSON？JSON 字符串怎么转字典？有几种方式？",a:"json.dumps(d, ensure_ascii=False) 转字符串；json.loads(s) 转字典。\n也可用 eval（不安全，不推荐）；文件读写用 json.dump/json.load。"},
{q:"怎么获取字典的所有键和值？",a:"d.keys()、d.values()、d.items()；需要列表时用 list(d.keys())。"},
{q:"一行代码写出 1 加到 100 的结果。",a:"sum(range(1, 101))；或 100 * 101 // 2。"},
{q:"用 Python 判断一个数字是奇数还是偶数。",a:"n = int(input())\nprint('偶数' if n % 2 == 0 else '奇数')"},
{q:"输入年月日，输出这一天是当年的第几天。",a:"import datetime\ns = input('YYYY-MM-DD')\nd = datetime.datetime.strptime(s, '%Y-%m-%d')\nprint(d.timetuple().tm_yday)"},
{q:"写一个循环 100 次，第一条命令的结果作为第二条命令的参数，统计正确和错误的次数。",a:"import subprocess\nok = fail = 0\nfor _ in range(100):\n    r = subprocess.run(['cmd1'], capture_output=True, text=True)\n    if r.returncode != 0:\n        fail += 1; continue\n    r2 = subprocess.run(['cmd2', r.stdout.strip()], capture_output=True, text=True)\n    ok += 1 if r2.returncode == 0 else 0\n    fail += 0 if r2.returncode == 0 else 1\nprint(ok, fail)"},
{q:"字符串处理返回一大堆数据，怎么按行输出？读大文件怎么按行读？",a:"按行输出用 splitlines() 或按 \\n 切分后逐行 print。\n大文件不要 read() 全读，用 for line in f 逐行迭代，内存占用稳定。"},
{q:"Python 里怎么定义全局变量？怎么创建文件、修改权限？",a:"模块顶层变量即全局；函数内修改需 global 声明。\n创建：open(path, 'w') 或 pathlib.Path.touch()。\n改权限：os.chmod(path, 0o644)。"},
{q:"三元表达式怎么写？",a:"值1 if 条件 else 值2，例如 '通过' if ok else '失败'。"},
{q:"Python 的内存管理是怎么实现的？",a:"引用计数为主，分代垃圾回收处理循环引用；小整数/字符串有驻留与内存池，对象释放由解释器自动管理。"},
{q:"你常用哪些标准库和第三方库？",a:"标准库：os、sys、json、re、time、datetime、random、subprocess、pathlib、logging。\n第三方：requests、pytest、selenium、allure-pytest、pymysql、paramiko、faker、ddddocr。"},
{q:"造测试数据用什么库？",a:"Faker 生成姓名/手机号/地址；random 生成随机值与边界；pandas 批量构造；结合数据库脚本批量插入。"},
{q:"怎么获取时间戳？时间怎么格式化？",a:"time.time() 秒级时间戳，time.time_ns() 纳秒；datetime.now().strftime('%Y-%m-%d %H:%M:%S') 格式化。"},
{q:"你 Python 用了多久？一个周期能写多少代码？代码量怎么样？",a:"按实际答，强调能独立写自动化框架、接口用例和数据处理脚本，不虚报行数。"},
{q:"你用 Python 具体做过什么？",a:"接口自动化框架、UI 自动化、测试数据生成、日志与数据库校验、报表比对脚本、CI 集成。"},
{q:"Python 的序列有哪些？",a:"list、tuple、str、bytes、range，以及自定义实现 __getitem__ 的对象。"}
]});

window.QB_PARTS.push({name:"十一、AI 与大模型测试",items:[
{q:"RAG 是什么？完整链路是怎样的？每一步可能出现什么问题？",s:true,a:"链路：文档采集 → 解析 → 切分 → 向量化 → 入库 → 检索 → 重排 → 拼 Prompt → LLM 生成 → 引用返回。\n问题：解析丢表格/图片、切分断章、embedding 模型不匹配、检索召回低、rerank 误排、上下文超长、生成幻觉、引用错位。"},
{q:"RAG 的全链路测试流程怎么做？",s:true,a:"数据层：文档完整性、切分质量、向量入库数量与维度。\n检索层：Recall@K、MRR、上下文精确率。\n生成层：忠实度、答案相关性、引用正确性。\n端到端：60–100 条标注集跑通过率；再做性能、并发、安全与回归。"},
{q:"RAG 的底层流程是什么？原始文档在 RAG 里怎么处理？",a:"原始文档先解析为文本（PDF/Word/HTML），清洗去噪，按语义或固定长度切块并保留元数据，再 embedding 入向量库；查询时同样向量化并检索。"},
{q:"文档分页了怎么办？表格、图文混排文档入库怎么测？",a:"分页要保留页码与章节元数据，切分时避免跨页断句；表格按行列结构化或转 Markdown，图片走 OCR/多模态描述。\n测试：跨页问题能否召回、表格数值是否错位、图片描述是否准确。"},
{q:"文档切分怎么影响召回？",s:true,a:"切得太碎会丢上下文，答案不完整；切得太大会混入噪声、浪费上下文窗口。\n常用按段落/标题切分并设置 overlap；测试用同一批问题对比不同 chunk_size 的 Recall 与答案完整度。"},
{q:"向量库的原理是什么？向量召回怎么做的？",a:"文本经 embedding 变成高维向量，向量库用余弦/内积计算相似度，并用 HNSW/IVF 等近似最近邻索引加速。\n查询时把问题向量化，取 Top-K 最相似片段。"},
{q:"召回率和精确率怎么理解？阈值怎么设定、多少算达标？",s:true,a:"召回率：相关片段中被找回的比例；精确率：找回结果中真正相关的比例。\n阈值按业务：知识问答通常 Recall@5 ≥ 0.8、精确率 ≥ 0.7；最终以标注集上的 F1 和端到端通过率为准。"},
{q:"上下文召回率是什么？怎么计算？",a:"衡量标准答案所需的信息有多少被检索上下文覆盖。\n计算：标注每个问题所需证据片段，统计被召回的比例 = 命中证据数 / 应召回证据总数。"},
{q:"RAGAS 是什么？RAG 测试有哪些指标？",a:"RAGAS 是 RAG 评估框架，常用指标：Faithfulness（忠实度）、Answer Relevancy（答案相关性）、Context Precision、Context Recall。\n还可加引用准确率、答案完整度、延迟与成本。"},
{q:"忠实度（忠诚度）是什么？和正确率差在哪？百分比怎么算？",a:"忠实度：回答中的每个结论是否能被检索上下文支持，衡量有没有编造；正确率：回答是否与标准答案一致。\n计算：被上下文支持的陈述数 / 总陈述数 × 100%。"},
{q:"大模型有幻觉，怎么测？怎么用脚本判断一条回答是幻觉？",s:true,a:"构造无答案、诱导性、时效性问题；检查回答是否有上下文/知识库依据。\n脚本判断：抽取回答中的事实陈述 → 在检索片段中做证据匹配（字符串/语义相似/NLI）→ 无证据支持的判为疑似幻觉，再用 LLM Judge 复核。"},
{q:"评判大模型用的什么模型？为什么不用同一家的模型？",a:"常用 GPT-4o、Claude、Qwen 等作为 Judge；避免与被测模型同源，减少自偏好和同风格偏差，必要时多模型投票。"},
{q:"大模型输出的评估标准是什么？具体流程和量化指标是怎样的（100 条里多少条通过算过）？",s:true,a:"标准：事实正确、忠实于上下文、切题、完整、格式合规、无安全问题。\n流程：建 100 条标注集 → 人工定义 rubric → 自动指标 + LLM/人工评分 → 统计通过率。\n通常核心场景 ≥ 90% 通过，一般场景 ≥ 80%，安全类必须 100%。"},
{q:"怎么评估一个大模型应用的好坏？指标有哪些？",a:"效果：准确率、忠实度、相关性、完整性、引用正确率；体验：首字延迟、端到端耗时；工程：并发、成本、稳定性；安全：拒答、越权、注入防护。"},
{q:"知识库里没有答案的场景怎么测？",a:"应明确说不知道或建议转人工，不能编造；用无答案集测拒答率与误拒率，并检查是否给出错误引用。"},
{q:"多轮对话怎么判断记忆算通过？短期和长期记忆怎么实现、怎么验证？",a:"短期靠上下文窗口/会话缓存，长期靠摘要或向量库。\n验证：后续轮次追问前文实体、约束与指代，回答保持一致；跨会话验证用户偏好是否被正确记住且不越权。"},
{q:"同一问题多次提问，第一次和第二次回答不一致，怎么处理？",a:"先看 temperature/top_p 与是否命中不同检索片段；用多次采样统计语义一致性。\n产品上可固定低温度、缓存稳定答案；测试上允许表述差异但关键事实必须一致。"},
{q:"大模型输出和问题完全不相关，但把问题复述了一遍、关键词也包进去了，怎么判断？",a:"不能只看关键词重合。用答案相关性评分：是否直接回答了问题、是否提供新信息；可用 LLM Judge + 人工 rubric，检测复述套话。"},
{q:"AI 同一个输入输出时好时坏，怎么处理？",a:"固定随机性（temperature=0、固定 seed）、固定检索结果；用多次采样看分布，按业务设通过阈值，不因单次波动判失败。"},
{q:"AI 功能没有固定回复，断言怎么设计？",a:"用 rubric 断言：必须包含的事实点、禁止出现的内容、引用来源、格式；结合语义相似度与 LLM Judge，避免字符串精确匹配。"},
{q:"提示词和约束条件是测试维护还是开发维护？",a:"通常算法/开发维护，测试评审并版本化；测试负责验证约束是否生效、回归提示词变更影响。"},
{q:"Agent 是什么？完整链路是怎样的？了解哪些框架？",a:"Agent 能感知任务、规划步骤、调用工具、观察结果并迭代。\n链路：理解目标 → 计划 → 工具调用 → 结果观察 → 反思/重试 → 输出。\n框架：LangChain/LangGraph、Dify、AutoGen、CrewAI。"},
{q:"Skill 是什么？对模型输出起什么作用？Skill 和 RAG 是什么关系？",a:"Skill 是可复用的能力封装（工具/流程/提示模板），让模型按固定方法完成任务；RAG 提供外部知识，Skill 提供做事方法，二者互补。"},
{q:"MCP 了解吗？",a:"Model Context Protocol，统一模型与外部工具/数据源的接入协议，让 Agent 以标准方式发现和调用工具。"},
{q:"LangChain、FastAPI、Vite 在项目里各自起什么作用？",a:"LangChain 编排模型、检索与工具链；FastAPI 提供后端 API 与流式输出；Vite 构建前端页面。"},
{q:"训练、微调、RAG、Agent 分别是什么？适用场景有什么区别？",a:"训练从零学参数，成本最高；微调在基座模型上适配领域风格/任务；RAG 外挂知识、更新快、可溯源；Agent 让模型规划并调用工具完成多步任务。\n知识频繁更新用 RAG，固定任务风格用微调，多步操作外部系统用 Agent。"},
{q:"温度系数（temperature）的作用和影响？",a:"控制采样随机性：越低越确定、适合事实问答；越高越发散、适合创意生成。测试需固定温度保证可复现。"},
{q:"模型参数规模（比如 72B、32B）是什么意思？本地部署怎么选型？",a:"B 指十亿参数，规模越大能力通常越强但显存与延迟越高。\n选型看显存、并发、延迟和效果评测，不只看参数量。"},
{q:"量化原理是什么？",a:"把权重从 FP16/FP32 压缩到 INT8/INT4 等低精度，减少显存和带宽、提升推理速度，代价是轻微精度损失。"},
{q:"用 Ollama 部署大模型有哪些参数规模？怎么选型？",a:"常见 1B/3B/7B/8B/14B/32B/70B 等量化版本；按显存、并发与效果评测选，先用小模型验证链路再上大模型。"},
{q:"本地部署的大模型怎么对外提供服务？",a:"ollama serve 暴露 API，前面加 FastAPI/Nginx 网关做鉴权、限流、日志与流式转发。"},
{q:"大模型响应慢怎么优化？线上大模型服务怎么做监控？",a:"优化：流式输出、缩短上下文、缓存、并发批处理、量化、GPU 扩容、检索裁剪。\n监控：首字延迟、端到端耗时、TPS、错误率、token 消耗、GPU 利用率、队列长度。"},
{q:"SSE 流式协议是什么？解析器怎么写的？",a:"SSE 基于 HTTP 长连接，服务端持续推送 data: 事件。\n解析：按行读取，遇到空行分帧，提取 data: 后拼接，处理 [DONE] 结束；注意超时、断线重连与增量渲染。"},
{q:"大模型用什么方式接入？智能体会不会访问外部信息？",a:"通过 HTTP/OpenAI 兼容 API 或 SDK 接入，配鉴权、超时、重试与流式。\n智能体是否访问外部信息取决于是否配置工具/检索权限，需要验证越权与数据边界。"},
{q:"传统测试和 AI 测试有什么区别？Web 测试和智能体测试有什么区别？",s:true,a:"传统测试结果确定、断言精确；AI 输出概率性、需评测集与 rubric。\nWeb 测试关注页面与接口；智能体测试关注规划是否正确、工具调用参数与顺序、状态保持、安全与成本。"},
{q:"智能体的测试重点是什么？",a:"任务完成率、规划合理性、工具选择与参数正确性、多轮状态、异常恢复、越权与注入、调用成本与延迟。"},
{q:"AI 生成的用例怎么判断业务上正确？需求文档写得不好、缺少上下文怎么办？",a:"用需求条款、业务规则和已有用例作为校验集，人工评审关键路径；文档不全时拉产品对齐并补术语表，AI 只做初稿。"},
{q:"你用过哪些 AI 工具？具体怎么提效（造数据、写用例、写脚本）？token 用了多少？",s:true,a:"用途：生成用例初稿、造测试数据、写 pytest/SQL 脚本、总结日志、辅助定位。\n流程：给需求+约束+输出格式 → 人工评审修订。token 用量按实际平台账单回答。"},
{q:"用 AI 生成测试用例需要提供什么数据？用例里 AI 占比多少？",a:"提供需求/原型、业务规则、接口文档、历史用例与缺陷、输出模板。\nAI 适合生成初稿与补充边界，核心场景人工设计；占比按实际，通常初稿 50%–70%，需人工评审。"},
{q:"AI 的优势和劣势是什么？",a:"优势：快、覆盖广、能补边界与文案；劣势：会编造、缺业务上下文、质量不稳定，必须人工校验。"},
{q:"你觉得怎么构建 AI 能力才有竞争力？",a:"把 AI 嵌入真实业务闭环：高质量数据与评测集、可观测与反馈机制、成本与延迟优化、安全合规，而不是只接一个模型。"}
]});

window.QB_PARTS.push({name:"十二、持续集成、Jenkins 与 Git",items:[
{q:"你对持续集成怎么理解？",s:true,a:"开发频繁提交到主干，自动触发构建、静态检查、单元/接口测试与部署，快速发现集成问题，保证随时可发布。"},
{q:"你用 Jenkins 做了什么？大概讲一下你们的 Jenkins 流程。",a:"拉代码 → 装依赖 → 构建镜像/启动环境 → 跑接口与 UI 用例 → 生成 Allure 报告 → 归档并通知。"},
{q:"Jenkins 流水线里 JMeter 相关的配置项有哪些？Jenkins 加 JMeter 的完整流程怎么做？",a:"配置 JMeter 路径、jmx 脚本、CSV 数据、线程数与持续时间、报告输出；流程：构建 → 执行 jmeter -n -t x.jmx -l result.jtl → 生成 HTML 报告 → 归档。"},
{q:"接口自动化接 Jenkins 后用例大面积挂掉，原因是什么？",a:"环境地址/配置错、token 失效、数据污染、依赖服务未启动、并发冲突、网络与编码差异、时区问题。"},
{q:"用 Jenkins 一般怎么管控版本、怎么跟包？",a:"按分支/标签触发构建，构建号关联 commit；产物归档并记录版本号，测试按构建号取包验证。"},
{q:"了解 Git 吗？切换分支用什么命令？",a:"git checkout 分支 / git switch 分支；查看分支 git branch -a。"},
{q:"提交代码和主分支有冲突怎么解决？",a:"先 git fetch 拉最新，切到分支 rebase 或 merge 主干，解决冲突后测试再提交；避免直接强推主干。"},
{q:"自动化代码上库冲突怎么处理？",a:"小步提交、按模块分工，冲突时沟通后合并；公共文件改动先同步，合并后本地跑一遍再推。"},

</script>
<script>
(function(){
  var KEY_ANS = 'stqb_answers_v1';
  var KEY_DONE = 'stqb_done_v1';
  var KEY_PICK = 'stqb_picks_v1';
  var parts = window.QB_PARTS || [];
  var all = [];
  parts.forEach(function(cat, ci){
    (cat.items || []).forEach(function(it, qi){
      all.push({
        id: 'c' + ci + 'q' + qi, ci: ci, qi: qi, cat: cat.name,
        q: it.q, s: !!it.s, a: it.a || '', t: it.t || 'qa',
        o: it.o || [], k: it.k
      });
    });
  });

  var answers = load(KEY_ANS, {});
  var done = load(KEY_DONE, {});
  var picks = load(KEY_PICK, {});
  var state = { cat: -1, filter: 'all', type: 'all', q: '', idx: 0 };

  function load(k, d){ try{ return JSON.parse(localStorage.getItem(k)) || d; }catch(e){ return d; } }
  function save(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }

  function filtered(){
    var out = all.filter(function(x){
      if(state.cat >= 0 && x.ci !== state.cat) return false;
      if(state.filter === 'star' && !x.s) return false;
      if(state.filter === 'todo' && done[x.id]) return false;
      if(state.filter === 'done' && !done[x.id]) return false;
      if(state.type !== 'all' && x.t !== state.type) return false;
      if(state.q){
        var q = state.q.toLowerCase();
        if((x.q + ' ' + x.cat).toLowerCase().indexOf(q) < 0) return false;
      }
      return true;
    });
    return out;
  }

  function current(){ var f = filtered(); if(state.idx >= f.length) state.idx = Math.max(0, f.length - 1); return { list: f, item: f[state.idx] }; }

  function renderCats(){
    var html = '<button class="cat ' + (state.cat < 0 ? 'on' : '') + '" data-c="-1"><span class="n">全部分类</span><span class="c">' + all.length + '</span></button>';
    parts.forEach(function(cat, ci){
      var total = (cat.items || []).length, ok = 0;
      (cat.items || []).forEach(function(it, qi){ if(done['c' + ci + 'q' + qi]) ok++; });
      html += '<button class="cat ' + (state.cat === ci ? 'on' : '') + '" data-c="' + ci + '"><span class="n">' + esc(cat.name) + '</span><span class="c">' + ok + '/' + total + '</span></button>';
    });
    document.getElementById('cats').innerHTML = html;
  }

  function renderProgress(){
    var total = all.length, ok = Object.keys(done).filter(function(k){ return done[k]; }).length;
    document.getElementById('progText').textContent = '已掌握 ' + ok + ' / ' + total;
    document.getElementById('progBar').style.width = (total ? (ok / total * 100) : 0) + '%';
  }

  function renderGrid(list){
    var cur = list[state.idx] ? list[state.idx].id : null;
    var html = list.map(function(x, i){
      return '<button class="gbtn ' + (x.id === cur ? 'on ' : '') + (x.s ? 'star ' : '') + (done[x.id] ? 'done' : '') + '" data-i="' + i + '" title="' + esc(x.q) + '">' + (i + 1) + '</button>';
    }).join('');
    document.getElementById('grid').innerHTML = html || '<div class="empty" style="grid-column:1/-1;padding:16px">没有匹配的题目</div>';
  }

  function render(){
    var c = current();
    renderCats(); renderProgress(); renderGrid(c.list);
    var body = document.getElementById('stageBody');
    if(!c.item){
      body.innerHTML = '<div class="panel empty">没有匹配的题目，换个筛选或搜索词试试。</div>';
      return;
    }
    var x = c.item, isDone = !!done[x.id];
    var typeName = ({qa:'简答口述', choice:'选择题', fill:'填空题', code:'代码题'})[x.t] || '简答口述';
    var inner;
    if(x.t === 'choice') inner = renderChoice(x, isDone);
    else if(x.t === 'fill') inner = renderFill(x, isDone);
    else if(x.t === 'code') inner = renderCode(x, isDone);
    else inner = renderQA(x, isDone);
    body.innerHTML =
      '<div class="card">' +
        '<div class="qtop">' +
          (x.s ? '<span class="badge">★ 高频题</span>' : '') +
          '<span class="badge warn">' + typeName + '</span>' +
          '<span>' + esc(x.cat) + '</span>' +
          '<span>第 ' + (state.idx + 1) + ' / ' + c.list.length + ' 题</span>' +
          (isDone ? '<span class="badge">已掌握</span>' : '') +
        '</div>' +
        '<h1 class="qtext">' + esc(x.q) + '</h1>' +
        inner +
      '</div>';
    bindCommon(x);
  }

  function masterHtml(isDone){
    return '<button class="btn ' + (isDone ? 'done' : '') + '" id="master">' + (isDone ? '取消已掌握' : '标记已掌握') + '</button>';
  }
  function navHtml(){
    return '<button class="btn ghost" id="prev">上一题</button><button class="btn ghost" id="next">下一题</button>';
  }
  function answerPanel(a, isCode, prefix, open){
    var inner = isCode ? '<pre class="code">' + esc(a) + '</pre>' : renderAnswer(a);
    return '<div class="answer" id="answer"' + (open ? '' : ' hidden') + '><h3>参考解析</h3>' + (prefix || '') + inner + '</div>';
  }

  function renderQA(x, isDone){
    var ans = answers[x.id] || '';
    return '<div class="self-label"><span>先自己答一遍（自动保存在本机）</span><span id="saveHint">' + (ans ? '已保存草稿' : '') + '</span></div>' +
      '<textarea id="selfAns" placeholder="按 背景 → 做法 → 结果 组织语言，写完再对照参考答案…">' + esc(ans) + '</textarea>' +
      '<div class="actions">' + masterHtml(isDone) + '<button class="btn primary" id="reveal" data-label="显示参考答案">显示参考答案</button>' + navHtml() + '</div>' +
      answerPanel(x.a, false, '', false);
  }

  function renderChoice(x, isDone){
    var pick = picks[x.id], letters = ['A','B','C','D','E','F'];
    var opts = (x.o || []).map(function(o, i){
      var cls = 'opt';
      if(pick){
        if(i === x.k) cls += ' correct';
        else if(pick.v === i) cls += ' wrong';
      }
      return '<button class="' + cls + '" data-opt="' + i + '"' + (pick ? ' disabled' : '') + '>' +
        letters[i] + '. ' + esc(o) + '</button>';
    }).join('');
    var verdict = pick ? '<div class="verdict ' + (pick.ok ? 'ok' : 'bad') + '">' +
      (pick.ok ? '✓ 回答正确' : '✗ 回答错误，正确答案是 ' + letters[x.k]) + '</div>' : '';
    return '<div class="options">' + opts + '</div>' + verdict +
      '<div class="actions">' + masterHtml(isDone) +
        (pick ? '<button class="btn ghost" id="retry">重做</button>' : '') +
        '<button class="btn primary" id="reveal" data-label="查看解析">' + (pick ? '隐藏答案' : '查看解析') + '</button>' + navHtml() + '</div>' +
      answerPanel(x.a, false, '', !!pick);
  }

  function renderFill(x, isDone){
    var val = answers[x.id] || '', pick = picks[x.id];
    var verdict = pick ? '<div class="verdict ' + (pick.ok ? 'ok' : 'bad') + '">' + (pick.ok ? '✓ 回答正确' : '✗ 回答错误') + '</div>' : '';
    var first = (x.k && x.k[0]) || '';
    return '<div class="fillrow"><input id="fillAns" value="' + esc(val) + '" placeholder="多个空按顺序用逗号分隔，例如：有效,无效"><button class="btn primary" id="fillSubmit">提交作答</button></div>' +
      verdict +
      '<div class="actions">' + masterHtml(isDone) +
        (pick ? '<button class="btn ghost" id="retry">重做</button>' : '') +
        '<button class="btn primary" id="reveal" data-label="显示答案">' + (pick ? '隐藏答案' : '显示答案') + '</button>' + navHtml() + '</div>' +
      answerPanel(x.a, false, '<div style="margin-bottom:8px">参考答案：<b>' + esc(first) + '</b></div>', !!pick);
  }

  function renderCode(x, isDone){
    var val = answers[x.id] || '';
    return '<div class="self-label"><span>写下你的实现（自动保存在本机）</span><span>对照参考代码自行判定</span></div>' +
      '<textarea id="codeAns" class="code-input" spellcheck="false" placeholder="在此写代码，支持 Python / SQL…">' + esc(val) + '</textarea>' +
      '<div class="actions">' + masterHtml(isDone) + '<button class="btn primary" id="reveal" data-label="显示参考代码">显示参考代码</button>' + navHtml() + '</div>' +
      answerPanel(x.a, true, '', false);
  }

  function normalize(s){
    return String(s == null ? '' : s).toLowerCase()
      .replace(/\s+/g, '')
      .replace(/[，、；;]/g, ',')
      .replace(/。/g, '.');
  }

  function bindCommon(x){
    document.getElementById('master').addEventListener('click', function(){
      if(done[x.id]) delete done[x.id]; else done[x.id] = 1;
      save(KEY_DONE, done); toast(done[x.id] ? '已标记掌握' : '已取消掌握'); render();
    });
    document.getElementById('prev').addEventListener('click', function(){ go(-1); });
    document.getElementById('next').addEventListener('click', function(){ go(1); });
    var revealBtn = document.getElementById('reveal');
    revealBtn.addEventListener('click', function(){
      var box = document.getElementById('answer');
      if(box.hidden){
        box.hidden = false; this.textContent = '隐藏答案';
        box.scrollIntoView({behavior:'smooth', block:'nearest'});
      } else { box.hidden = true; this.textContent = this.getAttribute('data-label') || '查看解析'; }
    });
    var rt = document.getElementById('retry');
    if(rt) rt.addEventListener('click', function(){ delete picks[x.id]; save(KEY_PICK, picks); render(); });
    var ta = document.getElementById('selfAns') || document.getElementById('codeAns');
    if(ta){
      var timer = null;
      ta.addEventListener('input', function(){
        answers[x.id] = ta.value;
        clearTimeout(timer);
        timer = setTimeout(function(){
          save(KEY_ANS, answers);
          var h = document.getElementById('saveHint'); if(h) h.textContent = '已自动保存';
        }, 400);
      });
    }
    document.querySelectorAll('.opt').forEach(function(btn){
      btn.addEventListener('click', function(){
        var i = parseInt(btn.getAttribute('data-opt'), 10);
        var ok = i === x.k;
        picks[x.id] = { v: i, ok: ok };
        if(ok) done[x.id] = 1;
        save(KEY_PICK, picks); save(KEY_DONE, done);
        toast(ok ? '回答正确' : '回答错误'); render();
      });
    });
    var fs = document.getElementById('fillSubmit');
    if(fs){
      var submitFill = function(){
        var input = document.getElementById('fillAns');
        var val = input.value.trim();
        answers[x.id] = val;
        var nv = normalize(val), ok = false;
        (x.k || []).forEach(function(k){ if(normalize(k) === nv) ok = true; });
        picks[x.id] = { ok: ok };
        if(ok) done[x.id] = 1;
        save(KEY_ANS, answers); save(KEY_PICK, picks); save(KEY_DONE, done);
        toast(ok ? '回答正确' : '回答错误，看看参考答案'); render();
      };
      fs.addEventListener('click', submitFill);
      document.getElementById('fillAns').addEventListener('keydown', function(e){
        if(e.key === 'Enter') submitFill();
      });
    }
  }

  function go(step){
    var f = filtered();
    if(!f.length) return;
    state.idx = (state.idx + step + f.length) % f.length;
    render();
  }

  function renderAnswer(a){
    if(!a) return '<div style="color:var(--muted)">本题暂无参考答案。</div>';
    var lines = String(a).split('\n').map(function(s){ return s.trim(); }).filter(Boolean);
    return '<ul>' + lines.map(function(s){ return '<li>' + esc(s) + '</li>'; }).join('') + '</ul>';
  }

  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(ch){
      return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[ch];
    });
  }

  function toast(msg){
    var t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(t._t); t._t = setTimeout(function(){ t.classList.remove('show'); }, 1600);
  }

  document.getElementById('cats').addEventListener('click', function(e){
    var b = e.target.closest('.cat'); if(!b) return;
    state.cat = parseInt(b.getAttribute('data-c'), 10); state.idx = 0;
    if(state.type !== 'all'){
      var has = (state.cat < 0 ? all : (parts[state.cat].items || [])).some(function(it){
        return (it.t || 'qa') === state.type;
      });
      if(!has){ state.type = 'all'; syncTypeChips(); }
    }
    render();
  });
  function syncTypeChips(){
    document.querySelectorAll('.type-filters .chip').forEach(function(c){
      c.classList.toggle('on', c.getAttribute('data-t') === state.type);
    });
  }
  document.querySelector('.filters').addEventListener('click', function(e){
    var b = e.target.closest('.chip'); if(!b) return;
    this.querySelectorAll('.chip').forEach(function(c){ c.classList.remove('on'); });
    b.classList.add('on'); state.filter = b.getAttribute('data-f'); state.idx = 0; render();
  });
  document.querySelector('.type-filters').addEventListener('click', function(e){
    var b = e.target.closest('.chip'); if(!b) return;
    this.querySelectorAll('.chip').forEach(function(c){ c.classList.remove('on'); });
    b.classList.add('on'); state.type = b.getAttribute('data-t'); state.idx = 0; render();
  });
  document.getElementById('search').addEventListener('input', function(){
    state.q = this.value.trim(); state.idx = 0; render();
  });
  document.getElementById('random').addEventListener('click', function(){
    var f = filtered(); if(!f.length) return;
    state.idx = Math.floor(Math.random() * f.length); render();
    toast('随机抽到第 ' + (state.idx + 1) + ' 题');
  });
  document.getElementById('grid').addEventListener('click', function(e){
    var b = e.target.closest('.gbtn'); if(!b) return;
    state.idx = parseInt(b.getAttribute('data-i'), 10); render();
document.getElementById('stageBody').scrollIntoView({behavior:'smooth', block:'start'});
  });
  document.getElementById('reset').addEventListener('click', function(){
    if(!confirm('确定清空所有作答草稿和掌握状态吗？')) return;
    answers = {}; done = {}; picks = {};
    localStorage.removeItem(KEY_ANS); localStorage.removeItem(KEY_DONE); localStorage.removeItem(KEY_PICK);
    render(); toast('已清空');
  });

  document.addEventListener('keydown', function(e){
    if(e.ctrlKey && e.key === 'Enter'){
      e.preventDefault();
      var btn = document.getElementById('reveal');
      if(btn) btn.click();
    }
  });

  render();
})();
</script>
</body>
</html>
