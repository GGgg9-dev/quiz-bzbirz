{q:"合并两个有序数组，排除 0 之后原地排序。",a:"思路：过滤 0 后双指针从尾部归并到原数组，避免额外空间。\n代码：i=len(a)-1, j=len(b)-1, k=...，比较 a[i] 与 b[j] 取大放末尾；最后处理剩余元素。"},
{q:"除自身以外数组的乘积（动态规划）。",a:"思路：先从左到右算前缀积，再从右到左乘后缀积，O(n) 时间、O(1) 额外空间（除结果数组）。\n代码：res=[1]*n; 左遍历 res[i]=res[i-1]*nums[i-1]；右遍历用变量 right 累乘。"},
{q:"最大容水量，追问允许倾斜容器的情况，并解释原理。",a:"标准题：双指针从两端向中间，每次移动较矮的一侧，面积 = 宽度 × 较矮高度。\n倾斜容器：水量取决于最低的瓶颈点与倾斜后溢出的几何关系，需按最低边和开口位置重新计算，不能直接用原公式。"},
{q:"最长不重复子串。",a:"滑动窗口 + 哈希记录字符最近位置；右指针扩张，遇到重复则左指针跳到重复位置后一位，O(n)。\n代码：last={}; left=0; for right,c in enumerate(s): if c in last and last[c]>=left: left=last[c]+1; last[c]=right; ans=max(ans,right-left+1)。"},
{q:"手写二分查找。",a:"def bsearch(a, t):\n    l, r = 0, len(a) - 1\n    while l <= r:\n        m = (l + r) // 2\n        if a[m] == t: return m\n        if a[m] < t: l = m + 1\n        else: r = m - 1\n    return -1"},
{q:"手写冒泡排序，并说明算法思想。",a:"思想：相邻比较，大的往后换，每轮确定一个最大值。\n代码：for i in range(n): for j in range(n-1-i): if a[j]>a[j+1]: a[j],a[j+1]=a[j+1],a[j]；可加提前退出优化。"},
{q:"手写一个链表。",a:"class Node:\n    def __init__(self, v): self.val=v; self.next=None\nclass LinkedList:\n    def __init__(self): self.head=None\n    def add(self, v):\n        n=Node(v)\n        if not self.head: self.head=n; return\n        p=self.head\n        while p.next: p=p.next\n        p.next=n"},
{q:"求一个字符串中最长不重复子串的长度。",a:"同滑动窗口：last 记录字符位置，left 维护窗口起点，ans 取最大窗口长度，时间复杂度 O(n)。"},
{q:"一行代码实现 1 加到 100。",a:"sum(range(1, 101))"},
{q:"判断一个数字是奇数还是偶数。",a:"'偶数' if n % 2 == 0 else '奇数'"},
{q:"输入年月日，输出是当年的第几天。",a:"datetime.datetime.strptime(s,'%Y-%m-%d').timetuple().tm_yday"},
{q:"列表去重后从大到小排序。",a:"sorted(set(lst), reverse=True)"},
{q:"循环 100 次执行两条命令，统计成功次数。",a:"用 subprocess.run 执行，判断 returncode==0 计数；第二条命令的参数取第一条 stdout。"},
{q:"计算树和图的时间复杂度（C 语言）。",a:"树遍历 O(n)，二叉搜索树查找平均 O(log n)、最坏 O(n)；图 BFS/DFS O(V+E)，邻接矩阵 O(V^2)。"},
{q:"255 转二进制。",a:"11111111。"},
{q:"手写 SQL：查第 5 到 8 条数据。",a:"select * from t order by id limit 4, 4;"},
{q:"手写快速排序，说明 partition 思路和复杂度。",s:true,a:"【思路】选基准值，把小于基准的放左边、大于的放右边，再对左右区间递归，属于不稳定排序。\n【代码】\ndef quick(a, l, r):\n    if l >= r: return\n    p = a[l]; i = l\n    for j in range(l + 1, r + 1):\n        if a[j] < p:\n            i += 1; a[i], a[j] = a[j], a[i]\n    a[l], a[i] = a[i], a[l]\n    quick(a, l, i - 1); quick(a, i + 1, r)\n\n【复杂度】平均 O(n log n)，最坏 O(n²)（已有序且固定取首元素），递归栈空间 O(log n)。\n【追问】怎么避免最坏情况？→ 随机选基准或三数取中，小区间改用插入排序。\n【易错】partition 边界写错会死循环或漏元素，i 表示「小于区的最后一个位置」。"},
{q:"反转单链表，分别用迭代和递归实现。",s:true,a:"【思路】迭代用 prev、cur、next 三个指针逐个改指向；递归先反转后续节点，再把当前节点接到新链表尾部。\n【代码】\ndef reverse(head):\n    prev = None\n    while head:\n        nxt = head.next\n        head.next = prev\n        prev = head\n        head = nxt\n    return prev\n\n递归核心：head.next.next = head; head.next = None。\n【复杂度】时间 O(n)，迭代空间 O(1)，递归空间 O(n) 栈。\n【追问】怎么判断链表有环？→ 快慢指针相遇即有环，再从头与相遇点同步走可找入口。\n【易错】迭代时先改 head.next 再保存 next，会把后续节点整段丢掉。"},
{q:"统计字符串中每个字符出现的次数，并按次数从高到低输出。",a:"【思路】用哈希或 Counter 统计频次，再按次数降序排序；同频时按字符排序保证结果稳定。\n【代码】\nfrom collections import Counter\ndef top_chars(s):\n    c = Counter(s)\n    return sorted(c.items(), key=lambda x: (-x[1], x[0]))\n\n【复杂度】时间 O(n + k log k)，k 为不同字符数，空间 O(k)。\n【追问】只统计字母并忽略大小写怎么写？→ 先过滤再 lower 归一化后统计。\n【易错】直接对字典排序得到的是按键排序，必须指定 key 取频次，另需确认空格与中文是否计入。"},
{q:"移动零：把所有 0 移到数组末尾并保持非零元素相对顺序，要求原地。",a:"【思路】双指针，慢指针指向下一个非零元素应放的位置，快指针遍历数组，遇非零就交换。\n【代码】\ndef move_zero(a):\n    i = 0\n    for j in range(len(a)):\n        if a[j] != 0:\n            a[i], a[j] = a[j], a[i]\n            i += 1\n    return a\n\n【复杂度】时间 O(n)，空间 O(1)，每个元素最多访问一次。\n【追问】如果要把指定值 val 都移到末尾呢？→ 把判断条件换成 a[j] != val 即可。\n【易错】用 remove 加 append 会改变非零元素顺序，且每次 remove 是 O(n)，整体退化到 O(n²)。"},
{q:"旋转有序数组（如 4,5,6,7,0,1,2）中查找目标值，要求 O(log n)。",a:"【思路】二分时总有一半有序：判断 mid 落在左段还是右段，再判断 target 是否在该有序区间内，决定收缩方向。\n【代码】\nwhile l <= r:\n    m = (l + r) // 2\n    if a[m] == t: return m\n    if a[l] <= a[m]:\n        if a[l] <= t < a[m]: r = m - 1\n        else: l = m + 1\n    else:\n        if a[m] < t <= a[r]: l = m + 1\n        else: r = m - 1\n\n【复杂度】时间 O(log n)，空间 O(1)。\n【追问】有重复元素还能 O(log n) 吗？→ 不能，a[l]、a[m]、a[r] 相等时只能收缩边界，最坏 O(n)。\n【易错】收缩边界时等号用错（如漏掉 a[l] 或 a[m] 的判断），会漏掉目标值或陷入死循环。"}
]});

window.QB_PARTS.push({name:"十八、HR、软素质与个人情况",items:[
{q:"自我介绍（中文 / 英文都要准备）。",s:true,a:"【结构】基本信息与年限 → 项目与职责 → 核心能力 → 量化亮点 → 求职动机，控制在 90 秒内。\n【内容】有 X 年测试经验，做过 EAM 资产管理和 AI 知识库项目，负责功能、接口与 UI 自动化，落地 14 条接口、21 条 UI 自动化并接入 Jenkins，累计提 100+ 缺陷；擅长把业务状态机和权限拆成可验证的检查点。\n【易错】只罗列工具名不给结果，或把项目背景讲得比自己的产出还长。\n【追问】英文版怎么准备？→ 控制在 60–90 秒，突出 project、automation、impact。"},
{q:"用英文介绍你的项目。",a:"模板：I worked on an EAM asset management platform. My scope covered asset ledger and approval workflows. I designed 220 test cases, built API and UI automation with pytest and Selenium, and integrated them into Jenkins. I also validated role-based permissions and data consistency across the business service and the BPM engine."},
{q:"为什么转行做软件测试？专业不对口怎么解释？",s:true,a:"【原则】不贬低原专业，把它转成优势：原专业训练了逻辑、细致和文档能力。\n【主线】接触项目后发现对质量与用户价值更感兴趣 → 系统学测试理论 → 做出可验证的成果（两个真实项目、自动化脚本、缺陷）→ 明确长期做质量方向。\n【示例】我专业是【】，做过【课程/项目】的测试，发现定位问题并推动修复很有成就感。\n【易错】说测试门槛低、好找工作，等于告诉面试官你没想清楚。"},
{q:"为什么从上一家公司离职？每一段离职原因分别是什么？",s:true,a:"【原则】正向、简短、不抱怨，把离职归到发展而不是逃离。\n【可用理由】项目结束或业务调整、想专注自动化与质量体系、希望进入更有挑战的行业、通勤或家庭原因。\n【一致性】多段经历口径统一，离职时间与简历不能冲突，被追问细节时只给客观事实。\n【易错】吐槽前领导或公司太乱，会让面试官担心你入职后同样抱怨。\n【追问】空档期怎么衔接？→ 说清学习和产出，别只说休息。"},
{q:"空档期这几个月在做什么？",a:"说明在学习与产出：系统补测试理论、做自动化项目、准备面试；最好能拿出可展示的代码或项目，避免只说休息。"},
{q:"职业规划是什么？未来 3 到 5 年想做什么？",a:"1 年：熟悉业务与流程，独立负责模块；2–3 年：成为业务测试骨干，完善接口/UI 自动化与质量度量；3–5 年：向测试开发/质量负责人方向发展，能搭建质量体系。"},
{q:"你的优点和缺点分别是什么？个人核心优势是什么？",a:"优点：细致、责任心强、能推动问题闭环、愿意写自动化。\n缺点：早期过于追求完美导致排期紧，后来学会按风险分级。\n核心优势：业务理解 + 测试设计 + 自动化落地的组合。"},
{q:"工作中最有成就感的事是什么？",a:"选一个可量化、能体现推动力的事：如发现未登录可调接口、搭建自动化把回归从半天缩到 20 分钟、推动权限入口补齐。"},
{q:"遇到最大的挑战是什么？怎么解决的？",a:"用 STAR：挑战（环境不稳/需求不清/时间紧）→ 你的分析 → 具体动作 → 结果与复盘。"},
{q:"印象最深的问题 / 故障是什么？怎么处理的？",a:"讲线上或联调故障：现象 → 定位链路 → 止损 → 修复验证 → 复盘与预防。避免只说「重启好了」。"},
{q:"学习能力怎么证明？平时怎么学习测试知识、怎么保持技术前瞻性？",a:"证据：从零搭自动化、快速接手陌生业务、输出文档；渠道：官方文档、项目实践、技术社区、跟进 AI 测试与工具。"},
{q:"能接受加班吗？能接受 996 吗？抗压能力怎么样？",s:true,a:"【态度】能接受项目需要的阶段性加班和紧急发布支持，这是岗位常识。\n【方法】说明你会用排期、优先级和自动化减少无效加班，比如把重复回归交给接口脚本。\n【边界】可以问清加班频率和调休机制，语气是了解而不是谈判。\n【易错】直接说完全不能加班会出局；反过来空口承诺随时 996 也不可信，入职后容易被压。"},
{q:"能接受出差、外派吗？",a:"按真实意愿回答；可接受则说明频率范围，不接受则给合理边界，避免入职后冲突。"},
{q:"期望薪资是多少？上一家薪资多少？",a:"先给区间并说明依据（年限、技能、城市）；上一家如实说结构（base+奖金），期望涨幅按市场与岗位价值谈。"},
{q:"在职还是离职？什么时候能到岗？",a:"如实回答；离职状态可说 1 周内到岗，在职按交接周期（通常 2–4 周）。"},
{q:"现在人在哪个城市？为什么想来这个城市？家是哪里的？",a:"简短真实，强调稳定性与长期发展，不用过度解释。"},
{q:"父母是做什么的？是独生子女吗？",a:"简短回答即可，重点回到稳定性与家庭支持，不必展开隐私。"},
{q:"你怎么看待外包？",a:"客观：外包能快速接触多行业项目、锻炼适应力，但更希望长期在一个业务里深耕；如果岗位是外包，表达接受并说明看重项目与成长。"},
{q:"你怎么看待自动化测试岗位？手工和自动化你更想做哪个？",a:"两者不是对立：手工做探索与业务理解，自动化做回归与效率；我更倾向自动化+业务结合的岗位，但不会排斥手工。"},
{q:"实际工作里自动化没那么多，你怎么应对？",a:"先把手功能测扎实，识别可自动化的高频回归点，用最小成本做接口自动化；用数据说明收益，逐步推动而不是抱怨。"},
{q:"沟通中对方不配合 / 有冲突怎么处理？",a:"先对齐目标与事实，用数据和证据沟通；找共同利益点，必要时拉负责人决策；对事不对人，留记录。"},
{q:"今天交给你的任务完不成怎么办？",a:"尽早暴露风险而不是截止日才说；拆解剩余工作、排优先级、申请资源或缩小范围，给出可选方案。"},
{q:"需求紧急要求今晚加班支持，你怎么看？",a:"紧急发布可以支持，但先确认范围与验证重点，保证核心链路；事后补回归与复盘，避免长期靠加班兜底。"},
{q:"关键节点开发定位困难，需要你复现支撑，你怎么看？",a:"配合是应该的：提供稳定复现步骤、日志、请求响应和环境信息，帮开发缩小范围；同时记录时间成本，推动根因修复。"},
{q:"之前公司工作压力大吗？团队氛围怎么样？",a:"客观描述：有发布压力但团队协作好；不吐槽前公司，重点说你如何适应与协作。"},
{q:"英语工作环境能适应吗？有没有在英文环境工作过？",a:"如实说读写/口语水平，能读英文文档与 API；如有英文项目经验就举例子。"},
{q:"你为什么选择我们公司？对我们产品了解吗？",a:"提前查产品与业务，讲三点：业务方向认同、岗位匹配、个人能贡献什么；避免只说「公司大/稳定」。"},
{q:"你还有什么想问我的？（务必准备 2-3 个问题）",a:"问业务与团队：这个岗位当前最大的质量挑战是什么？团队测试与开发的配比、自动化现状？入职后 3 个月的期望？\n避免第一轮就问薪资福利。"},
{q:"最近最开心的事是什么？",a:"轻松真实，简短即可，体现积极状态。"},
{q:"有没有获得过公司表彰？有没有独立输出过流程文档并分享？",a:"有就具体说奖项/文档/分享场景；没有就说输出过测试计划、用例规范或复盘文档。"},
{q:"你觉得自己在团队里是什么角色？",a:"质量守门人 + 协作者：既能把关风险，也能补自动化、写文档、带动流程改进。"},
{q:"能不能接受只负责自动化 / 只做功能测试？",a:"表达开放：可以接受阶段性分工，但希望能业务+自动化结合；不要直接拒绝岗位核心职责。"},
{q:"目前手上有其他 offer 吗？如果同时拿到几个 offer 你怎么选？",s:true,a:"【原则】如实说有或没有，不透露别家细节，也不用 offer 施压。\n【排序】先看业务方向与岗位成长，再看团队和自动化现状，最后看薪资与通勤，并给出明确优先级。\n【表达】如果贵司更匹配我的方向，我会优先选择这里，并说清理由。\n【易错】说还在等几家大厂显得你只是备选；编造高薪 offer 被追问细节容易翻车。\n【追问】多久能给答复？→ 给明确时间，别用再看看拖着。"},
{q:"如果入职后发现实际工作和面试时了解的不一样，比如以手工测试为主，你会怎么处理？",a:"【态度】先适应再沟通，不带着情绪下结论。\n【动作】前两周把业务和手工测试做扎实，同时梳理高频回归点，用最小成本做接口自动化，用数据说明收益。\n【沟通】把现状和自己的规划摆到台面上，和主管对齐岗位期望与阶段性分工。\n【易错】直接说那就离职，或者什么都不说憋着干，最后消极怠工。\n【追问】如果一直改变不了呢？→ 设一个观察周期，仍无改善再考虑机会，而不是当天就否定。"},
{q:"你怎么评价自己这次面试的表现？如果最终没通过，你觉得可能是什么原因？",a:"【自评】先讲做得好的：业务例子讲清了，状态机和权限的测试思路表达完整。\n【不足】再讲一个真实的小问题，比如某个技术点答得不够深或项目数据没记住，并说明会怎么补。\n【失败假设】如果是岗位匹配度问题，比如偏开发或偏驻场，我也接受，并说明自己更适配的方向。\n【易错】一味自夸或过度否定；把没通过归因于面试官不懂，直接减分。"},
{q:"入职后第一个月你打算怎么开展工作？",s:true,a:"【第 1 周】读需求与文档、把环境跑通，输出业务流程图和术语表，先验证自己对业务的理解。\n【第 2–3 周】接手一个低风险模块独立测，走完用例评审、执行、提缺陷的完整流程。\n【第 4 周】挑一个高频回归点做成小脚本，或整理一份测试文档，做出可见的增量。\n【易错】一上来就想重构流程或大改自动化，容易踩到历史包袱；也别只坐着等分配任务。"}
]});

window.QB_PARTS.push({name:"十九、Java、C 与其他语言",items:[
{q:"了解 Java 吗？掌握到什么程度？",a:"如实回答：能读代码、写简单接口/单元测试，了解面向对象、集合、异常；不夸大独立开发能力。"},
{q:"这个岗位可能涉及一些后端开发，能接受吗？",a:"可以接受：有 Python/Java 基础，愿意在测试开发方向补后端能力；说明学习计划和已有实践。"},
{q:"C 语言熟悉吗？",a:"如实说：了解指针、数组、结构体与基本语法，能读懂嵌入式/底层代码；有相关项目就举例。"},
{q:"面向对象的三大特性是什么？继承有什么特点？",a:"封装、继承、多态。\n继承：子类复用父类属性和方法，可扩展/重写；单继承（Java 类）、支持多层继承，注意耦合。"},
{q:"重载和重写的区别？",a:"重载：同一类中方法名相同、参数列表不同，编译期决定。\n重写：子类覆盖父类同名同参方法，运行期多态，访问权限不能更严格。"},
{q:"时间复杂度怎么算？常见排序的复杂度是多少？",a:"看基本操作随输入规模的增长阶。\n冒泡/插入/选择 O(n²)，归并/快排平均 O(n log n)，快排最坏 O(n²)，堆排序 O(n log n)，二分 O(log n)。"},
{q:"Java 集合框架你了解哪些？ArrayList、LinkedList、HashMap 各有什么特点？",a:"【体系】Collection 分 List、Set、Queue，Map 单独一支存键值对。\n【List】ArrayList 底层数组，随机访问 O(1)、中间增删要搬元素；LinkedList 是双向链表，增删 O(1)、按下标访问 O(n)，循环里 get(i) 会退化成 O(n²)。\n【Map】HashMap 是数组加链表加红黑树，默认容量 16、负载因子 0.75，允许一个 null 键，key 无序。\n【易错】以为 LinkedList 一定更快；查询为主、数据量中等时 ArrayList 更划算。\n【追问】HashMap 线程安全吗？→ 不安全，并发 put 可能丢数据，多线程用 ConcurrentHashMap。"},
{q:"String、StringBuilder 和 StringBuffer 有什么区别？== 和 equals 呢？",a:"【String】不可变，每次拼接都新建对象，循环里用加号会频繁产生临时对象。\n【Builder/Buffer】可变、原地追加；StringBuilder 非线程安全但更快，StringBuffer 方法加了 synchronized，单线程优先 Builder。\n【== 与 equals】== 比较引用地址，equals 默认也是地址，String 重写后比较内容，比较字符串内容一律用 equals。\n【易错】常量池让两个相同字面量的 == 为 true，容易误以为 == 就是比值。"},
{q:"Java 的异常体系是怎样的？checked 和 unchecked 有什么区别？",a:"【体系】Throwable 分 Error 和 Exception；Exception 再分 RuntimeException（unchecked）和其他 checked 异常。\n【checked】编译期强制处理，如 IOException、SQLException，必须 try-catch 或 throws 声明。\n【unchecked】编译期不检查，如 NullPointerException、IndexOutOfBoundsException，多是编码错误，不该靠 catch 兜。\n【易错】catch Exception 一把抓会把业务异常和系统异常混在一起；finally 里 return 会吞掉异常。\n【追问】测试怎么用？→ 非法入参应返回 400 加统一提示，而不是 500 加裸堆栈，这两类错误要分开断言。"},
{q:"Java 创建线程有哪几种方式？线程池的核心参数是什么？",s:true,a:"【方式】继承 Thread、实现 Runnable、实现 Callable 配 FutureTask 拿返回值，以及提交任务给线程池。\n【核心参数】corePoolSize、maximumPoolSize、keepAliveTime、workQueue、threadFactory、handler 拒绝策略。\n【执行顺序】核心线程满 → 进队列 → 队列满才扩到最大线程 → 再满走拒绝策略，很多人误以为先扩容。\n【易错】Executors 的固定线程池用无界队列，任务堆积不拒绝但可能 OOM。\n【追问】压测怎么验证？→ 看队列长度和拒绝次数，确认拒绝的任务有日志而不是静默丢弃。"},
{q:"C 语言里指针和数组是什么关系？指针运算怎么理解？",a:"【关系】数组名在多数表达式里退化为指向首元素的指针，a[i] 等价于 *(a + i)；但数组名是常量地址，不能被赋值，sizeof(a) 拿到的是整个数组大小。\n【运算】指针加减以元素类型大小为步长，int 指针加 1 地址前进 4 字节；同一数组内两个指针相减得到元素个数。\n【风险】越界访问不会报错，只会读写到相邻内存，是 C 里最典型的崩溃和脏数据来源。\n【追问】函数里为什么 sizeof 拿不到长度？→ 形参 int a[] 实际退化为 int 指针，要额外传长度。"},
{q:"C 语言的内存分区是怎样的？malloc 和 free 要注意什么？",a:"【分区】栈放局部变量和调用信息，自动回收；堆由 malloc/free 手动管理；全局和静态区存全局变量与 static；常量区存字符串字面量，只读。\n【malloc/free】malloc 只分配不清零，calloc 会清零；free 后指针要置空，否则是悬空指针；同一块内存重复 free 属于未定义行为，常直接崩溃。\n【常见问题】忘记 free 造成泄漏；越界写破坏堆管理信息；返回局部数组地址，函数结束即失效。\n【追问】测试怎么发现？→ 长时间稳定性跑 Valgrind 或 ASan，抓泄漏和越界比人工读代码可靠。"}
]});

window.QB_PARTS.push({name:"二十、工具与其他零散问题",items:[
{q:"抓包工具（Fiddler / Charles）什么时候用？怎么用抓包定位前后端问题？",s:true,a:"【用途】定位请求与响应、模拟弱网、Mock 异常返回、验证明文传输与越权。\n【步骤】设代理并装证书 → 按域名过滤 → 复现操作 → 看参数、响应码、响应体与耗时 → 和预期对比。\n【判断】没有请求是前端没发；参数错是前端传参问题；响应错是后端或数据问题；响应对但页面错是渲染或缓存。\n【易错】只设代理不装证书，HTTPS 请求会抓不到或乱码；抓不到包先查是否走内网直连或 VPN。"},
{q:"缺陷管理工具用的什么？禅道缺陷单里有哪些字段？",a:"禅道/Jira；字段：标题、所属产品/项目、模块、版本、严重程度、优先级、重现步骤、预期/实际、附件、指派人、状态、创建人。"},
{q:"用例管理工具用的什么？",a:"禅道、TestLink、Xray/Zephyr、飞书多维表格或自研平台；支持用例分层、需求关联、执行记录与回归集。"},
{q:"Excel 会操作吗？数据驱动怎么用 Excel？",a:"会：筛选、透视表、VLOOKUP、公式。\n数据驱动：pytest 读取 Excel（pandas/openpyxl）参数化，每行一组输入/预期。"},
{q:"会基本的 CAD 命令吗？给一张图纸怎么画出来？三维建模怎么做？",a:"如实回答；会则说图层、直线/圆/偏移/修剪/标注，按尺寸先画基准线再细化；三维用拉伸/旋转/布尔运算。"},
{q:"做过智能化 / 自动化相关的创新吗？优化过流程吗？",a:"讲一个真实改进：如把手工回归改成接口自动化、用脚本生成数据、用 AI 辅助用例初稿，并说明节省的时间。"},
{q:"你修改的代码量大概多少？AI 用了多少 token？",a:"按实际情况说：自动化代码规模、脚本数量、常用 AI 工具与大致用量，不要虚报。"},
{q:"生产环境的单据数据量大概多少？",a:"按实际回答量级（如日增几千、总量百万），说明这对分页、查询性能与测试数据设计的影响。"},
{q:"你有什么好的工作习惯，能让和主管、同事配合更高效？",a:"每日同步进展与风险、问题带方案、文档留痕、按优先级交付、复盘沉淀。"},
{q:"每天怎么反馈测试进展？",a:"固定模板：今日完成、发现问题（等级/影响）、阻塞与风险、明日计划；用群消息或看板同步。"},
{q:"接口还没开发完，或者要验证前端的异常分支，怎么用 Mock？",s:true,a:"【场景】后端接口未就绪、依赖的第三方不稳定、需要造 500、超时、空数据这类异常返回。\n【做法】临时用抓包工具的 Map Local 或 Rewrite 改返回值；成体系的用 Mock 服务（Apifox、Moco、WireMock）按契约定义状态码和响应体。\n【验证】检查前端各分支的提示、兜底和重试；真实接口上线后必须再用真接口回归一次。\n【易错】Mock 的数据结构和真实契约不一致，联调才发现字段名对不上。\n【追问】Mock 和挡板区别？→ 挡板多指模拟外部系统或硬件，本质都是替身。"},
{q:"Git 常用命令有哪些？提交错了或者要回滚怎么处理？",a:"【日常】git clone、pull、status、add、commit -m、push；分支用 git switch -c 新建、git branch -a 查看。\n【撤销】改错文件用 git restore 丢弃工作区改动，git reset 取消暂存；临时切分支用 git stash 和 git stash pop。\n【回滚】已推送的提交用 git revert 生成反向提交并保留历史；reset --hard 会改写历史，只在自己分支且未共享时用。\n【易错】在共享分支 reset 后强推，会把别人的提交一起冲掉，团队协作一律用 revert。\n【追问】怎么只看某次提交？→ git show 提交号。"},
{q:"浏览器 F12 开发者工具常用哪些面板？怎么用它排查问题？",a:"【Network】看请求是否发出、请求头与参数、响应体和状态码、耗时；勾选 Preserve log 防止跳转丢记录，还能模拟弱网。\n【Console】看前端报错和打印，报错行号可直接定位到源码。\n【Application】查 Cookie、LocalStorage、SessionStorage 和缓存，登录态异常多在这里。\n【Elements】看 DOM 与样式，验证显隐、禁用态是否符合预期。\n【追问】常用插件？→ JSON Viewer 格式化响应，ModHeader 改请求头模拟灰度或越权。"},
{q:"curl 怎么发一个带 token 的 POST JSON 请求？",a:"【命令】curl -X POST 接口地址 -H Content-Type:application/json -H Authorization:Bearer token -d 请求体，body 形如 {\"id\":1}。\n【常用参数】-i 看响应头，-v 看完整握手与请求过程，-o 把响应体存文件，--data-urlencode 处理中文和特殊字符。\n【用途】绕开页面直接复验接口，快速区分前端还是后端问题，也方便贴进缺陷单的复现步骤。\n【易错】Windows PowerShell 对单引号和 JSON 双引号处理不同，建议用 Git Bash，或把 body 写进文件用 -d @body.json。"},
{q:"Swagger 或 Apifox 这类接口文档平台怎么用？接口变更了怎么同步？",a:"【用途】查接口定义、参数类型、必填项、枚举和错误码，直接在页面上调试，也能导出集合给 Postman 或 pytest 复用。\n【设计用例】按文档列参数清单做正反向用例，枚举和边界值是重点；用示例响应构造断言基线。\n【变更同步】接口改动回到文档看 diff，确认字段增删、类型变化、必填调整，同步更新自动化断言和 Mock。\n【易错】文档和实现不一致时以实现为准，发现差异要提单，别默默绕开。"},
{q:"禅道或 Jira 这类测试管理工具，你怎么把一个版本的需求、用例、缺陷串起来？",s:true,a:"【建版本】先建版本或迭代，把需求拆成可测条目并关联版本，作为追溯起点。\n【关联用例】用例挂在需求下，标注优先级和是否进回归集；评审通过后形成本版本的执行计划。\n【缺陷闭环】提缺陷时关联需求、用例和版本，修复后回到同一条用例验证，状态流转留痕。\n【看数据】用执行率、缺陷分布和遗留清单出报告，作为准出依据。\n【易错】需求不挂用例，出问题查不到覆盖情况；缺陷不写版本，回归时分不清哪些还没修。"}
]});

<script>
window.QB_PARTS = window.QB_PARTS || [];
window.QB_PARTS.push({name:"二十一、选择题专项（单选）",items:[
{q:"一条完整的测试用例，最少必须包含下列哪组要素？",t:"choice",o:["用例编号、前置条件、步骤、预期结果","需求文档、接口文档、数据库设计说明书","用例标题、执行人、执行环境、截图","开发人员、代码行号、修复版本时间"],k:0,a:"用例的核心是可执行与可判定：用例编号、前置条件、操作步骤、预期结果；其余字段属于管理与追溯信息，缺失不影响执行和判定。"},
{q:"某功能在弱网下 10 次有 3 次失败，主流程可用且有绕过方案，通常应定为？",t:"choice",o:["P0","P1","P2","P3"],k:1,a:"影响主流程、有一定复现概率、存在绕过方案，通常定 P1；P0 用于阻断、资损或数据错误。"},
{q:"边界值分析中，对于范围 1 ≤ x ≤ 100，下列哪组取值最典型？",t:"choice",o:["0、1、2、50、99、100、101","0、1、2、98、99、100","0、1、2、99、100、101","1、2、50、99、100、101"],k:2,a:"边界值取上点、下点与离点：范围 1 ≤ x ≤ 100 时上点为 1、100，离点为 0、101，再补内部代表值 2、99；多取 50 或漏掉某个离点都不典型。"},
{q:"把输入划分为有效等价类和无效等价类，每类取代表值，属于哪种方法？",t:"choice",o:["边界值分析","正交实验法","错误推测法","等价类划分"],k:3,a:"等价类划分的核心是「同类输入对结果等价」，每类取代表值即可大幅减少用例数量。"},
{q:"验证订单状态不能从「待支付」直接跳到「已完成」，最适合用哪种方法设计用例？",t:"choice",o:["状态迁移图","等价类划分","边界值分析","正交实验法"],k:0,a:"状态迁移法列出状态与事件的迁移矩阵，覆盖合法迁移、非法跳转与重复触发。"},
{q:"关于黑盒测试与白盒测试，下列说法正确的是？",t:"choice",o:["黑盒验证输入输出，白盒关注代码逻辑","黑盒关注代码分支覆盖，白盒完全不看代码","白盒完全不看代码，只验证输入输出","黑盒与白盒都只看输入与输出的结果"],k:0,a:"黑盒不看内部实现、从输入输出验证；白盒看代码逻辑与覆盖率，单元和集成阶段都能用。分支覆盖属于白盒指标，黑盒既不看代码也不做覆盖统计。"},
{q:"开发修复缺陷后，验证修复点并确认没有影响其他功能，属于？",t:"choice",o:["冒烟测试","探索式测试","回归测试","验收测试"],k:2,a:"回归测试验证修改未破坏原有功能，覆盖修复点与关联模块。"},
{q:"提测后只跑核心主流程的最小用例集，不通过就打回，这属于？",t:"choice",o:["压力测试","兼容性测试","验收测试","冒烟测试"],k:3,a:"冒烟测试用于快速判断版本是否具备可测性。"},
{q:"下列哪项通常不属于测试准出标准？",t:"choice",o:["P0/P1 缺陷清零且无遗留严重问题","用例执行率达到既定比例","开发完成代码提交并通过自测","遗留缺陷均有明确结论与责任人"],k:2,a:"「开发完成代码提交并通过自测」属于提测准入条件，不是准出标准；准出看缺陷收敛、用例执行率与遗留问题结论。"},
{q:"页面点击按钮后没有任何请求发出，问题最可能在哪一层？",t:"choice",o:["后端接口异常，返回 500 错误","数据库连接已断开或查询结果为空","前端事件未绑定或被本地校验拦截","网关转发规则配错导致请求失败"],k:2,a:"请求根本没有发出，通常是前端事件绑定、按钮状态或本地校验拦截；接口、数据库、网关只有在请求到达之后才可能出问题。"},
{q:"接口返回 401，最可能的原因是？",t:"choice",o:["参数格式错误或缺少必填项","已认证但没有该资源的权限","资源不存在或已被删除","未认证或凭证已过期失效"],k:3,a:"401 是未认证或凭证失效，403 才是已认证但无权限；参数错误通常是 400，资源不存在是 404。"},
{q:"接口返回 429，表示？",t:"choice",o:["请求次数过多被限流拦截","请求方法不被该接口允许","服务端内部异常导致失败","网关等待上游响应超时"],k:0,a:"429 Too Many Requests，常见于限流、频控与配额耗尽。"},
{q:"关于 GET 和 POST，下列说法正确的是？",t:"choice",o:["POST 请求一定幂等，可重复提交","GET 可以携带任意大小的文件","GET 参数在 URL 上，通常幂等","POST 参数只能拼接在 URL 上"],k:2,a:"GET 参数在 URL、幂等且可缓存；POST 参数在 body，通常非幂等。GET 携带大小受 URL 长度限制，POST 参数也不放在 URL 上。"},
{q:"同一笔支付请求重复提交两次，系统只扣一次款，这体现了？",t:"choice",o:["并发性","事务隔离","负载均衡","幂等性"],k:3,a:"幂等性指同一请求重复执行结果一致，不产生重复业务数据。"},
{q:"接口自动化中，下列哪项不属于合理的断言？",t:"choice",o:["开发人员的姓名与提交记录","HTTP 状态码与响应时间","业务 code 与关键字段","响应体字段与数据库表记录"],k:0,a:"断言应验证接口行为与数据，开发人员姓名与接口结果无关。"},
{q:"上一个接口返回的 orderId 要传给下一个接口，正确做法是？",t:"choice",o:["写死在脚本里，每次运行前手工替换参数值","用 JSONPath 提取后存为变量","每次运行前手工复制粘贴","忽略该字段，改用固定假数据"],k:1,a:"接口关联：提取响应字段存为变量，后续请求引用。"},
{q:"性能指标中，P95 响应时间表示？",t:"choice",o:["最快 5% 请求的耗时水平","平均耗时的 95% 而非分位值","错误率达到了 95% 的阈值","95% 请求的耗时不超过该值"],k:3,a:"P95 是分位值，95% 的请求响应时间不超过该值，能反映大多数用户体感。"},
{q:"压测时并发继续增加，但 TPS 不再上升、响应时间陡增，说明？",t:"choice",o:["系统还有明显的性能余量","到达性能拐点，需定位瓶颈","网络带宽不足导致请求丢包","测试数据量太小不具参考性"],k:1,a:"这就是拐点：吞吐不再增长而延迟与错误率上升，需定位瓶颈。"},
{q:"持续加压直到系统出现瓶颈或崩溃，这种测试是？",t:"choice",o:["负载测试：在预期峰值下验证","稳定性测试：长时运行查泄漏","压力测试：持续加压直到崩溃","冒烟测试：快速验证主流程"],k:2,a:"压力测试用于找极限与拐点；负载测试是在预期峰值下验证指标。"},
{q:"中低负载持续运行 8–12 小时，主要观察内存泄漏与性能衰减，属于？",t:"choice",o:["稳定性测试：长时运行查泄漏衰减","压力测试：持续加压直到系统崩溃","兼容性测试：覆盖主流环境与版本组合","回归测试：确认修改未破坏旧功能"],k:0,a:"稳定性测试关注长时间运行下的资源泄漏与性能衰减。"},
{q:"实时查看日志文件新增内容，应使用？",t:"choice",o:["cat app.log（一次性打印全部内容）","head app.log（只看文件开头几行）","less app.log（分页浏览并支持关键字搜索）","tail -f app.log（实时输出新增内容）"],k:3,a:"tail -f 持续输出新增行，适合实时排查。"},
{q:"查看本机监听端口及对应进程，应使用？",t:"choice",o:["df -h（查看各文件系统剩余空间与占用）","ss -lntp（列出监听端口与进程）","free -m（查看内存使用情况）","du -sh（统计目录占用大小）"],k:1,a:"ss -lntp（或 netstat -tlnp）列出监听端口与进程。"},
{q:"给目录设置「所有者读写执行、其他用户读执行」，权限数字是？",t:"choice",o:["644","777","755","600"],k:2,a:"7=rwx、5=r-x，目录常用 755。"},
{q:"查看磁盘空间使用率，应使用？",t:"choice",o:["free -m（查看内存占用情况）","ps -ef（查看进程列表）","df -h（查看磁盘空间使用率）","top（实时查看资源与进程）"],k:2,a:"df -h 看文件系统空间；du 看目录占用。"},
{q:"查询表中第 5 到第 8 条记录（每页 4 条），正确写法是？",t:"choice",o:["limit 5,8","limit 4,4","limit 8,4","limit 4 offset 8"],k:1,a:"limit offset, rows：从第 5 条开始取 4 条，即 limit 4,4。"},
{q:"判断一条 SQL 是否走了索引，最直接的方式是？",t:"choice",o:["explain 看 key 与实际 type","show tables 列出所有表名","select count(*) 统计整表的总记录行数","show index 查看表上的索引定义"],k:0,a:"explain 的 key 字段显示实际使用的索引，type 可看出访问方式。"},
{q:"统计学生表中男女人数，正确写法是？",t:"choice",o:["select gender,count(*) from student order by gender","select gender,count(*) from student group by class","select distinct gender,count(*) from student","select gender,count(*) from student group by gender"],k:3,a:"按性别分组后计数，才能得到每类人数；只排序、只去重或按班级分组都得不到男女各自的人数。"},
{q:"下列哪种 Python 类型是不可变的？",t:"choice",o:["tuple：不可变序列，创建后不能改动","list：可变序列，支持增删改与切片操作","dict：可变映射，按键存取与更新值","set：可变集合，元素自动去重"],k:0,a:"tuple 不可变；list、dict、set 均可变，创建后还能增删改。"},
{q:"想完整复制一个嵌套列表，修改副本不影响原数据，应使用？",t:"choice",o:["b = a 两个变量指向同一列表对象","b = a[:] 切片生成新的外层列表","b = copy.deepcopy(a) 递归复制","b = list(a) 只复制外层，内层仍共享引用"],k:2,a:"切片和 list() 都是浅拷贝，内层对象仍共享；嵌套结构需 deepcopy 递归复制。"},
{q:"Python 中 is 与 == 的区别是？",t:"choice",o:["两者完全等价，可以互相替换","is 比较值，== 比较内存地址","is 只能用于数字类型的比较","is 比较对象身份，== 比较值"],k:3,a:"is 比较是否为同一对象（id），== 比较值是否相等。"},
{q:"给函数增加耗时统计但不修改原函数逻辑，应使用？",t:"choice",o:["继承父类并重写方法","装饰器包装原函数逻辑","多线程并行执行函数","lambda 匿名函数替代"],k:1,a:"装饰器通过包装函数在不改动原函数的情况下增加横切逻辑。"},
{q:"列表去重并保持原有顺序，较稳妥的写法是？",t:"choice",o:["sorted(set(lst)) 去重并按键值排序","list(set(lst)) 去重，但顺序不可控","list(dict.fromkeys(lst)) 保序去重","lst.reverse() 原地反转列表本身，不返回任何新对象"],k:2,a:"dict.fromkeys 按首次出现顺序去重；set 会打乱顺序，sorted 会改变顺序。"},
{q:"try/except/else/finally 中，finally 的执行特点是？",t:"choice",o:["无论是否异常都会执行","只有抛出异常时才执行","只有无异常时才执行","程序正常结束时才执行"],k:0,a:"finally 用于释放资源，无论是否发生异常都会执行。"},
{q:"IO 密集型任务，在 Python 中通常优先选择？",t:"choice",o:["多进程并行","多线程或协程","GPU 加速","汇编优化"],k:1,a:"IO 密集可用线程/协程；CPU 密集受 GIL 限制更适合多进程。"},
{q:"Selenium 中等待某个元素可点击，最推荐的方式是？",t:"choice",o:["time.sleep(5)：固定等待若干秒","隐式等待：全局只设一次超时","刷新页面：重新加载后再查找","显式等待：等元素可点击的条件"],k:3,a:"显式等待针对具体条件轮询，比固定 sleep 更快更稳。"},
{q:"UI 自动化用例单独跑通过、联跑失败，最常见原因是？",t:"choice",o:["浏览器版本过低导致渲染差异","显示器分辨率不一致","测试数据污染或存在顺序依赖","网络带宽波动导致请求超时"],k:2,a:"联跑失败多因数据未隔离、登录态/会话冲突或用例顺序依赖。"},

{q:"student 表的 phone 列允许为空，下列对 count 的描述正确的是？",t:"choice",o:["count(phone) 只统计非 NULL 行","count(*) 会跳过 phone 为 NULL 的整行","count(phone) 与 count(*) 结果总相同","count(*) 只能用于数值类型或整数列"],k:0,a:"count(列) 只统计该列非 NULL 的行；count(*) 统计整表行数并包含 NULL 行，且可用于任意列类型。只有数据中存在 NULL 时，两者结果才会不同。"},
{q:"pytest 中希望一个 fixture 在整个测试会话中只初始化一次（例如登录拿 token），应写？",t:"choice",o:["@pytest.fixture(scope='module')","@pytest.fixture(scope='session')","@pytest.fixture(scope='function')","@pytest.fixture(autouse=True)"],k:1,a:"scope 控制 fixture 生命周期：默认 function 每条用例执行一次，session 整个会话只执行一次，适合复用登录态。module 是每个模块执行一次，function 是每条用例一次；autouse 只表示自动使用，不改变作用域。"},
{q:"接口返回 304 Not Modified，通常说明？",t:"choice",o:["资源不存在或路径已被删除","服务端内部错误导致失败","请求被 301 永久重定向到新地址","协商缓存命中，未返回实体内容"],k:3,a:"304 表示客户端携带 If-None-Match 或 If-Modified-Since 后，服务端判断缓存仍有效，只返回响应头、不返回 body。404 才是资源不存在，500 是服务端错误，301 是永久重定向。"}

window.QB_PARTS.push({name:"二十三、代码题专项",items:[
{q:"用 Python 判断一个字符串是否为回文（忽略大小写与空格）。",t:"code",a:"def is_palindrome(s):\n    t = ''.join(ch.lower() for ch in s if ch.isalnum())\n    return t == t[::-1]\n\nprint(is_palindrome('A man a plan a canal Panama'))  # True"},
{q:"给定整数数组和目标值 target，返回两个数的下标，使其和为 target（假设只有一组答案）。",t:"code",a:"def two_sum(nums, target):\n    seen = {}\n    for i, n in enumerate(nums):\n        if target - n in seen:\n            return [seen[target - n], i]\n        seen[n] = i\n    return []\n\nprint(two_sum([2, 7, 11, 15], 9))  # [0, 1]"},
{q:"手写二分查找，在有序数组中查找目标值，返回下标，找不到返回 -1。",t:"code",a:"def bsearch(a, t):\n    l, r = 0, len(a) - 1\n    while l <= r:\n        m = (l + r) // 2\n        if a[m] == t:\n            return m\n        if a[m] < t:\n            l = m + 1\n        else:\n            r = m - 1\n    return -1\n\nprint(bsearch([1, 3, 5, 7, 9], 7))  # 3"},
{q:"写一个函数，对列表去重并保持原顺序。",t:"code",a:"def dedupe(lst):\n    return list(dict.fromkeys(lst))\n\nprint(dedupe([3, 1, 3, 2, 1]))  # [3, 1, 2]"},
{q:"求字符串中最长不重复子串的长度。",t:"code",a:"def longest_unique(s):\n    last, left, ans = {}, 0, 0\n    for right, ch in enumerate(s):\n        if ch in last and last[ch] >= left:\n            left = last[ch] + 1\n        last[ch] = right\n        ans = max(ans, right - left + 1)\n    return ans\n\nprint(longest_unique('abcabcbb'))  # 3"},
{q:"合并两个有序数组，要求原地合并到第一个数组中（第一个数组尾部预留空间）。",t:"code",a:"def merge(a, m, b, n):\n    i, j, k = m - 1, n - 1, m + n - 1\n    while i >= 0 and j >= 0:\n        if a[i] > b[j]:\n            a[k] = a[i]; i -= 1\n        else:\n            a[k] = b[j]; j -= 1\n        k -= 1\n    a[:k + 1] = b[:j + 1]\n\nnums1 = [1, 2, 3, 0, 0, 0]\nmerge(nums1, 3, [2, 5, 6], 3)\nprint(nums1)  # [1, 2, 2, 3, 5, 6]"},
{q:"给定日志文件，每行形如 `2026-11-07 10:00:01 GET /api 500`，统计各状态码出现的次数。",t:"code",a:"from collections import Counter\n\ndef count_status(path):\n    c = Counter()\n    with open(path, encoding='utf-8') as f:\n        for line in f:\n            parts = line.split()\n            if parts and parts[-1].isdigit():\n                c[parts[-1]] += 1\n    return c\n\nprint(count_status('access.log'))"},
{q:"读取 JSON 响应，提取 data.list 中每个元素的 id 和 name。",t:"code",a:"import json\n\nraw = '{\"data\":{\"list\":[{\"id\":1,\"name\":\"A\"},{\"id\":2,\"name\":\"B\"}]}}'\nobj = json.loads(raw)\nrows = [(x['id'], x['name']) for x in obj['data']['list']]\nprint(rows)  # [(1, 'A'), (2, 'B')]"},
{q:"写一条 SQL：查询订单表中第 5 到第 8 条记录（按 id 升序）。",t:"code",a:"SELECT *\nFROM orders\nORDER BY id\nLIMIT 4, 4;\n\n-- limit offset, rows：跳过 4 条，取 4 条\n-- 必须有稳定排序字段，否则分页结果不确定"},
{q:"写一条 SQL：统计学生表中男、女各有多少人。",t:"code",a:"SELECT gender, COUNT(*) AS total\nFROM student\nGROUP BY gender;\n\n-- 若需要空值分组，可加 WHERE gender IS NOT NULL"},
{q:"用 pytest 写一个参数化登录接口用例，覆盖正确账号、错误密码、空账号三种情况。",t:"code",a:"import pytest\n\n@pytest.mark.parametrize('username,password,expected_code', [\n    ('userEam1', 'correct', 200),\n    ('userEam1', 'wrong', 400),\n    ('', 'any', 400),\n])\ndef test_login(api, username, password, expected_code):\n    resp = api.post('/service-auth/login', {'username': username, 'password': password})\n    assert resp.status_code == expected_code\n    if expected_code == 200:\n        assert resp.json().get('accessToken')"},
{q:"给定数组 nums，返回数组 output，其中 output[i] 等于除 nums[i] 外其余元素的乘积，要求不用除法、O(n) 时间。",t:"code",a:"def product_except_self(nums):\n    n = len(nums)\n    res = [1] * n\n    left = 1\n    for i in range(n):\n        res[i] = left\n        left *= nums[i]\n    right = 1\n    for i in range(n - 1, -1, -1):\n        res[i] *= right\n        right *= nums[i]\n    return res\n\nprint(product_except_self([1, 2, 3, 4]))  # [24, 12, 8, 6]"},
{q:"实现函数 get_header(headers, name)，从请求头字典中按大小写不敏感的方式取值，不存在时返回 None。例如传入 {'Content-Type': 'application/json', 'Authorization': 'Bearer t1'} 和 'authorization'，应返回 'Bearer t1'。",t:"code",a:"def get_header(headers, name):\n    target = name.lower()\n    for k, v in headers.items():\n        if k.lower() == target:\n            return v\n    return None\n\nh = {'Content-Type': 'application/json', 'Authorization': 'Bearer t1'}\nprint(get_header(h, 'authorization'))  # Bearer t1\nprint(get_header(h, 'X-Token'))  # None"},
{q:"用正则把文本中的 11 位手机号脱敏：保留前 3 位和后 4 位，中间 4 位替换为 *。例如 '13812345678' 应输出 '138****5678'。",t:"code",a:"import re\n\ndef mask_phone(text):\n    return re.sub(r'(?<!\\d)(1[3-9]\\d)\\d{4}(\\d{4})(?!\\d)', r'\\1****\\2', text)\n\nprint(mask_phone('联系 13812345678，备用 13900001111。'))\n# 联系 138****5678，备用 139****1111。"},
{q:"给定两个接口响应字典（可能多层嵌套），输出差异列表，元素为 ('新增', 路径, 新值)、('删除', 路径, 旧值)、('变更', 路径, 旧值, 新值)，路径用 a.b.c 表示。",t:"code",a:"def flatten(d, prefix=''):\n    out = {}\n    for k, v in d.items():\n        key = prefix + '.' + k if prefix else k\n        if isinstance(v, dict):\n            out.update(flatten(v, key))\n        else:\n            out[key] = v\n    return out\n\ndef diff(a, b):\n    fa, fb = flatten(a), flatten(b)\n    res = []\n    for k in sorted(set(fa) | set(fb)):\n        if k not in fa:\n            res.append(('新增', k, fb[k]))\n        elif k not in fb:\n            res.append(('删除', k, fa[k]))\n        elif fa[k] != fb[k]:\n            res.append(('变更', k, fa[k], fb[k]))\n    return res\n\nprint(diff({'code': 0, 'data': {'id': 1, 'name': 'A'}}, {'code': 0, 'data': {'id': 1, 'name': 'B', 'status': 1}}))\n# [('变更', 'data.name', 'A', 'B'), ('新增', 'data.status', 1)]"},
{q:"表 api_log(api_name, status, cost_ms, created_at) 记录接口调用，查询每个接口最近一次失败（status >= 400）的记录，输出 api_name、status、cost_ms、created_at。",t:"code",a:"SELECT api_name, status, cost_ms, created_at\nFROM (\n    SELECT api_name, status, cost_ms, created_at,\n           ROW_NUMBER() OVER (PARTITION BY api_name ORDER BY created_at DESC) AS rn\n    FROM api_log\n    WHERE status >= 400\n) t\nWHERE rn = 1;"},
{q:"表 api_log(api_name, status, created_at)，按日期和接口统计当天调用总数、成功数（status < 400）与成功率，成功率用百分比保留两位小数。",t:"code",a:"SELECT DATE(created_at) AS d,\n       api_name,\n       COUNT(*) AS total,\n       SUM(CASE WHEN status < 400 THEN 1 ELSE 0 END) AS success,\n       ROUND(SUM(CASE WHEN status < 400 THEN 1 ELSE 0 END) * 100 / COUNT(*), 2) AS success_rate\nFROM api_log\nGROUP BY DATE(created_at), api_name;"}
]});

{q:"EAM 系统里一笔资产领用从提交、部门审批、财务审批到归档，端到端测试方案怎么设计？",s:true,a:"先画全链路：提交→部门审批→财务审批→归档，列「状态×角色×事件」矩阵，覆盖合法流转、驳回、撤回、加签转办、重复提交与两人并发审批。\n权限分开验：每个节点用对应角色跑通，再用无权限角色直接调接口传单据 ID 和节点 ID，必须返回 403，审批人变更后旧待办要消失。\n数据与通知一起核：每次状态变更对审批日志、主表状态、明细金额、待办生成与消除、站内信和邮件逐项断言，用单据号串起全链路。\n归档后回归：归档单据不可再编辑，附件、审批记录、查询与导出仍可追溯。\n【追问】会签节点一人通过一人驳回，终态按什么规则判？"},
{q:"资产领用要扣库存，怎么验证不超领？事务、幂等、并发、乐观锁和悲观锁分别怎么测？",s:true,a:"先确认扣减时机和口径：提交占用、审批通过实扣还是出库实扣，用「可售=总量−占用−已出」造库存 1、并发 2 的用例，断言只能成功 1 笔且库存不为负。\n并发验证：JMeter 50 到 100 线程打同一 SKU，检查成功笔数等于库存、失败提示明确，查数据库行锁、version 字段与重试日志是否符合设计。\n幂等验证：同一领用单号重复提交、消息重投、前端双击三种来源，只生成一条出库记录、只扣一次库存，用唯一索引或幂等表结果佐证。\n事务边界：扣库存、写台账、改单据状态必须同一事务，注入第三步异常验证全部回滚，不能出现扣了库存却没有单据。\n【易错】只在前端禁用按钮就认为防重，绕过页面直接打接口照样超领。"},
{q:"资产列表页加载超过 3 秒，从前端到数据库你怎么逐层定位瓶颈？",s:true,a:"前端层：看浏览器 Network 瀑布图拆分 DNS、TTFB、下载与渲染耗时，再用本地 mock 数据判断是接口慢还是大量 DOM 与重复渲染。\n接口层：用 curl 或 Postman 直连接口取 P95，看网关与应用日志的分段耗时、线程池与 GC、下游调用次数，确认是否存在 N+1 调用或串行依赖。\n数据库层：开慢查询日志并用 explain 看 type、key、rows，确认缺索引、回表、函数导致索引失效，还是深分页 limit 大偏移。\n数据量验证：按 1 万、10 万、100 万行造数对比，改索引或游标分页后复测 P95，确认是数据量放大而不是代码退化。\n【追问】接口 P95 已经正常但页面仍慢，你下一步查什么？"},
{q:"运营用 Excel 一次导入 5000 条资产，格式校验、部分失败、事务边界、超时和重复导入怎么测？",a:"文件校验：核对模板版本、表头、必填、枚举、长度与文件内重复行，Excel 和 CSV 编码各测一遍，错误必须定位到行号、字段和原因。\n部分失败：先明确策略是全成功才入库还是合法行入库，验证失败明细可下载可修正重传，成功数加失败数要等于文件总行数。\n事务与超时：按 500 条一批分批，注入第 3 批异常观察已提交批次；超过网关超时要走异步任务并提供进度查询，不能前端超时但后台写了一半。\n重复导入：同一文件二次导入按唯一键去重或明确提示，核对资产总数不翻倍，台账与审计日志不重复。\n【易错】只看接口返回导入成功，不核对实际入库条数和失败明细。"},
{q:"老 EAM 迁移到新系统只有 2 小时割接窗口，迁移测试方案怎么设计并保证可回滚？",s:true,a:"迁移前评审映射表：源字段到目标字段的类型、枚举、单位、金额精度、空值和默认值逐项确认，脏数据先出清洗规则并抽样比对。\n全量核对：按主键脚本比对条数、金额合计、状态分布与时间戳，差异输出到具体行和字段，关键单据再人工抽检，不能只看总数相等。\n业务可用性：迁移后老单据能查、能改、能继续走审批与出入库，附件、明细、审批记录和关联关系完整。\n回滚演练：先在预发跑一遍回滚脚本还原基线，割接窗口内验证增量补齐和双写比对，确认回滚后新产生数据不丢不重。\n【追问】迁移后总金额差 0.01 元，你按什么顺序定位到原因？"},
{q:"弱网或断网下提交领用表单，重复提交、草稿、超时重试和幂等怎么验证？",s:true,a:"场景矩阵：用 Charles 或 Fiddler 做限速、延迟、丢包、断网和响应丢弃，覆盖提交前断网、提交中断网、服务端已成功但响应没回来的情况。\n重复提交：超时后系统重试叠加用户手动点击，断言只生成一条单据，以数据库记录和幂等键为准，不看前端提示。\n草稿恢复：断网自动存本地草稿，刷新、切页或换设备后能恢复且字段一致，提交成功后草稿要清除，避免重复带入。\n超时策略：明确超时时间、重试次数和退避间隔，服务端慢事务不能因重试叠加多份数据，用访问日志核对请求次数与落库次数。\n【易错】只测弱网提示文案，不核对服务端是否已经收到并落库。"},
{q:"登录鉴权全链路怎么测：token 签发、过期、刷新、多端登录、越权访问和登出失效？",s:true,a:"签发与过期：检查 token 不含敏感信息、有效期和刷新窗口正确，过期后接口返回 401，刷新后旧 token 按设计失效。\n多端与登出：验证同账号多端策略是互斥还是共存，登出、改密、禁用账号后旧 token 立即失效，黑名单和缓存都要生效。\n越权访问：普通用户直接调管理接口，改 URL 里的 userId、roleId、tenantId，用 A 的 token 读 B 的数据，必须 403 而不是返回数据。\n会话安全：核对 Cookie 的 HttpOnly、Secure、SameSite，CSRF 防护、token 是否出现在 URL 与日志、重放请求是否被拦。\n【追问】token 显示已过期但接口仍返回数据，你先查哪两处？"},
{q:"线上出现审批提交失败、错误率飙升，完整处置流程怎么走？",s:true,a:"发现与止损：先看监控告警、错误率和核心链路可用性，评估影响用户数、单据量和资损，必要时限流、降级、切开关或回滚，先止血再定位。\n定位：按故障时间线拉网关、应用、数据库和中间件日志，用 traceId 串一次失败请求，对比故障前后的发布、配置、数据和证书变更。\n修复与验证：最小改动修复，先灰度或小流量验证核心链路和关键指标回到基线，再逐步全量。\n复盘与补用例：输出时间线、根因、影响面、改进项和责任人，把缺失场景补进监控与回归用例，并跟踪改进项落地。\n【易错】一上来就重启或回滚却不保留现场，根因和证据都丢了。"},
{q:"上游资产主数据接口要删字段、改字段类型，怎么评估影响面并定回归范围？",s:true,a:"先做契约 diff：列出新增、删除、改名、类型、必填和枚举变化，检索代码、配置、报表和下游任务里所有引用，标出受影响的接口、页面和消息。\n风险分级：删除字段和类型变化为高风险，会导致空值或解析失败；新增字段要看是否必填；改名要求兼容期双字段读取。\n回归范围：覆盖受影响接口、核心业务闭环、异常兜底与监控，再造缺字段、脏值、超长和枚举越界各一条用例。\n兼容与观察：确认版本协商或双写兼容期，旧客户端不被新契约打断，上线后盯解析失败率和空值率。\n【追问】上游只是把字段长度从 50 改到 20，你还要不要做回归？"},
{q:"只给你 3 天测一个新需求，作为唯一测试你怎么排计划和取舍？",s:true,a:"先定范围：和产品、开发确认版本目标与不可用风险，按资损、权限、主流程划 P0，不测的部分书面留痕。\n倒排计划：第一天需求确认、用例评审和提测冒烟，第二天主流程与接口、并发，第三天回归加上线验证，末尾留半天 buffer。\n取舍原则：手工只保 P0，P1 用接口自动化兜底，非核心做探索式抽测，依赖改造的模块优先，纯文案和样式后置。\n风险沟通：每天同步进度、缺陷和未覆盖项，准出结论写清有条件上线的监控与回滚条件。\n【易错】闷头把用例全写完再执行，最后核心链路没测完。"},
{q:"异步审批或资产同步任务一直卡在「处理中」，怎么排查并设计覆盖用例？",a:"先分段确认：看业务单据状态、消息是否发出、队列是否堆积、消费者是否消费成功，用业务单号加 traceId 串起生产到消费。\n常见根因：消费异常回滚未 ack、消息进死信、幂等表挡住重投、分支条件不满足、定时任务未触发或分片遗漏、下游超时。\n用例设计：正常消费、消费失败重试、超时、重复消息、乱序、消费者宕机恢复、堆积后扩容，断言终态与超时兜底补偿。\n监控补偿：消费延迟与堆积告警、重试次数、死信看板，提供按单号重推入口并验证重推不重复入账。\n【追问】消息显示已消费但业务状态没变，你先查哪张表？"},
{q:"支付或审批结果的消息回调怎么测：重复消费、乱序、延迟、丢失和验签？",a:"重复消费：同一 notifyId 或订单号重放多次，只处理一次，业务状态和金额不变，以幂等表和唯一键结果判定。\n乱序与延迟：先到支付成功再到创建通知，或回调延迟数小时，验证状态机不倒退，超时后有主动查单补偿。\n丢失与验签：模拟回调未达、验签失败、金额或商户号不符、伪造报文，系统必须拒绝并告警，不能因验签失败改状态。\n通知触达：站内信、短信、邮件的到达、去重、失败重试和模板变量正确，回调处理完后下游同步完成。\n【易错】只测正常回调一次，不测重放与伪造报文。"},
{q:"EAM 里角色、操作、数据范围的权限矩阵怎么设计用例，怎么防止越权漏测？",a:"先建矩阵：行是申请人、审批人、资产管理员、财务、超管，列是查、增、改、删、审批、导出，单元格填本人、部门或全部，先穷举再按风险裁剪。\n三层验证：菜单看不到、按钮置灰、直接调接口被拒三层都要测，越权以 403 判定，不能只看页面表现。\n数据范围：同角色不同部门、跨部门单据 ID、列表筛选、导出结果和附件下载逐项验证，防止列表过滤了但详情能看。\n漏测防控：用自动化按角色乘接口遍历生成断言，权限变更走评审并回归矩阵，线上定期跑越权巡检。\n【追问】页面隐藏了按钮但接口还能调，这算不算缺陷？"},
{q:"审批通过后资产状态、库存、台账和通知要同步变更，跨服务一致性怎么验证和对账？",s:true,a:"先画链路：审批通过→资产状态变更→库存扣减→写台账→发消息通知，标清每步是同步还是异步、事务边界在哪里。\n场景覆盖：正常、下游失败、消息重投、部分成功四种各跑一遍，用单据号关联各表比对状态、数量、金额和时间。\n对账脚本：按日汇总单据数、审批通过数、出库数、库存变动数和消息数，差异定位到单号，关键字段做全量比对。\n补偿兜底：失败要有重试、死信和人工补偿入口，补偿后不重复扣减，超时未一致要告警并自动核对。\n【易错】只验主流程成功，不故意让下游失败，分布式事务问题永远测不出来。"},
{q:"资产管理系统要覆盖 PC 浏览器、H5 和不同机型系统，兼容性矩阵怎么定范围和优先级？",a:"定范围：按埋点和工单分布选，PC 覆盖 Chrome 和 Edge 最新两版加 Safari，H5 覆盖 iOS 与 Android 主流机型及微信内置浏览器，缩放测 100% 和 125%。\n分优先级：登录、审批、领用这些核心链路全矩阵必测，展示类按 Top 机型抽测，老旧浏览器只保基本可用。\n风险点：布局错位、日期与金额格式、文件上传下载、扫码定位等能力差异、缓存和 Cookie 策略，逐项列检查清单。\n收敛策略：用云真机或 BrowserStack 提效，缺陷按机型影响面分级，明确不支持清单并同步产品。\n【追问】只在某个安卓机型白屏，你怎么快速判断是兼容问题还是数据问题？"},
{q:"审批和资产查询系统的性能测试方案怎么设计：场景、并发、指标、监控和瓶颈定位？",s:true,a:"场景建模：按生产流量选登录、资产列表查询、审批提交、领用扣减、报表导出 5 个场景，定单接口与混合比例，贴近真实调用。\n参数设计：并发按 20、50、100、200 梯度加压，数据量与生产同量级（资产百万级），写清思考时间、持续时长和爬坡策略。\n指标与监控：同时采集 TPS、P95、P99、错误率、CPU、内存、连接池、GC、慢查询和锁等待，错误率超过 0.1% 即视为不达标。\n瓶颈定位：加压到拐点后按前端、网关、应用、数据库、中间件分段看耗时，用 APM 或线程栈定位，改完复测对比基线。\n【易错】只报 TPS 不报错误率和资源水位，指标撑不起结论。"},
{q:"EAM 上线前的安全测试要覆盖哪些点：水平与垂直越权、SQL 注入、XSS、脱敏和文件上传？",a:"越权：改单据 ID 或用户 ID 做水平越权，用普通账号调管理员接口做垂直越权，全部要求 403，接口层验证优先于页面。\n注入与 XSS：参数带 OR 1=1、script 标签、富文本和恶意文件名，验证预编译、输入校验与输出编码，不能只看有没有弹窗。\n敏感数据：身份证、手机号、金额在页面、导出、日志和接口响应中脱敏，附件下载和临时链接有效期也要验证。\n文件上传：类型白名单能否被改后缀或 Content-Type 绕过，大小、重命名、路径穿越、可执行文件和存储桶权限逐项测。\n【追问】接口响应里手机号没脱敏但页面做了掩码，算不算问题？"},
{q:"单元、接口、UI 自动化怎么分层落地，怎么度量收益并控制维护成本？",a:"分层比例：单元由开发主责、测试补关键逻辑，接口是测试主力覆盖业务规则与异常，UI 只保核心主流程，保持倒金字塔而不是把 UI 铺满。\n落地顺序：先做接口自动化覆盖审批与领用核心链路，再补 UI 冒烟，用例数据独立可重跑，脚本纳入代码评审与 CI。\n收益度量：统计覆盖接口数、拦截缺陷数、回归耗时下降和线上漏测数，按版本对比，不是只报脚本条数。\n控维护：只断言关键字段、数据隔离、失败自动归类、定期清理 flaky 用例，UI 用显式等待和稳定定位。\n【易错】UI 自动化铺满全流程，维护成本高、跑得慢、假失败还多。"},
{q:"CI/CD 流水线里的测试卡点和质量门禁怎么设计，才能既不漏又不拖慢发布？",a:"卡点分层：提交或 PR 触发单元测试和静态扫描，合并触发接口冒烟，每日或发布前跑全量回归，预发跑核心端到端。\n门禁标准：单测与接口用例通过率达标、P0 缺陷为零、覆盖率不低于基线、镜像与依赖扫描无高危，任一不满足直接阻断。\n流水线顺序：构建→部署测试环境→冒烟→回归→出报告→人工审批→预发或生产，失败即停并通知责任人，报告归档可追溯。\n度量优化：统计门禁拦截问题数、流水线时长和失败原因分布，做并行与缓存优化，避免门禁太慢被绕过。\n【追问】开发总要求临时跳过门禁，你怎么治理？"},
{q:"资产知识库智能问答上线前怎么测：评测集、幻觉、提示词注入、稳定性和成本？",a:"建评测集：按业务问题整理 100 到 300 条金标，覆盖事实问答、流程查询、拒答、越权和多轮，标注期望要点与引用来源。\n幻觉与忠实度：逐条核对回答是否被知识库或接口数据支持，统计忠实度、准确率和无依据编造率，关键样本人工复核。\n注入与安全：用「忽略以上指令」类提示词注入、诱导越权取数和套系统提示，验证拒答与权限过滤，敏感数据不拼进上下文。\n稳定性与成本：固定低温度多次采样看一致性，监控首字延迟、P95、token 消耗和单次成本，异常时降级到规则或人工。\n【易错】看几个回答感觉不错就给结论，没有量化评测集。"},
{q:"生产环境偶现审批重复推送，测试环境 100 次都正常，怎么用 traceId、时序和数据差异定位？",s:true,a:"先拿现场：要 traceId、用户 ID、租户、时间、版本和请求参数，按 traceId 拉全链路日志与调用链，还原一次重复推送的完整时序。\n数据差异：对比测试与生产的租户配置、数据量、缓存、权限和上下游版本，重点看是否特定数据、并发或重试触发了重复。\n时序与并发：按时间线核对请求顺序、重试、定时任务、消息投递与消费、锁等待，排查竞态和重复消费。\n提升复现：按条件缩小到固定账号、数据和并发，加临时日志与埋点，灰度观察；确认后提缺陷并持续跟踪。\n【追问】日志里根本没打 traceId，你怎么办？"},
{q:"新审批引擎要灰度发布，怎么测灰度和回滚，观察指标和回滚触发条件怎么定？",s:true,a:"灰度方案：按用户、租户或百分比分流，验证分流规则一致、新旧版本数据不串，灰度名单和开关可独立配置。\n验证内容：灰度用户走新逻辑、非灰度走旧逻辑，同一单据跨版本流转不报错，兼容读和双写结果正确。\n观察指标：核心链路成功率、错误率、P95、业务量、资损和客诉，设明确阈值，如错误率超 1% 或 P95 翻倍即回滚。\n回滚演练：上线前验证开关或回滚脚本能在 5 分钟内生效，回滚后数据不丢不重，灰度期数据老系统能兼容读取。\n【易错】只测新功能，没验证回滚后新产生的数据老系统能不能读。"},
{q:"资产报表和业务明细对不上，统计口径测试怎么做：来源、口径、对账、时区和精度？",a:"口径定义：书面确认统计对象、时间字段是创建还是审批通过或出库、去重维度、是否含作废撤销，口径变更必须走评审。\n数据来源：确认取主表还是流水快照，多表关联会不会放大或漏数，用明细 SQL 全量汇总后与报表逐项比对。\n边界与精度：月初月末、跨年跨期、UTC 与东八区、闰日、空数据、金额四舍五入和元与万元单位逐项验证。\n对账机制：每日跑对账脚本，差异超阈值告警并能定位到单号，缓存刷新后报表与源数据一致。\n【追问】报表比明细少 3 条，你怎么判断是口径问题还是数据问题？"},
{q:"对接支付、短信、对象存储这类第三方，怎么测 mock、超时重试、对账、幂等和降级？",a:"Mock 与契约：先搭 mock 服务覆盖成功、失败、超时、重复回调和字段缺失，核验验签、金额、商户号和回调地址配置。\n超时重试：设 3 到 5 秒超时和有限重试加退避，验证重试不重复扣款或发货，超时后主动查单而不是干等回调。\n对账与幂等：按日下载对账单与本地流水比对，差异定位到订单号；同一回调重放只生效一次，以幂等表结果判定。\n降级：第三方不可用时切备用通道或排队补偿，页面提示不误导用户，恢复后自动补处理并核对数据。\n【易错】只在第三方正常时联调，不测超时和重复回调，线上必出重复单。"},
{q:"版本上线前怎么给结论：风险清单、准出判断和有条件上线的条件怎么写？",s:true,a:"风险清单：按模块列影响面、发生概率、能否绕过、有无监控和回滚，分高中低并给出应对措施，别只写问题不写方案。\n准出判断：核对用例执行与通过率、P0 和 P1 是否清零或有结论、性能与安全是否达标、回归冒烟是否通过、数据迁移是否核对完成。\n有条件上线：写清条件，如只灰度 10%、限特定租户、某功能默认关闭，附观察指标、观察时长、回滚阈值和责任人。\n结论表达：明确可上线、有条件上线或不建议上线，附明细和签字，不写「基本没问题」这类模糊表述。\n【追问】产品坚持要上但你判断风险高，你怎么表达和留痕？"},
{q:"新项目从 0 搭一套测试体系，流程、用例库、环境、自动化和度量指标怎么排优先级？",a:"先摸现状：梳理业务链路、版本节奏、缺陷来源和线上事故，找出最痛的 2 到 3 个问题，别一上来就铺工具。\n优先级排序：先立流程与用例库（需求评审、冒烟回归、缺陷规范），再固化环境和测试数据，然后补接口自动化与 CI 门禁。\n度量指标：用缺陷逃逸率、回归耗时、自动化拦截数、环境可用率和上线事故数衡量，季度复盘再调整重点。\n落地节奏：选一个核心项目试点，产出模板和规范后推广，配套培训与评审，避免文档写完没人执行。\n【易错】先买工具铺 UI 自动化，流程和数据没解决，体系落不了地。"}
]});

</script>
<script>
(function(){
  var KEY_ANS = 'stqb_answers_v1';
  var KEY_DONE = 'stqb_done_v1';
  var KEY_PICK = 'stqb_picks_v1';
  var parts = window.QB_PARTS || [];
  var all = [];
  parts.forEach(function(cat, ci){
    (cat.items || []).forEach(function(it, qi){
      all.push({
        id: 'c' + ci + 'q' + qi, ci: ci, qi: qi, cat: cat.name,
        q: it.q, s: !!it.s, a: it.a || '', t: it.t || 'qa',
        o: it.o || [], k: it.k
      });
    });
  });

  var answers = load(KEY_ANS, {});
  var done = load(KEY_DONE, {});
  var picks = load(KEY_PICK, {});
  var fillDraft = {};   // 填空题本次作答的临时值，只在内存里，用来给「标记已掌握」保存
  var draftPick = {};   // 没答对、也没标记已掌握的作答，只放内存，翻页就丢
  var renderedId = null;   // 当前已渲染的题目，用来判断是否发生了翻页
  var byId = {};
  all.forEach(function(x){ byId[x.id] = x; });
  var state = { cat: -1, filter: 'all', type: 'all', q: '', idx: 0 };

  // 填空题的输入只有点过「标记已掌握」才保留，这里清掉旧版本遗留的提交记录
  (function(){
    var changedAns = false, changedPick = false;
    all.forEach(function(x){
      if(done[x.id]) return;
      if(x.t === 'fill' && answers[x.id]){ delete answers[x.id]; changedAns = true; }
      if((x.t === 'fill' || x.t === 'choice') && picks[x.id] && !picks[x.id].ok){
        delete picks[x.id]; changedPick = true;
      }
    });
    if(changedAns) save(KEY_ANS, answers);
    if(changedPick) save(KEY_PICK, picks);
  })();
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition || null;
  var listening = false, rec = null, recBase = '', autoMatchOnEnd = false;

  function load(k, d){ try{ return JSON.parse(localStorage.getItem(k)) || d; }catch(e){ return d; } }
  function save(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }

  function filtered(){
    var out = all.filter(function(x){
      if(state.cat >= 0 && x.ci !== state.cat) return false;
      if(state.filter === 'star' && !x.s) return false;
      if(state.filter === 'todo' && done[x.id]) return false;
      if(state.filter === 'done' && !done[x.id]) return false;
      if(state.type !== 'all' && x.t !== state.type) return false;
      if(state.q){
        var q = state.q.toLowerCase();
        if((x.q + ' ' + x.cat).toLowerCase().indexOf(q) < 0) return false;
      }
      return true;
    });
    return out;
  }

  function current(){ var f = filtered(); if(state.idx >= f.length) state.idx = Math.max(0, f.length - 1); return { list: f, item: f[state.idx] }; }

  // 没答对也没标记已掌握的作答只留在内存里，翻到别的题就丢掉
  function resetIfWrong(id){
    var x = byId[id];
    if(!x || (x.t !== 'choice' && x.t !== 'fill')) return;
    if(draftPick[id]) delete draftPick[id];
    if(!done[id] && picks[id]){ delete picks[id]; save(KEY_PICK, picks); }
  }

  function renderCats(){
    var html = '<button class="cat ' + (state.cat < 0 ? 'on' : '') + '" data-c="-1"><span class="n">全部分类</span><span class="c">' + all.length + '</span></button>';
    parts.forEach(function(cat, ci){
      var total = (cat.items || []).length, ok = 0;
      (cat.items || []).forEach(function(it, qi){ if(done['c' + ci + 'q' + qi]) ok++; });
      html += '<button class="cat ' + (state.cat === ci ? 'on' : '') + '" data-c="' + ci + '"><span class="n">' + esc(cat.name) + '</span><span class="c">' + ok + '/' + total + '</span></button>';
    });
    document.getElementById('cats').innerHTML = html;
  }

  function renderProgress(){
    var total = all.length, ok = Object.keys(done).filter(function(k){ return done[k]; }).length;
    document.getElementById('progText').textContent = '已掌握 ' + ok + ' / ' + total;
    document.getElementById('progBar').style.width = (total ? (ok / total * 100) : 0) + '%';
  }

  function renderGrid(list){
    var cur = list[state.idx] ? list[state.idx].id : null;
    var html = list.map(function(x, i){
      return '<button class="gbtn ' + (x.id === cur ? 'on ' : '') + (x.s ? 'star ' : '') + (done[x.id] ? 'done' : '') + '" data-i="' + i + '" title="' + esc(x.q) + '">' + (i + 1) + '</button>';
    }).join('');
    document.getElementById('grid').innerHTML = html || '<div class="empty" style="grid-column:1/-1;padding:16px">没有匹配的题目</div>';
  }

  function render(){
    if(listening){ autoMatchOnEnd = false; try{ rec.abort(); }catch(e){} listening = false; }
    var c = current();
    var nid = c.item ? c.item.id : null;
    if(renderedId && renderedId !== nid) resetIfWrong(renderedId);
    renderedId = nid;
    renderCats(); renderProgress(); renderGrid(c.list);
    var body = document.getElementById('stageBody');
    if(!c.item){
      body.innerHTML = '<div class="panel empty">没有匹配的题目，换个筛选或搜索词试试。</div>';
      return;
    }
    var x = c.item, isDone = !!done[x.id];
    var typeName = ({qa:'简答口述', choice:'选择题', fill:'填空题', code:'代码题'})[x.t] || '简答口述';
    var inner;
    if(x.t === 'choice') inner = renderChoice(x, isDone);
    else if(x.t === 'fill') inner = renderFill(x, isDone);
    else if(x.t === 'code') inner = renderCode(x, isDone);
    else inner = renderQA(x, isDone);
    body.innerHTML =
      '<div class="card">' +
        '<div class="qtop">' +
          (x.s ? '<span class="badge">★ 高频题</span>' : '') +
          '<span class="badge warn">' + typeName + '</span>' +
          '<span>' + esc(x.cat) + '</span>' +
          '<span>第 ' + (state.idx + 1) + ' / ' + c.list.length + ' 题</span>' +
          (isDone ? '<span class="badge">已掌握</span>' : '') +
        '</div>' +
        '<h1 class="qtext">' + esc(x.q) + '</h1>' +
        inner +
      '</div>';
    bindCommon(x);
  }

  function masterHtml(isDone){
    return '<button class="btn ' + (isDone ? 'done' : '') + '" id="master">' + (isDone ? '取消已掌握' : '标记已掌握') + '</button>';
  }
  function navHtml(){
    return '<button class="btn ghost" id="prev">上一题</button><button class="btn ghost" id="next">下一题</button>';
  }
  function answerPanel(a, isCode, prefix, open){
    var inner = isCode ? '<pre class="code">' + esc(a) + '</pre>' : renderAnswer(a);
    return '<div class="answer" id="answer"' + (open ? '' : ' hidden') + '><h3>参考解析</h3>' + (prefix || '') + inner + '</div>';
  }

  function renderQA(x, isDone){
    var ans = answers[x.id] || '';
    return '<div class="self-label"><span>先自己答一遍（自动保存在本机）</span><span id="saveHint">' + (ans ? '已保存草稿' : '') + '</span></div>' +
      '<textarea id="selfAns" placeholder="按 背景 → 做法 → 结果 组织语言，也可以点下面的语音按钮直接口述…">' + esc(ans) + '</textarea>' +
      '<div class="voicebar">' +
        '<button class="btn mic" id="micBtn" type="button"><span class="dot"></span><span id="micText">语音回答</span></button>' +
        '<button class="btn ghost" id="matchBtn" type="button">对照参考答案判分</button>' +
        '<span class="vhint" id="micHint">点一下开始说，说完再点结束</span>' +
      '</div>' +
      '<div class="match" id="matchBox" hidden></div>' +
      '<div class="actions">' + masterHtml(isDone) + '<button class="btn primary" id="reveal" data-label="显示参考答案">显示参考答案</button>' + navHtml() + '</div>' +
      answerPanel(x.a, false, '', false);
  }

  function renderChoice(x, isDone){
    var pick = draftPick[x.id] || picks[x.id], letters = ['A','B','C','D','E','F'];
    var opts = (x.o || []).map(function(o, i){
      var cls = 'opt';
      if(pick){
        if(i === x.k) cls += ' correct';
        else if(pick.v === i) cls += ' wrong';
      }
      return '<button class="' + cls + '" data-opt="' + i + '"' + (pick ? ' disabled' : '') + '>' +
        letters[i] + '. ' + esc(o) + '</button>';
    }).join('');
    var verdict = pick ? '<div class="verdict ' + (pick.ok ? 'ok' : 'bad') + '">' +
      (pick.ok ? '✓ 回答正确' : '✗ 回答错误，正确答案是 ' + letters[x.k]) + '</div>' : '';
    return '<div class="options">' + opts + '</div>' + verdict +
      '<div class="actions">' + masterHtml(isDone) +
        (pick ? '<button class="btn ghost" id="retry">重做</button>' : '') +
        '<button class="btn primary" id="reveal" data-label="查看解析">' + (pick ? '隐藏答案' : '查看解析') + '</button>' + navHtml() + '</div>' +
      answerPanel(x.a, false, '', !!pick);
  }

  function renderFill(x, isDone){
    var val = answers[x.id] || '', pick = draftPick[x.id] || picks[x.id];
    var verdict = pick ? '<div class="verdict ' + (pick.ok ? 'ok' : 'bad') + '">' + (pick.ok ? '✓ 回答正确' : '✗ 回答错误') + '</div>' : '';
    var first = (x.k && x.k[0]) || '';
    return '<div class="fillrow"><input id="fillAns" value="' + esc(val) + '" placeholder="多个空按顺序用逗号分隔，例如：有效,无效"><button class="btn primary" id="fillSubmit">提交作答</button></div>' +
      verdict +
      '<div class="actions">' + masterHtml(isDone) +
        (pick ? '<button class="btn ghost" id="retry">重做</button>' : '') +
        '<button class="btn primary" id="reveal" data-label="显示答案">' + (pick ? '隐藏答案' : '显示答案') + '</button>' + navHtml() + '</div>' +
      answerPanel(x.a, false, '<div style="margin-bottom:8px">参考答案：<b>' + esc(first) + '</b></div>', !!pick);
  }

  function renderCode(x, isDone){
    var val = answers[x.id] || '';
    return '<div class="self-label"><span>写下你的实现（自动保存在本机）</span><span>对照参考代码自行判定</span></div>' +
      '<textarea id="codeAns" class="code-input" spellcheck="false" placeholder="在此写代码，支持 Python / SQL…">' + esc(val) + '</textarea>' +
      '<div class="actions">' + masterHtml(isDone) + '<button class="btn primary" id="reveal" data-label="显示参考代码">显示参考代码</button>' + navHtml() + '</div>' +
      answerPanel(x.a, true, '', false);
  }

  function normalize(s){
    return String(s == null ? '' : s).toLowerCase()
      .replace(/\s+/g, '')
      .replace(/[，、；;]/g, ',')
      .replace(/。/g, '.');
  }

  var KEY_TERMS = [
    '等价类','边界值','判定表','因果图','正交','场景法','错误推测','冒烟','回归','覆盖率','用例','需求','缺陷',
    '优先级','严重程度','复现','定位','日志','环境','版本','上线','回滚','灰度','监控','告警','风险',
    '接口','参数','断言','响应','状态码','鉴权','授权','token','cookie','session','幂等','重试','超时',
    '并发','限流','熔断','依赖','mock','契约','分页','排序','导出','上传','下载','加密','签名','时间戳',
    '回调','异步','队列','轮询','webhook','吞吐','tps','qps','线程','连接池','内存','cpu','磁盘','带宽',
    '瓶颈','压测','负载','稳定性','抖动','泄漏','索引','事务','隔离级别','死锁','慢查询','主键','外键',
    '唯一','锁','mvcc','explain','执行计划','进程','端口','权限','定时任务','定位','等待','显式等待','隐式等待',
    'iframe','弹窗','数据驱动','参数化','分层','复用','截图','报告','流水线','构建','部署','触发器','凭据',
    '制品','分支','提交','合并','冲突','标签','镜像','容器','dockerfile','数据卷','网络','编排','compose',
    '弱网','兼容','机型','系统','安装','升级','卸载','崩溃','电量','流量','埋点','h5','webview','隐私','合规',
    'tcp','udp','握手','挥手','http','https','证书','tls','dns','抓包','代理','防火墙','延迟','丢包',
    '大模型','幻觉','prompt','注入','评测','数据集','准确率','召回','温度','上下文','流式',
    '沟通','推动','协作','复盘','学习','主动','责任','结果'
  ];

  function canon(s){
    return String(s || '').toLowerCase()
      .replace(/bug/g, '缺陷')
      .replace(/api/g, '接口')
      .replace(/验证/g, '校验')
      .replace(/db/g, '数据库');
  }
  function normText(s){
    return canon(s).replace(/\s+/g, '')
      .replace(/[，。？！、；：""''（）()《》\-_,.;:?!【】\[\]]/g, '');
  }
  function bigrams(s){
    var set = Object.create(null);
    for(var i = 0; i < s.length - 1; i++) set[s.substr(i, 2)] = 1;
    return set;
  }
  function pointScore(point, userNorm, userBi){
    var pn = normText(point);
    if(pn.length < 2) return 0;
    var pb = bigrams(pn), total = 0, hit = 0;
    for(var k in pb){ total++; if(userBi[k]) hit++; }
    var cov = total ? hit / total : 0;
    var terms = KEY_TERMS.filter(function(t){ return pn.indexOf(t) >= 0; });
    if(!terms.length) return cov;
    var th = terms.filter(function(t){ return userNorm.indexOf(t) >= 0; }).length;
    return 0.85 * cov + 0.15 * (th / terms.length);
  }
  function splitPoints(a){
    var raw = String(a || '').split(/[\n。；;]/), pts = [];
    raw.forEach(function(s){
      s = s.trim();
      if(!s || s.length < 8) return;
      if(/^【(追问|易错)】/.test(s)) return;
      if(/^参考/.test(s)) return;
      pts.push(s);
    });
    return pts.slice(0, 8);
  }
  function evaluateAnswer(user, ref){
    var pts = splitPoints(ref), un = normText(user), ub = bigrams(un);
    var rows = pts.map(function(p){
      var sc = pointScore(p, un, ub);
      return { text: p, score: sc, covered: sc >= 0.4 };
    });
    var covered = rows.filter(function(r){ return r.covered; }).length;
    var score = rows.length ? rows.reduce(function(s, r){ return s + r.score; }, 0) / rows.length : 0;
    return { rows: rows, covered: covered, total: rows.length, score: score };
  }
  function setMicUI(on){
    var b = document.getElementById('micBtn'), t = document.getElementById('micText'), h = document.getElementById('micHint');
    if(b) b.classList.toggle('rec', on);
    if(t) t.textContent = on ? '结束录音' : '语音回答';
    if(h) h.textContent = on ? '正在听…说完点结束' : '点一下开始说，说完再点结束';
  }
  function startMic(){
    if(!SR){ toast('当前浏览器不支持语音识别，可用输入法听写或手动输入'); return; }
    var ta = document.getElementById('selfAns');
    if(!ta) return;
    recBase = ta.value ? ta.value.replace(/\s+$/, '') + ' ' : '';
    if(!rec){
      rec = new SR();
      rec.lang = 'zh-CN';
      rec.continuous = true;
      rec.interimResults = true;
      rec.onresult = function(e){
        var fin = '', itm = '';
        for(var i = e.resultIndex; i < e.results.length; i++){
          if(e.results[i].isFinal) fin += e.results[i][0].transcript;
          else itm += e.results[i][0].transcript;
        }
        if(fin) recBase += fin;
        var cur = current().item, ta2 = document.getElementById('selfAns');
        if(!cur || !ta2) return;
        ta2.value = recBase + itm;
        answers[cur.id] = ta2.value;
        save(KEY_ANS, answers);
        var sh = document.getElementById('saveHint');
        if(sh) sh.textContent = '已自动保存';
      };
      rec.onerror = function(e){
        var m = {
          'not-allowed': '麦克风权限被拒绝，请在浏览器设置里允许后重试',
          'no-speech': '没有听到声音，靠近麦克风再说一次',
          'network': '语音服务连接失败，可改用输入法听写',
          'audio-capture': '没有检测到麦克风'
        }[e.error] || ('语音识别出错：' + e.error);
        toast(m);
      };
      rec.onend = function(){
        listening = false;
        setMicUI(false);
        if(autoMatchOnEnd){ autoMatchOnEnd = false; runMatch(); }
      };
    }
    try{
      autoMatchOnEnd = false;
      rec.start();
      listening = true;
      setMicUI(true);
      toast('开始录音，说完再点一次结束');
    }catch(e){ toast('无法启动语音识别：' + e.message); }
  }
  function stopMic(){
    autoMatchOnEnd = true;
    if(rec){ try{ rec.stop(); }catch(e){} }
    listening = false;
    setMicUI(false);
  }
  function runMatch(){
    var cur = current().item;
    var ta = document.getElementById('selfAns'), box = document.getElementById('matchBox');
    if(!cur || !ta || !box) return;
    var text = ta.value.trim();
    box.hidden = false;
    if(text.length < 8){
      box.innerHTML = '<div class="mhint">内容太短，先把回答说完再判分。</div>';
      return;
    }
    if(!cur.a || !splitPoints(cur.a).length){
      box.innerHTML = '<div class="mhint">这道题暂时没有可对照的要点。</div>';
      return;
    }
    var r = evaluateAnswer(text, cur.a);
    var cls = r.score >= 0.62 ? 'ok' : (r.score >= 0.4 ? 'mid' : 'bad');
    var title = r.score >= 0.62 ? '意思基本到位' : (r.score >= 0.4 ? '答到了一部分' : '和参考答案偏差较大');
    var rows = r.rows.map(function(row){
      return '<div class="mpoint ' + (row.covered ? 'ok' : 'miss') + '">' +
        '<span class="mk">' + (row.covered ? '✓' : '✗') + '</span><span class="mt">' + esc(row.text) + '</span></div>';
    }).join('');
    box.innerHTML = '<div class="mhead ' + cls + '">' + title + ' · 要点覆盖 ' + r.covered + ' / ' + r.total +
      ' · 匹配度 ' + Math.round(r.score * 100) + '%</div>' + rows +
      '<div class="mhint">按要点覆盖近似判断，表述不必和答案一致；标 ✗ 的是参考答案里有、你还没提到的关键点。</div>';
  }

  function bindCommon(x){
    document.getElementById('master').addEventListener('click', function(){
      var fillInput = document.getElementById('fillAns');
      var fillVal = fillInput ? fillInput.value.trim() : null;
      if(done[x.id]) delete done[x.id]; else done[x.id] = 1;
      if(done[x.id]){
        // 已掌握：答对的作答正式保存下来；答错的就不留着了，只保留填空题自己写的内容
        if(draftPick[x.id] && draftPick[x.id].ok){ picks[x.id] = draftPick[x.id]; }
        delete draftPick[x.id];
        if(fillInput){
          var keep = fillVal || fillDraft[x.id] || '';
          if(keep) answers[x.id] = keep; else delete answers[x.id];
          save(KEY_ANS, answers);
        }
      } else {
        // 取消掌握：作答一并清掉
        delete picks[x.id]; delete draftPick[x.id]; delete fillDraft[x.id];
        if(fillInput){ delete answers[x.id]; save(KEY_ANS, answers); }
      }
      save(KEY_PICK, picks); save(KEY_DONE, done);
      toast(done[x.id] ? '已标记掌握' : '已取消掌握'); render();
    });
    document.getElementById('prev').addEventListener('click', function(){ go(-1); });
    document.getElementById('next').addEventListener('click', function(){ go(1); });
    var revealBtn = document.getElementById('reveal');
    revealBtn.addEventListener('click', function(){
      var box = document.getElementById('answer');
      if(box.hidden){
        box.hidden = false; this.textContent = '隐藏答案';
        box.scrollIntoView({behavior:'smooth', block:'nearest'});
      } else { box.hidden = true; this.textContent = this.getAttribute('data-label') || '查看解析'; }
    });
    var rt = document.getElementById('retry');
    if(rt) rt.addEventListener('click', function(){
      delete picks[x.id]; delete draftPick[x.id]; save(KEY_PICK, picks); render();
    });
    var mic = document.getElementById('micBtn');
    if(mic){
      mic.addEventListener('click', function(){ if(listening) stopMic(); else startMic(); });
      if(!SR){ var mh = document.getElementById('micHint'); if(mh) mh.textContent = '当前浏览器不支持语音，可用输入法听写或手动输入'; }
    }
    var mb = document.getElementById('matchBtn');
    if(mb) mb.addEventListener('click', runMatch);
    var ta = document.getElementById('selfAns') || document.getElementById('codeAns');
    if(ta){
      var timer = null;
      ta.addEventListener('input', function(){
        answers[x.id] = ta.value;
        clearTimeout(timer);
        timer = setTimeout(function(){
          save(KEY_ANS, answers);
          var h = document.getElementById('saveHint'); if(h) h.textContent = '已自动保存';
        }, 400);
      });
    }
    document.querySelectorAll('.opt').forEach(function(btn){
      btn.addEventListener('click', function(){
        var i = parseInt(btn.getAttribute('data-opt'), 10);
        var ok = i === x.k;
        if(ok){
          delete draftPick[x.id];
          picks[x.id] = { v: i, ok: true };
          done[x.id] = 1;
          save(KEY_PICK, picks); save(KEY_DONE, done);
        } else {
          draftPick[x.id] = { v: i, ok: false };   // 只放内存，翻页就丢
        }
        toast(ok ? '回答正确' : '回答错误'); render();
      });
    });
    var fs = document.getElementById('fillSubmit');
    if(fs){
      var submitFill = function(){
        var input = document.getElementById('fillAns');
        var val = input.value.trim();
        if(!val) return;
        fillDraft[x.id] = val;   // 只留在内存里，不写草稿；点「标记已掌握」才会持久保存
        var nv = normalize(val), ok = false;
        (x.k || []).forEach(function(k){ if(normalize(k) === nv) ok = true; });
        draftPick[x.id] = { ok: ok };   // 只放内存，点「标记已掌握」才正式保存
        toast(ok ? '回答正确' : '回答错误，看看参考答案'); render();
      };
      fs.addEventListener('click', submitFill);
      document.getElementById('fillAns').addEventListener('keydown', function(e){
        if(e.key === 'Enter') submitFill();
      });
    }
  }

  function go(step){
    var f = filtered();
    if(!f.length) return;
    state.idx = (state.idx + step + f.length) % f.length;
    render();
  }

  function renderAnswer(a){
    if(!a) return '<div style="color:var(--muted)">本题暂无参考答案。</div>';
    var lines = String(a).split('\n').map(function(s){ return s.trim(); }).filter(Boolean);
    return '<ul>' + lines.map(function(s){ return '<li>' + esc(s) + '</li>'; }).join('') + '</ul>';
  }

  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(ch){
      return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[ch];
    });
  }

  function toast(msg){
    var t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(t._t); t._t = setTimeout(function(){ t.classList.remove('show'); }, 1600);
  }

  document.getElementById('cats').addEventListener('click', function(e){
    var b = e.target.closest('.cat'); if(!b) return;
    state.cat = parseInt(b.getAttribute('data-c'), 10); state.idx = 0;
    if(state.type !== 'all'){
      var has = (state.cat < 0 ? all : (parts[state.cat].items || [])).some(function(it){
        return (it.t || 'qa') === state.type;
      });
      if(!has){ state.type = 'all'; syncTypeChips(); }
    }
    render();
  });
  function syncTypeChips(){
    document.querySelectorAll('.type-filters .chip').forEach(function(c){
      c.classList.toggle('on', c.getAttribute('data-t') === state.type);
    });
  }
  document.querySelector('.filters').addEventListener('click', function(e){
    var b = e.target.closest('.chip'); if(!b) return;
    this.querySelectorAll('.chip').forEach(function(c){ c.classList.remove('on'); });
    b.classList.add('on'); state.filter = b.getAttribute('data-f'); state.idx = 0; render();
  });
  document.querySelector('.type-filters').addEventListener('click', function(e){
    var b = e.target.closest('.chip'); if(!b) return;
    this.querySelectorAll('.chip').forEach(function(c){ c.classList.remove('on'); });
    b.classList.add('on'); state.type = b.getAttribute('data-t'); state.idx = 0; render();
  });
  document.getElementById('search').addEventListener('input', function(){
    state.q = this.value.trim(); state.idx = 0; render();
  });
  document.getElementById('random').addEventListener('click', function(){
    var f = filtered(); if(!f.length) return;
    state.idx = Math.floor(Math.random() * f.length); render();
    toast('随机抽到第 ' + (state.idx + 1) + ' 题');
  });
  document.getElementById('grid').addEventListener('click', function(e){
    var b = e.target.closest('.gbtn'); if(!b) return;
    state.idx = parseInt(b.getAttribute('data-i'), 10); render();
document.getElementById('stageBody').scrollIntoView({behavior:'smooth', block:'start'});
  });
  document.getElementById('reset').addEventListener('click', function(){
    if(!confirm('确定清空所有作答草稿和掌握状态吗？')) return;
    answers = {}; done = {}; picks = {};
    localStorage.removeItem(KEY_ANS); localStorage.removeItem(KEY_DONE); localStorage.removeItem(KEY_PICK);
    render(); toast('已清空');
  });

  document.addEventListener('keydown', function(e){
    if(e.ctrlKey && e.key === 'Enter'){
      e.preventDefault();
      var btn = document.getElementById('reveal');
      if(btn) btn.click();
    }
  });

  render();
})();
</script>
