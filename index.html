<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>软件测试面试题库 · 刷题台</title>
<style>
:root{
  --bg:#f4f6f4; --surface:#ffffff; --surface-2:#f7f9f7; --border:#e2e6e2;
  --text:#1f2328; --muted:#6b7280; --brand:#16a34a; --brand-soft:#e8f5ec;
  --warn:#d97706; --danger:#dc2626; --radius:10px;
  --shadow:0 1px 2px rgba(16,24,20,.05),0 8px 24px rgba(16,24,20,.06);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#111413; --surface:#191d1b; --surface-2:#1f2422; --border:#303632;
    --text:#e6eae8; --muted:#9aa4a0; --brand:#22c55e; --brand-soft:#1b2a21;
    --warn:#f59e0b; --danger:#f87171; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font:14px/1.7 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
}
button{font:inherit;cursor:pointer}
a{color:var(--brand)}
.top{
  position:sticky; top:0; z-index:10; background:var(--surface);
  border-bottom:1px solid var(--border);
}
.top-inner{
  max-width:1180px; margin:0 auto; padding:14px 20px;
  display:flex; align-items:center; gap:16px; flex-wrap:wrap;
}
.brand{display:flex; align-items:center; gap:10px; font-weight:700; font-size:16px}
.logo{
  width:30px; height:30px; border-radius:8px; background:var(--brand); color:#fff;
  display:grid; place-items:center; font-size:15px; font-weight:700;
}
.grow{flex:1}
.search{
  flex:1 1 260px; max-width:420px; display:flex; align-items:center; gap:8px;
  background:var(--surface-2); border:1px solid var(--border); border-radius:999px; padding:6px 12px;
}
.search input{
  flex:1; border:0; outline:0; background:transparent; color:var(--text); font:inherit;
}
.progress-mini{display:flex; align-items:center; gap:8px; color:var(--muted); font-size:12px; white-space:nowrap}
.bar{width:110px; height:6px; border-radius:999px; background:var(--border); overflow:hidden}
.bar > i{display:block; height:100%; width:0; background:var(--brand); transition:width .25s}
main{
  max-width:1180px; margin:0 auto; padding:20px;
  display:grid; grid-template-columns:250px minmax(0,1fr); gap:20px;
}
@media (max-width:860px){
  main{grid-template-columns:1fr}
  aside{order:2}
}
aside{position:sticky; top:82px; align-self:start; max-height:calc(100vh - 100px); overflow:auto}
.panel{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow)}
.panel-h{padding:12px 14px; border-bottom:1px solid var(--border); font-weight:600; font-size:13px; color:var(--muted)}
.cat{
  width:100%; text-align:left; border:0; background:transparent; color:var(--text);
  padding:9px 14px; display:flex; gap:8px; align-items:center; border-bottom:1px solid var(--border);
}
.cat:hover{background:var(--surface-2)}
.cat.on{background:var(--brand-soft); color:var(--brand); font-weight:600}
.cat .n{flex:1; font-size:13px; line-height:1.35}
.cat .c{font-size:11px; color:var(--muted); white-space:nowrap}
.stage{min-width:0}
.filters{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px}
.chip{
  border:1px solid var(--border); background:var(--surface); color:var(--muted);
  padding:6px 14px; border-radius:999px; font-size:13px;
}
.chip.on{background:var(--brand); border-color:var(--brand); color:#fff}
.card{
  background:var(--surface); border:1px solid var(--border); border-radius:14px;
  box-shadow:var(--shadow); padding:22px;
}
.qtop{display:flex; align-items:center; gap:10px; flex-wrap:wrap; color:var(--muted); font-size:12px; margin-bottom:10px}
.badge{background:var(--brand-soft); color:var(--brand); border-radius:999px; padding:2px 10px; font-weight:600}
.badge.warn{background:rgba(217,119,6,.12); color:var(--warn)}
.qtext{font-size:19px; line-height:1.55; margin:0 0 18px; font-weight:700}
.self-label{display:flex; justify-content:space-between; align-items:center; color:var(--muted); font-size:12px; margin-bottom:6px}
textarea{
  width:100%; min-height:130px; resize:vertical; padding:12px 14px; font:inherit; line-height:1.7;
  color:var(--text); background:var(--surface-2); border:1px solid var(--border); border-radius:10px; outline:0;
}
textarea:focus{border-color:var(--brand); box-shadow:0 0 0 3px var(--brand-soft)}
.actions{display:flex; gap:10px; flex-wrap:wrap; margin-top:14px}
.btn{
  border:1px solid var(--border); background:var(--surface); color:var(--text);
  padding:8px 16px; border-radius:8px; font-size:13px;
}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--brand); border-color:var(--brand); color:#fff}
.btn.primary:hover{filter:brightness(1.05)}
.btn.ghost{color:var(--muted)}
.btn.done{border-color:var(--brand); color:var(--brand); background:var(--brand-soft)}
.answer{
  margin-top:18px; border-top:1px dashed var(--border); padding-top:16px;
}
.answer h3{font-size:13px; color:var(--muted); margin:0 0 8px; font-weight:600}
.answer ul{margin:0; padding-left:20px}
.answer li{margin:5px 0}
.navbar{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:16px; flex-wrap:wrap}
.count{color:var(--muted); font-size:12px}
.empty{padding:40px; text-align:center; color:var(--muted)}
details{margin-top:16px}
summary{cursor:pointer; color:var(--muted); font-size:13px}
.grid{
  display:grid; grid-template-columns:repeat(auto-fill,minmax(52px,1fr)); gap:8px; margin-top:12px;
}
.gbtn{
  border:1px solid var(--border); background:var(--surface-2); color:var(--text);
  border-radius:8px; padding:8px 4px; font-size:12px; position:relative;
}
.gbtn:hover{border-color:var(--brand)}
.gbtn.on{background:var(--brand); border-color:var(--brand); color:#fff}
.gbtn.star::after{content:"★"; position:absolute; top:-1px; right:3px; font-size:9px; color:var(--warn)}
.gbtn.done{border-color:var(--brand)}
.gbtn.done::before{content:""; position:absolute; left:4px; top:4px; width:5px; height:5px; border-radius:50%; background:var(--brand)}
footer{max-width:1180px; margin:0 auto; padding:8px 20px 40px; color:var(--muted); font-size:12px}
.type-filters{margin-top:-6px}
.type-filters .flabel{color:var(--muted); font-size:12px; align-self:center; margin-right:2px}
.opt{
  display:block; width:100%; text-align:left; margin:8px 0; padding:10px 14px;
  border:1px solid var(--border); border-radius:8px; background:var(--surface-2); color:var(--text);
}
.opt:hover{border-color:var(--brand)}
.opt:disabled{opacity:1; cursor:default}
.opt.correct{background:var(--brand-soft); border-color:var(--brand); color:var(--brand); font-weight:600}
.opt.wrong{background:rgba(220,38,38,.08); border-color:var(--danger); color:var(--danger)}
.fillrow{display:flex; gap:10px; flex-wrap:wrap}
.fillrow input{
  flex:1 1 260px; padding:10px 14px; border-radius:8px; border:1px solid var(--border);
  background:var(--surface-2); color:var(--text); font:inherit; outline:0;
}
.fillrow input:focus{border-color:var(--brand); box-shadow:0 0 0 3px var(--brand-soft)}
.verdict{margin-top:10px; font-weight:600}
.verdict.ok{color:var(--brand)}
.verdict.bad{color:var(--danger)}
.code-input{font-family:Consolas,"Courier New",monospace; min-height:190px; line-height:1.6}
pre.code{
  margin:0; padding:14px; border:1px solid var(--border); border-radius:10px;
  background:var(--surface-2); overflow:auto; white-space:pre-wrap;
  font:13px/1.65 Consolas,"Courier New",monospace;
}
.voicebar{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-top:10px}
.voicebar .vhint{color:var(--muted); font-size:12px}
.mic .dot{display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--brand); margin-right:8px; vertical-align:1px}
.mic.rec{border-color:var(--danger); color:var(--danger)}
.mic.rec .dot{background:var(--danger); animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.match{margin-top:12px; border:1px solid var(--border); border-radius:10px; padding:12px 14px; background:var(--surface-2)}
.match .mhead{font-size:13px; font-weight:600; margin-bottom:8px}
.match .mhead.ok{color:var(--brand)}
.match .mhead.mid{color:var(--warn)}
.match .mhead.bad{color:var(--danger)}
.mpoint{font-size:13px; line-height:1.6; margin:6px 0; display:flex; gap:8px}
.mpoint .mk{flex:0 0 auto; font-weight:700}
.mpoint.ok .mk{color:var(--brand)}
.mpoint.miss .mk{color:var(--danger)}
.mpoint.miss .mt{color:var(--muted)}
.mhint{font-size:12px; color:var(--muted); margin-top:8px}
.toast{
  position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(10px);
  background:var(--text); color:var(--surface); padding:8px 16px; border-radius:999px;
  font-size:13px; opacity:0; pointer-events:none; transition:.2s; z-index:20;
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0)}

.b-short{display:none}

/* ---------- 手机端适配 ---------- */
@media (max-width:700px){
  html{-webkit-text-size-adjust:100%}
  body{font-size:15px}
  .top-inner{
    display:grid; grid-template-columns:auto 1fr auto; align-items:center;
    gap:8px 10px; padding:9px 12px;
  }
  .brand{grid-row:1; grid-column:1; min-width:0}
  .brand .b-full{display:none}
  .brand .b-short{display:inline}
  .logo{width:26px; height:26px; border-radius:7px; font-size:13px}
  .grow{display:none}
  .search{grid-row:2; grid-column:1 / -1; max-width:none; padding:5px 12px}
  .search input{font-size:16px} /* 小于16px iOS 会自动放大 */
  .progress-mini{grid-row:1; grid-column:2; justify-self:end; font-size:11px; gap:6px}
  .bar{width:64px}
  #reset{grid-row:1; grid-column:3; padding:6px 10px; font-size:12px}

  main{grid-template-columns:1fr; padding:12px; gap:14px}
  /* 分类改为题目上方的横向滑动条，先选分类再看题 */
  aside{position:static; order:-1; max-height:none; overflow:visible; min-width:0}
  aside .panel{box-shadow:none; border-radius:10px; overflow:hidden}
  .panel-h{padding:9px 12px; font-size:12px}
  #cats{
    display:flex; gap:8px; overflow-x:auto; padding:9px 12px;
    max-width:100%;
    scrollbar-width:none; -webkit-overflow-scrolling:touch;
  }
  #cats::-webkit-scrollbar{display:none}
  .cat{
    width:auto; flex:0 0 auto; border:1px solid var(--border); border-radius:999px;
    padding:7px 12px; border-bottom:0; gap:6px; white-space:nowrap;
  }
  .cat .n{font-size:13px; flex:none}
  .cat .c{display:none} /* 小屏隐藏题量，避免横向占位过长 */

  .filters{gap:6px; margin-bottom:10px}
  .chip{padding:7px 12px; font-size:13px}
  #random{display:none} /* 小屏用底部“下一题”即可，避免挤占 */
  .type-filters{margin-top:-2px; flex-wrap:nowrap; overflow-x:auto; scrollbar-width:none}
  .type-filters::-webkit-scrollbar{display:none}
  .type-filters .chip{flex:0 0 auto; padding:7px 9px; font-size:12px}
  .flabel{display:none}

  .card{padding:16px; border-radius:12px}
  .qtop{gap:6px; font-size:11px; margin-bottom:8px}
  .qtext{font-size:17px; line-height:1.5; margin-bottom:14px}
  .opt{padding:12px 14px; margin:8px 0}
  .fillrow{flex-direction:column; gap:8px}
  .fillrow input{flex:none; width:100%; font-size:16px; padding:11px 12px}
  .fillrow .btn{width:100%; min-height:42px}
  textarea{font-size:16px; padding:11px 12px} /* 防止 iOS 聚焦缩放 */
  .code-input{min-height:150px; font-size:14px}
  pre.code{font-size:12px; padding:12px}
  .actions{display:grid; grid-template-columns:1fr 1fr; gap:8px}
  .actions .btn{width:100%; min-height:42px}
  .actions .btn:last-child:nth-child(odd){grid-column:1/-1}
  .navbar{gap:8px}
  .navbar .btn{flex:1 1 auto; min-height:40px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(46px,1fr)); gap:6px}
  .gbtn{padding:9px 4px}
  footer{padding:8px 12px 72px}
  .toast{bottom:calc(20px + env(safe-area-inset-bottom))}
  .answer{margin-top:14px; padding-top:12px}
  .answer ul{padding-left:18px}
}

@media (max-width:380px){
  .qtext{font-size:16px}
  .card{padding:13px}
  .brand .b-short{font-size:14px}
  .progress-mini span{display:none} /* 极窄屏只留进度条 */
}

</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <div class="brand"><span class="logo">测</span><span class="b-full">软件测试面试题库 · 刷题台</span><span class="b-short">面试刷题</span></div>
    <div class="search">
      <span style="color:var(--muted)">⌕</span>
      <input id="search" type="search" placeholder="搜索题目关键词，如：状态机、幂等、P95">
    </div>
    <div class="grow"></div>
    <div class="progress-mini">
      <span id="progText">已掌握 0 / 0</span>
      <div class="bar"><i id="progBar"></i></div>
    </div>
    <button class="btn ghost" id="reset">清空进度</button>
  </div>
</header>

<main>
  <aside>
    <div class="panel">
      <div class="panel-h">题目分类</div>
      <div id="cats"></div>
    </div>
  </aside>

  <section class="stage">
    <div class="filters">
      <button class="chip on" data-f="all">全部</button>
      <button class="chip" data-f="star">★ 高频</button>
      <button class="chip" data-f="todo">未掌握</button>
      <button class="chip" data-f="done">已掌握</button>
      <button class="btn" id="random" style="margin-left:auto">随机一题</button>
    </div>
    <div class="filters type-filters">
      <span class="flabel">题型</span>
      <button class="chip on" data-t="all">全部题型</button>
      <button class="chip" data-t="qa">简答口述</button>
      <button class="chip" data-t="choice">选择题</button>
      <button class="chip" data-t="fill">填空题</button>
      <button class="chip" data-t="code">代码题</button>
    </div>

    <div id="stageBody"></div>

    <details>
      <summary>展开本题库题目清单（当前筛选）</summary>
      <div class="grid" id="grid"></div>
    </details>
  </section>
</main>

<footer>数据来源：你上传的《分类面试题.txt》，另补充选择题、填空题、代码题专项。作答与掌握状态保存在本机浏览器，不会上传。</footer>
<div class="toast" id="toast"></div>

<script>
window.QB_PARTS = window.QB_PARTS || [];
window.QB_PARTS.push({name:"一、测试基础与流程",items:[
{q:"完整的软件测试流程是什么？每个阶段的产出物分别是什么？",s:true,a:"流程分四段：需求评审与测试计划 → 用例设计与评审、环境数据准备 → 提测冒烟、功能/接口/回归执行与缺陷跟踪 → 测试报告、上线验证与复盘。\n每段产出物要可交付：评审记录、测试计划、用例、测试数据、缺陷单、测试报告、上线 checklist 与复盘纪要。\n判断标准是每个阶段都能评审和追溯，而不是只留下执行记录。\n【追问】哪个阶段最容易出问题，你怎么补？"},
{q:"测试人员在整个研发周期里，每个环节应该起什么作用？",s:true,a:"需求阶段识别歧义、遗漏、可测性与风险，问清异常分支和权限规则。\n设计与开发阶段评审方案可测性、参与接口契约、做联调与左移测试，同时准备用例和环境。\n提测阶段用冒烟把关，不合格直接打回；测试阶段执行、定位、推动闭环并评估风险。\n上线阶段验证核心链路、看监控、复盘并补回归用例。\n【易错】只在测试阶段介入，前面的问题会以缺陷形式集中爆发。"},
{q:"测试计划 / 测试方案包含哪些内容？你怎么制定？",a:"范围与目标、测试策略（分层与优先级）、资源与环境、进度与里程碑、准入准出标准、风险与应对、交付物。\n制定方法：先对齐版本目标与变更范围，再按风险排优先级，最后倒排时间并预留 buffer。"},
{q:"测试报告包含哪些内容？你独立输出过完整测试报告吗？",s:true,a:"内容：版本与范围、环境与配置、用例执行统计（计划/执行/通过/失败/阻塞）、缺陷统计（等级、模块、趋势、修复率）、遗留问题与风险评估、性能与安全结论、上线建议。\n写法：数据要能追到用例与缺陷清单，风险要写影响面和规避方案，结论明确可上线、有条件上线或不建议上线。\n独立输出过，按模板填写并附明细，评审后归档。\n【易错】只堆数据不给结论，评审时无法支撑上线决策。"},
{q:"测试用例包含哪些字段？禅道里的用例有哪些字段？",s:true,a:"通用字段：编号、所属模块、标题、前置条件、操作步骤、预期结果、优先级、用例类型、关联需求、执行结果、备注。\n禅道额外有：产品/项目、阶段、关键词、适用版本、创建人、最后执行人，用例类型分功能/性能/接口等。\n核心是能被执行、能判定、能追溯需求。\n【追问】预期结果怎么写才算可判定？"},
{q:"设计一条测试用例需要注意什么？",a:"一条用例只验证一个明确的点；步骤可执行、数据可构造；预期结果可判定；独立可重复，不依赖其他用例的执行顺序。"},
{q:"缺陷单 / bug 包含哪些内容和关键要素？",s:true,a:"要素：标题（模块+现象）、复现步骤、实际结果、预期结果、环境与版本、严重等级与优先级、附件（截图/录屏/日志/请求响应）、指派人、状态、关联需求。\n判断标准：换个人照步骤能稳定复现，附件能直接支撑定位。\n【易错】标题只写「页面报错」，步骤缺前置条件，开发只能来回问。"},
{q:"缺陷管理流程是什么？用什么工具管理缺陷？",s:true,a:"主流程：新建 → 确认/指派 → 修复 → 验证 → 关闭；验证不通过则重新打开。\n分支：开发不认可时走沟通或评审，结论记录为延期、非缺陷或需求变更，都要留痕。\n工具：禅道、Jira、TAPD、Bugzilla，配合截图、日志与用例编号。\n【追问】「重新打开」和「新建」你按什么标准区分？"},
{q:"需求评审的意义是什么？评审会上你关注什么、提过哪些问题？",a:"意义：尽早发现歧义和遗漏，统一产品、开发、测试的理解，降低返工。\n关注：业务规则与边界、异常分支、权限与数据范围、数据来源与口径、兼容性、上线与回滚。\n常问：超时怎么办、失败是否可重试、谁能看谁能改、历史数据怎么处理。"},
{q:"需求评审和用例评审分别有哪些人参加？",a:"需求评审：产品、开发、测试、UI/交互，必要时运营与架构。\n用例评审：测试主导，开发与产品参加，确认覆盖与预期是否一致。"},
{q:"用例评审时发现你的用例覆盖不全，后续怎么补？",a:"先补缺口用例并标注来源，再评估影响面和优先级；把新增场景纳入回归集，必要时同步更新测试计划与风险说明。"},
{q:"需求上线标准 / 测试准出标准是什么？",a:"用例执行率 100%、P0/P1 清零、遗留缺陷有明确结论和规避方案、冒烟通过、性能与安全达标、文档与上线步骤齐全、回滚方案可用。"},
{q:"冒烟用例怎么定义？冒烟测试怎么做？",a:"从核心主流程中抽取最小集合（登录、主业务闭环、关键接口），提测后第一时间执行；不通过直接打回，不进入正式测试。"},
{q:"什么是回归测试？在什么节点做？回归完还要做什么？",s:true,a:"定义：验证修改没有破坏原有功能，覆盖缺陷修复点与关联模块，不只看改的那一处。\n节点：开发修复后、版本上线前、线上热修后。\n收尾：更新用例与缺陷状态、输出回归结论与风险、准备上线验证和复盘。\n【易错】只回归缺陷点不测关联模块，容易出现「修一个坏三个」。"},
{q:"新版本来了，用例执行策略是什么？继承性用例每版都要跑吗？",a:"按变更影响面选测：改动模块全测，关联模块重点测，核心继承用例每版必跑；非核心按风险抽测，自动化兜底。"},
{q:"怎么评估测试用例覆盖是否完整？",a:"需求追踪矩阵（需求→用例→缺陷）、用例评审、接口覆盖率、代码覆盖率参考、线上缺陷反推补用例。"},
{q:"什么是测试左移、什么是测试右移？",a:"左移：测试提前到需求、设计、编码阶段，做评审、接口测试、单元测试，越早发现成本越低。\n右移：测试延伸到线上，做灰度、监控、告警、用户反馈与线上巡检。"},
{q:"黑盒测试和白盒测试的区别和优缺点？白盒测试的用例设计方法有哪些？",a:"黑盒不看内部实现，从输入输出验证，贴近用户、易执行，但难以覆盖内部路径。\n白盒看代码逻辑，覆盖更彻底、能发现隐藏分支，但成本高、依赖代码能力。\n白盒方法：语句覆盖、判定覆盖、条件覆盖、判定/条件覆盖、条件组合覆盖、路径覆盖。"},
{q:"国标里的测试级别分为哪几级？",a:"单元测试、集成测试、系统测试、验收测试（确认测试），部分标准还包含回归测试与安装测试。"},
{q:"测试用例设计方法有哪些？等价类、边界值具体怎么用？",s:true,a:"常用方法：等价类、边界值、判定表、因果图、正交实验、场景法、状态迁移、错误推测。\n等价类：把输入划分有效/无效类，每类取代表值，减少用例又不漏类型。\n边界值：取上点、下点、离点，如 1–100 取 0、1、2、99、100、101。\n【追问】条件和输入之间有依赖关系时，你选判定表还是因果图？"},
{q:"判定表怎么用？结合你的项目举一个例子。",a:"列出条件桩与动作桩，枚举条件组合形成规则，再合并简化。\n例：领用审批——金额>5000、是否外部人员、是否有库存，三个条件组合决定走哪级审批或直接拒绝。"},
{q:"状态迁移法怎么设计用例？怎么保证状态机覆盖完整、能识别非法跳变？",a:"先画状态图，列出「当前状态 × 事件 → 目标状态」矩阵；覆盖全部合法迁移、每个状态的进入/退出、重复触发、非法跳转和超时/撤销分支。"},
{q:"正交实验法、错误推测法、因果图分别在什么场景用？",a:"正交：多因素多水平组合，用少量用例覆盖组合空间。\n错误推测：凭经验针对易错点设计异常场景。\n因果图：输入之间存在约束/依赖关系，需要分析输入组合对输出的影响。"},
{q:"测试数据一般从哪里来？",a:"生产脱敏数据、造数脚本/Faker、边界与异常构造、上游同步、数据库备份恢复。"},
{q:"测试环境怎么搭建？环境不一致导致的问题怎么处理？",a:"按部署文档准备依赖版本、配置、数据库与中间件，初始化数据和账号权限；用 Docker/Compose 固化环境。\n不一致时：列出差异清单，优先容器化对齐，无法对齐的在上线前用预发/生产同构环境复验。"},
{q:"需求文档写得不全、和开发理解不一致，怎么推进？",a:"拉产品和开发三方对齐，输出会议纪要和问题清单；以原型和接口契约作为补充依据，逐条确认并跟踪闭环。"},
{q:"测试时间被压缩、需求倒排，你怎么排测试优先级？",a:"按业务价值与风险排序：P0 主流程与资损/权限必测，自动化兜底回归；无法覆盖的部分显式上报风险，争取资源或缩小范围。"},
{q:"测试过程中主要有哪些风险？印象最深的一次风险是什么？",a:"需求频繁变更、提测质量差、环境不稳定、数据缺失、时间不足、依赖服务不可用。\n讲一次真实风险：如流程引擎未启动导致审批链路整体不可用，及时升级并补启动检查。"},
{q:"怎么区分一个 bug 是前端问题还是后端问题？",s:true,a:"先看 Network：请求没发出或参数不对 → 前端；请求正常但响应报错或数据不对 → 后端；响应正确但页面显示错 → 前端渲染或缓存。\n再用接口工具直调复验，绕开前端仍能复现的多为后端或数据问题。\n定位后附上请求响应和 traceId，减少开发互相推诿。\n【易错】只看页面报错文案就下结论，文案常由前端固定，不能说明来源。"},
{q:"什么是接口联调？",a:"前后端按接口契约联调，验证参数、返回结构、鉴权、异常码与业务状态是否一致，测试参与确认联调结果。"},
{q:"你理解的软件测试是什么？",a:"以最小成本发现并传递质量风险，验证系统在正确性、稳定性、性能、安全等方面满足业务预期，而不是单纯找 bug。"},
{q:"好的测试设计标准是什么？最重要的是哪一点？",a:"覆盖需求与风险、用例可执行可判定、可维护、成本合理。\n最重要的是覆盖关键风险：主流程、资损、权限、数据一致性。"},
{q:"一个从 0 到 1 的新项目，除了用例执行正确，还要关注哪些内容？",a:"需求可测性、架构与依赖风险、环境与数据准备、权限体系、性能与安全、监控告警、发布与回滚方案。"},
{q:"怎么快速上手一个完全陌生的业务？有没有自己的方法论？",a:"看文档与原型 → 画业务流程图和状态机 → 跟一遍真实操作 → 找产品/老员工问关键规则 → 整理术语表 → 先写冒烟用例验证理解。"},
{q:"用例怎么管理？用例库怎么维护？",a:"按产品/模块/版本分层，需求关联与标签管理；核心回归集单独维护，定期评审、去重、更新失效用例。"},
{q:"测试环境和生产环境的差异，你怎么考虑？",a:"关注配置、数据量、依赖服务、网络与权限差异；差异可能导致性能与边界问题，上线前在预发或生产同构环境复验关键链路。"},
{q:"测试中漏测了怎么解决？印象最深的一次漏测是什么？",s:true,a:"先止损：回滚、热修或开关降级，控制影响面，再同步相关方。\n再复盘根因：分需求遗漏、用例缺口、执行遗漏还是环境限制，不同原因对应不同改进。\n补用例进回归集，评估同类功能影响面，输出改进项并跟踪落地。\n【追问】讲一次漏测时，重点说清怎么发现、怎么补救、怎么防止再犯。"},
{q:"线上出现问题了怎么处理？",a:"确认影响范围 → 止损（回滚/降级/限流）→ 拉日志与链路定位 → 修复并验证 → 通知相关方 → 复盘与补监控/用例。"},
{q:"有做过自由测试 / 探索式测试吗？用例没覆盖到的部分怎么想思路？",a:"按业务分区做探索：围绕用户目标、异常路径、状态组合、权限边界、并发与中断设计探索章程，边学边测并记录发现。"},
{q:"了解第三方测试吗？了解军软测试文档的编写要求吗？",a:"第三方测试强调独立性与可追溯，按委托方标准和模板输出测试计划、用例、记录、报告；军软通常要求更严格的文档标识、评审与配置管理。"},
{q:"一个测试周期一般多久？版本多久迭代一次？",a:"按实际回答：如双周迭代、测试 5–7 个工作日；大版本含回归与性能则 2–3 周。"},
{q:"你们测试团队几个人？人员配比是怎样的？谁主导测试规划？",a:"按实际回答：如 1 名测试对 3–5 名开发；测试负责人主导计划与排期，组员分工执行与自动化。"},
{q:"开发提测前，测试的准入标准有哪些？开发需要提供什么？",s:true,a:"准入口径一般包括：冒烟用例全通过、开发自测清单有记录、版本包与部署说明齐全、接口文档和变更说明已更新、数据库脚本与配置项已给出。\n提测时要求开发写清变更范围、影响模块和已知问题，测试据此圈定回归范围。\n【易错】只看「能登录」就放行，忽略变更点和依赖服务，会把问题拖到测试中后期。"},
{q:"质量度量看哪些指标？你会用哪些数据说明测试有效性？",a:"常用指标：用例执行率与通过率、缺陷密度（缺陷数/需求或代码规模）、缺陷逃逸率（线上缺陷/总缺陷）、缺陷修复周期、回归通过率。\n用法：按版本和模块看趋势，逃逸率高说明评审或用例有缺口，修复周期长说明闭环推动不足。\n【追问】指标异常时，你具体做了哪些改进动作？"},
{q:"需求在测试中途发生变更，你怎么管理？",a:"先确认变更内容和生效版本，评估对用例、数据、排期的影响，更新用例并标注变更来源；影响主流程或已测范围的，要重跑关联回归。\n流程上要求留痕：需求单、评审记录、通知相关方，避免口头变更。\n【易错】变更只改用例不改排期，最后压缩执行时间导致漏测。"}
]});

window.QB_PARTS.push({name:"二、测试用例设计实战题（场景题）",items:[
{q:"登录界面（用户名 + 密码 + 登录按钮）有哪些测试点？",s:true,a:"功能：正确/错误账号密码、空值、长度边界、特殊字符、大小写与空格、重复点击、回车登录。\n安全：SQL 注入、XSS、暴力破解与锁定、验证码、密码是否明文、会话与登出。\n界面兼容与异常：布局文案、多浏览器分辨率、网络中断、超时、服务不可用、并发登录。\n【易错】只测正确和错误密码，漏掉错误提示次数限制与会话失效。"},
{q:"登录功能涉及安全，密码是否明文传输怎么验证？",a:"抓包看是否为 HTTPS；查看请求体密码是否明文或可逆加密；检查前端加密逻辑与后端校验；确认日志不打印密码。"},
{q:"手机号注册 / 登录的测试点有哪些？",a:"号段与长度校验、格式与空格、重复注册、验证码有效期/错误/复用/频控、换绑、国际号码、并发注册、异常网络。"},
{q:"动态验证码怎么测试？",a:"正确、错误、过期、重复使用、大小写、刷新后旧码失效、发送频控、绕过（直接调接口）、多端同步。"},
{q:"微信发红包怎么设计测试用例？",s:true,a:"金额：0、负数、小数位、超余额、超单笔与单日上限，区分拼手气与普通红包。\n个数与领取：1 个/多个、抢完、重复抢、并发抢、超时未领退回。\n流程：支付、失败重试、退款、账单一致性、通知、弱网、防刷与风控。\n【追问】并发抢同一份红包，你用什么标准判断金额没算错？"},
{q:"微信发送语音的功能怎么测？",a:"权限、录制时长上下限、取消发送、松手发送、静音、后台/来电中断、音质与格式、发送失败重试、播放与转文字、删除、弱网。"},
{q:"微信朋友圈评论功能有哪些测试点？",a:"文字/表情/图片、字数上限、敏感词、删除与回复、可见范围、刷新与分页、并发评论、通知、权限与屏蔽。"},
{q:"微信扫一扫识别二维码怎么测？",a:"相机权限、对焦、距离/角度/光线、模糊/破损/反光码、非二维码、多码同框、识别结果正确性、连续扫描、弱网与暗光。"},
{q:"微信视频通话怎么测？",a:"呼叫/接听/拒接/挂断、静音与摄像头切换、前后台切换、弱网与断网重连、多人通话、权限、并发与兼容。"},
{q:"微信上传图片怎么测？换头像后不生效怎么排查？",a:"格式/大小/尺寸/数量、压缩与裁剪、失败重试、删除、并发上传。\n不生效：查接口是否返回新地址、CDN/浏览器缓存、前端是否刷新、后端是否落库。"},
{q:"微信通知怎么测试？",a:"开关与免打扰、系统权限、到达率与延迟、重复/合并、点击跳转、多端同步、杀进程后接收。"},
{q:"淘宝购物车怎么设计测试用例？",a:"增删改查、数量边界与库存、选中/全选、价格与优惠计算、跨端同步、登录合并、失效商品、并发修改。"},
{q:"双 11 晚 8 点秒杀开启，用户点秒杀按钮失效，你怎么排查和测试这个场景？",s:true,a:"先分前后端：看按钮是否置灰、用的是本地时间还是服务端时间、请求是否发出、接口返回码。\n排查方向：客户端与服务端时间差、活动配置是否生效、库存与限流、网关和缓存、是否在灰度环境。\n测试：提前/准点/延后的时间边界、库存、并发、重复点击、降级与监控。\n【易错】只改客户端时间验证，忽略服务端才是最终判定依据。"},
{q:"秒杀场景怎么设计用例？怎么做压测？",a:"用例：时间点、限购、库存扣减与超卖、重复下单、支付超时、失败降级、防刷。\n压测：JMeter 梯度加压，监控 TPS、P95、错误率、CPU/连接数，确认拐点与限流策略。"},
{q:"商城礼包 / 道具置顶怎么测？",a:"排序规则、并发置顶、重复领取、库存、上下架与生效时间、权限、多端展示一致性。"},
{q:"游戏礼包怎么测？黑神话悟空 boss 关卡场景怎么测？",a:"礼包：领取条件、重复领取、库存、到账与日志。\nBoss 关卡：数值与技能判定、碰撞、帧率与卡顿、网络延迟/丢包、复活与存档、不同难度与设备。"},
{q:"停车场分段计费（白天 15 分钟内免费、半小时 1.5 元、1 小时 3 元、夜间 1 小时 2 元、上限 24 元）怎么设计场景？",a:"用判定表覆盖时段×时长：0–15 分钟、15–30、30–60、跨时段、跨天、24 小时封顶。\n再补异常：无入场记录、重复出场、免费时段跨段、月卡/优惠、支付失败。"},
{q:"电梯控制系统怎么设计测试？",a:"楼层与方向、开关门、超载、急停、断电恢复、多人同时呼叫、故障告警、消防模式、响应时间与安全。"},
{q:"风扇的测试用例怎么设计？",a:"档位切换、摇头、定时、模式（自然/睡眠）、断电恢复、按键与遥控、噪音、安全与清洗。"},
{q:"手机相机怎么设计测试用例？",a:"拍照/录像、对焦与变焦、闪光、模式切换、存储与权限、来电中断、前后台、兼容性、成像质量与弱光。"},
{q:"手机外设：普通开关机、充电类型、红外传感器、指纹人脸、OTA 升级分别有哪些测试点？",a:"开关机：正常/长按/异常断电/低电。充电：协议、快充、边充边用、异常温度。红外：距离与角度、遮挡。指纹人脸：录入、失败、湿手/暗光。OTA：下载、校验、升级、失败回滚、数据保留。"},
{q:"OTA 大版本升级和小版本升级有什么区别？",a:"大版本涉及功能与架构变更，重点测兼容、数据迁移、回滚；小版本多为修复，重点验证修复点与增量包升级。"},
{q:"列表页支持跨页勾选，最多 500 条，每页只显示 100 条，批量修改送货日期怎么设计用例？",a:"跨页保持勾选、全选/取消、500 上限、翻页后状态、批量提交、部分失败与回滚、并发修改、超时。"},
{q:"勾选的数据里有一部分允许调整、一部分不允许调整，异常场景怎么设计？",a:"可调/不可调混选、全不可调、提示与禁用、后端二次校验、绕过前端直接调接口修改不可调数据。"},
{q:"库存 100 件、其中 60 件已被订单占用，运营要直接改成 50，系统会怎么处理、你怎么测？",a:"预期应拒绝或提示可售仅 40；测试边界、并发下单、提示文案、审计日志、强制调整权限。"},
{q:"上游一次性同步 100 个订单、每个订单 50 个字段，怎么保证 5000 个字段完全一致？",s:true,a:"先建字段映射表（源字段→目标字段→类型→转换规则），再写脚本逐条全量比对，不靠人工看。\n比对覆盖类型、精度、空值、默认值、枚举与单位换算，差异要输出到可定位的行和字段。\n再验幂等、失败重试、部分失败、乱序与重复同步，关键字段抽样人工复核。\n【追问】5000 个字段里你怎么挑出关键字段做人工复核？"},
{q:"租户 A 和租户 B 可以互相登录，但登录后不能操作对方数据，怎么设计用例？",a:"A 登录查 B 的数据 ID、列表、详情、导出、附件；直接调接口改 tenantId；缓存与日志是否串租户。"},
{q:"支付异常场景有哪些？支付冻结怎么测？",a:"余额不足、超时、重复支付、回调丢失、退款失败、风控拦截、对账不平。\n冻结：冻结/解冻、冻结中支付、并发、定时解冻、日志与通知。"},
{q:"页面上的柱状图 / 报表怎么测？从第三方接口取数再生成报表怎么测？",a:"核对统计口径与数据源、空数据、极值、时间范围、刷新与导出；第三方异常/超时/字段变更时是否有兜底与提示。"},
{q:"只有一个输入框，怎么设计测试用例？",a:"等价类与边界：空、最短/最长、超长；类型：数字/字母/中文/表情；特殊字符与注入；粘贴、回车、空格；前后端校验一致。"},
{q:"批量导入接口，除了响应时间还要验证哪些结果？",a:"成功/失败条数、错误行定位与原因、部分成功策略、重复数据、事务与回滚、幂等、文件格式与编码。"},
{q:"告警系统怎么设计测试用例？",a:"触发条件与阈值边界、去重/抑制、恢复通知、通知渠道、延迟、误报漏报、告警风暴与降级。"},
{q:"设备每分钟上报一次数据，可能出现重复、乱序、延迟、缺失、异常值，分别怎么设计用例？主要关注哪些指标？",a:"重复：幂等去重；乱序：按时间戳排序；延迟：补传与超时；缺失：断点续传/补采；异常值：阈值过滤与标记。\n指标：到达率、延迟、完整率、准确率、重复率。"},
{q:"A 软件每 100ms 发一次自检命令，B 软件自检后上传数据，A 连续 2 秒收不到就判通信异常，请写测试方法、测试充分性和通过标准。",a:"方法：正常链路、丢包、延迟、重复、乱序、连续 2 秒无响应、恢复后重连。\n充分性：正常+异常+边界+长时间稳定性。\n通过标准：判定准确、误报/漏报为 0、恢复后自动重连、日志可追溯。"},
{q:"上传图片功能怎么设计测试用例？",a:"格式、大小、尺寸、数量、压缩、裁剪、删除、失败重试、并发、安全（改名/木马/越权访问）。"},
{q:"一个完整的下单支付主流程，你会设计哪些测试点？",a:"商品与库存、价格与优惠、地址、支付方式、回调与超时、重复支付、退款、对账、并发与弱网。"},
{q:"优惠券叠加（满减券 + 折扣券 + 会员价）怎么设计测试用例？",s:true,a:"先梳理叠加规则：能否叠加、叠加顺序、金额上限与互斥、是否含运费、退款后券是否返还。\n用判定表覆盖组合：单券、多券、券与会员价、券与秒杀价、满足与不满足门槛、过期与已用。\n重点核对计算：分摊、四舍五入、最低 0.01 元，以及订单、支付、退款三处金额一致。\n【易错】只测前端展示价，不核对支付实付与退款金额。"},
{q:"搜索功能（关键词 + 筛选 + 排序 + 分页）怎么设计测试用例？",a:"输入：空、单字、超长、特殊字符、中英文数字、前后空格与全半角、敏感词。\n结果：精确与模糊匹配、大小写、分词、无结果提示、关键词高亮、相关度排序。\n组合与边界：筛选与关键词叠加、排序切换后翻页保持、首页/末页/越界、结果变化后分页错位。\n【追问】搜不到时怎么判断是索引没更新还是查询条件写错？"},
{q:"Excel 批量导出（大数据量）怎么设计测试用例？",a:"内容：字段与顺序、表头、空值、特殊字符、日期与金额格式、枚举翻译、汇总行是否准确。\n数据量与性能：0 条、1 条、边界条数、超大量导出（异步、分页、超时、失败重试）、导出中重复点击。\n权限与安全：越权导出、导出范围是否受筛选条件限制、文件命名与下载有效期。\n【易错】只核对条数不核对字段值，金额精度和时区最易出错。"}
]});

window.QB_PARTS.push({name:"三、缺陷管理与沟通推动",items:[
{q:"缺陷等级怎么划分（P0-P3 或 70/71）？判定的依据是什么？",s:true,a:"分级：P0 阻断、资损、数据错误或安全漏洞；P1 主流程严重受损但存在绕过；P2 一般功能异常；P3 体验、文案与建议。\n依据四看：影响面、发生频率、是否有绕过、是否涉及资金与数据。\n同一缺陷可因环境影响升级，例如生产出现而测试环境未现。\n【易错】把「难修」当作「等级高」，等级看影响，优先级才看排期。"},
{q:"抖音搜索词条和搜索结果完全没关系，定几级？",a:"搜索是核心功能，结果完全不相关会直接影响用户获取内容，通常 P1；若大面积不可用或资损则 P0。"},
{q:"视频清晰度按钮切换成功但画面没变化，定几级？",a:"功能可见但无效，通常 P2；若默认清晰度错误影响大量用户可升 P1。"},
{q:"怎么判断一个缺陷是否需要修复？",a:"看是否偏离需求、影响用户与业务、是否有绕过、修复成本与版本计划；体验类可作为改进项排期。"},
{q:"提交的 bug 开发不认可，怎么处理？",s:true,a:"第一步补证据：需求条款、可复现步骤、日志与请求响应、数据库实际结果，让争论回到事实。\n第二步拉产品三方确认预期，明确是缺陷、需求变更还是理解偏差。\n仍不一致就记录结论并留痕，必要时升级负责人，同时评估上线风险。\n【追问】如果产品也说不清预期，你怎么推进？"},
{q:"开发说「这不是 bug，是设计如此、需求就是这样」，怎么礼貌回应？",a:"先确认需求原文与设计稿，说明用户实际感受与风险；若确实如此，记录为改进建议并推动产品评估，不在情绪上争论。"},
{q:"开发和产品都不在你所在的城市，只能线上沟通，怎么推进问题？",a:"用录屏+截图+日志把问题说清，建群同步，明确责任人和时间点，定期更新状态，风险及时升级。"},
{q:"开发很忙、不配合定位，你怎么办？",a:"先自行缩小范围（前端/后端/数据/环境），提供最小复现包和日志，约定固定时间同步；仍不推进则升级测试负责人。"},
{q:"偶现的 bug 怎么跟进？一直复现不出来怎么办？这种 bug 要不要提？",s:true,a:"要提。记录环境、账号、时间、traceId、日志和截图，标题标注「偶现」并写复现概率。\n持续跟进：补日志和监控、按条件反复尝试提高复现率、灰度或线上观察。\n判断标准是影响面与风险，不是能不能稳定复现。\n【易错】因为复现不了就不提，线上爆发时没有记录可查。"},
{q:"测试环境复现不了，上线后用户量上来概率变高，怎么规避？",a:"分析是否与并发、数据量、缓存、网络有关；补监控与日志、灰度发布、压测、开关降级，并准备回滚方案。"},
{q:"提了 bug 开发改了，回归发现没修好怎么办？如果还是没修好呢？",a:"重开 bug 并附回归证据和版本号，说明未修复的具体表现；多次不修则升级负责人并评估上线风险。"},
{q:"开发自己都没跑通就把版本转测给你，你怎么做？",a:"按准入标准打回，要求提供自测清单和冒烟通过记录；先跑冒烟，不通过不进入正式测试。"},
{q:"怎么推动一个缺陷闭环？有没有推动过产品改进？",a:"明确责任人、截止时间、验证标准，定期同步；用数据说明影响，推动产品排期并记录结果。"},
{q:"印象最深的 / 最严重的一个 bug 是什么？怎么发现的？",s:true,a:"按「背景—发现—定位—修复—复盘」讲，例子可选未登录直接调接口取数据、重复提交生成两条单据、审批通过但库存未扣减。\n讲清证据链：怎么发现、用什么日志或请求确认、影响了多少用户或数据。\n最后落到改进：补了什么用例、校验或监控。\n【易错】只描述现象不讲定位过程和影响面，听起来像转述别人的 bug。"},
{q:"你认为怎么才算一个 bug？用户体验类问题算不算 bug？",a:"与需求/设计/用户预期不一致且影响使用即为 bug；体验问题可分级为改进建议，但影响转化或理解时应作为缺陷跟踪。"},
{q:"线上偶现失败、线下怎么都复现不了，怎么排查失败原因？",a:"查链路日志与 traceId、监控指标、用户环境与数据差异、并发与缓存、依赖服务超时；必要时加埋点复现。"},
{q:"怎么捞日志？捞的是前端日志还是后端日志？服务端日志怎么捞？",a:"前端看 console 与 Network；后端按时间、关键字、traceId 在日志文件/日志平台检索；服务端常用 tail/grep/awk 或 ELK。"},
{q:"traceId / logId 在排查中怎么用？",a:"从请求入口透传到各服务，按 traceId 串起整条调用链，快速定位失败发生在哪一跳。"},
{q:"业务需求、用户体验、设计美感冲突了怎么办？",a:"以业务目标和用户价值为准，列出各方诉求与代价，拉产品做决策并记录取舍，测试给出风险提示。"},
{q:"开发反馈技术实现有限制，功能做不到，你怎么处理？",a:"确认限制边界与替代方案，评估对需求的影响，推动产品调整范围；无法满足的部分明确记录为已知限制与风险。"},
{q:"版本快上线了缺陷还很多，你怎么判断能不能上线？",s:true,a:"先看结构不看总数：P0/P1 是否清零、缺陷是否集中在某一模块、新增缺陷是否收敛、修复后回归是否通过。\n再看风险：核心链路与资损、权限类问题有无规避方案，遗留问题能否用开关或灰度控制。\n结论给建议而非拍板：可上线、有条件上线（灰度+监控+回滚）、不建议上线，并写清依据。\n【追问】如果业务强推上线，你怎么留痕并降低风险？"},
{q:"开发说「我本地是好的，是你环境问题」，怎么推进？",a:"先对齐差异：版本或分支、配置、数据库数据、依赖服务、浏览器或设备，逐项列清单比对。\n再用证据说话：同一账号同一数据在测试环境的录屏、请求响应、日志与 traceId，必要时在开发环境复跑同一条用例。\n确认是环境差异就推动对齐并记录；确认是代码问题就重开缺陷并附对比证据。\n【易错】只争论不比对环境，问题会来回踢皮球。"},
{q:"用户或客服反馈的问题，你怎么验证并转成缺陷？",a:"先收集原始信息：用户 ID、时间、操作路径、截图录屏、客户端版本与网络环境。\n再复现：按反馈路径在测试或生产只读环境验证，查日志与 traceId 确认是否有报错；复现不了就用订单、数据反查。\n确认后转缺陷：写清现象、影响范围、复现条件和已查证据，标注来源为用户反馈并给等级。\n【易错】直接照抄用户描述提 bug，缺少可复现信息导致开发无法定位。"},
{q:"怎么做缺陷根因分析，防止同类问题反复出现？",a:"对严重或重复出现的问题做 5Why 或鱼骨图：从需求、设计、编码、用例、环境、流程六个方向找原因，落到可执行动作。\n改进项要具体：补哪类用例、加哪个校验或监控、评审加哪项检查，并指定责任人和验证时间。\n定期回看同类缺陷是否下降，把有效动作写进用例库或 checklist。\n【追问】举一个你分析后真正减少了同类缺陷的例子。"}
]});

window.QB_PARTS.push({name:"四、界面自动化（Selenium / UI）",items:[
{q:"UI 自动化整体流程是怎么做的？",s:true,a:"流程：选型与定范围 → 搭框架分层 → 挑稳定主流程 → 编写调试 → 接 CI → 出报告 → 持续维护。\n选场景三条标准：回归频繁、数据可造、界面稳定，优先主流程而不是全量覆盖。\n维护要提前设计：PO 分层、统一等待、失败截图、数据隔离。\n【追问】范围怎么定，为什么不全量做 UI 自动化？"},
{q:"元素定位方式有哪些？八大定位分别是什么？",s:true,a:"八种：id、name、class name、tag name、link text、partial link text、xpath、css selector。\n优先 id/name/css，稳定且快；xpath 灵活但性能低，作为兜底。\n避免绝对路径、下标和易变文本，尽量用 data 属性或稳定业务属性。\n【易错】用 class 定位带样式哈希的按钮，改版后必然失效。"},
{q:"为什么用 xpath？xpath 的原理是什么？",a:"xpath 通过路径、属性、文本在 DOM 树中定位，灵活但性能较低、易受结构变化影响；适合复杂层级和无稳定属性的场景。"},
{q:"id 定位怎么用？有什么限制？",a:"driver.find_element(By.ID, 'xxx')；id 唯一时最快最稳。限制：动态 id、无 id、重复 id 时不适用。"},
{q:"隐式等待、显式等待、强制等待有什么区别？一直定位不到元素会怎样？",s:true,a:"隐式等待：全局设置，查找元素时轮询，找不到继续等，对元素存在类场景有效。\n显式等待：针对具体条件轮询，如可见、可点击、存在，最推荐。\n强制等待：sleep 固定时间，只在调试或不可避免时用。\n一直定位不到会抛 NoSuchElementException 或 TimeoutException，用例失败。\n【易错】混用隐式和显式等待会拉长总耗时，超时时间不是越长越稳。"},
{q:"元素定位不到怎么排查？",s:true,a:"按顺序查：等待是否足够 → 是否在 iframe 或新窗口 → 选择器是否唯一且命中 → 元素是否被遮挡或不可见 → 是否动态渲染还没挂载。\n再查环境：页面是否报错、浏览器缩放、驱动与浏览器版本是否匹配。\n定位时先看截图和页面 DOM，再改选择器，不要盲目加 sleep。\n【追问】元素存在但点不动，通常是什么原因？"},
{q:"页面元素加载慢怎么处理？",a:"用显式等待等目标元素或接口返回，避免 sleep；必要时等列表有数据行、等 loading 消失。"},
{q:"怎么保证 UI 自动化脚本的稳定性？难点在哪、怎么改进？",s:true,a:"做法：稳定选择器、显式等待、PO 分层、数据隔离、用例独立、失败截图与重试、环境与版本固定。\n难点：异步渲染、弹窗与 iframe 切换、数据污染、环境差异导致偶发失败。\n改进：统一基类封装等待、点击和断言，重试只兜底不掩盖真问题，定期清理不稳定用例。\n【易错】用重试把失败率压下去，实际是把产品问题藏起来。"},
{q:"自动化脚本怎么维护？怎么分层？",a:"base（浏览器与公共操作）、pages（页面对象）、cases（业务用例）、data（测试数据）、config（环境配置）；公共逻辑下沉，页面变更只改 pages。"},
{q:"自动化框架怎么搭建？包含哪些目录、每个目录放什么？",a:"config 环境配置、common 工具与客户端、pages 页面对象、tests 用例、data 数据、logs 日志、reports 报告、conftest/fixture 全局准备。"},
{q:"UI 自动化怎么做断言？",a:"断言元素文本/属性/数量/URL/弹窗提示，必要时查接口或数据库验证业务结果；断言要具体、可定位。"},
{q:"新弹出来的页面 / 新窗口怎么定位？",a:"记录 window_handles，switch_to.window 切换后操作，结束再切回原窗口。"},
{q:"iframe 怎么定位？",a:"switch_to.frame(定位或索引) 进入，操作完 switch_to.default_content() 回到主文档；嵌套 iframe 逐层切换。"},
{q:"富文本编辑器怎么定位？",a:"多数是 iframe 或 contenteditable；进入 iframe 后 send_keys，或用 JS 直接设置内容并触发 input 事件。"},
{q:"上传文件时系统弹窗怎么处理？",a:"优先对 input[type=file] 直接 send_keys 路径；系统级弹窗用 pyautogui/AutoIt 或关闭弹窗改用接口上传。"},
{q:"浏览器版本不同导致元素定位出现偏差怎么办？",a:"固定浏览器与驱动版本，使用相对定位和稳定属性，容器化运行环境；必要时做兼容性分支。"},
{q:"登录状态怎么保持？cookie 和 token 怎么获取和复用？",a:"登录一次后保存 cookie/localStorage，后续注入复用；或直接调登录接口拿 token 写入 localStorage，避免每次 UI 登录。"},
{q:"UI 自动化的前置条件和后置清理怎么做？",a:"fixture/setup 造数、teardown 清理；用唯一标识隔离数据，避免残留影响下次执行。"},
{q:"数据驱动怎么做？YAML 里一般存什么数据？",a:"用例参数化读取 YAML/JSON/Excel；存输入、预期、账号、环境、测试数据标识。"},
{q:"底层的公共点击、输入方法做了哪些异常处理？",a:"等待可见/可点击、滚动到元素、JS 点击绕过遮挡、失败截图与日志、必要时重试一次。"},
{q:"单独跑没问题、联跑就报错，是什么原因？",s:true,a:"常见原因：数据污染、用例顺序依赖、登录态或会话冲突、端口与浏览器实例复用、全局配置被前一条改掉。\n排查：单独跑通过的那条，再看它依赖了谁留下的数据或状态；按执行顺序对比日志。\n解决：独立数据加唯一标识、fixture 做前后置、禁用共享账号，必要时按文件隔离进程。\n【追问】怎么用一条命令验证是不是顺序依赖？"},
{q:"自动化用例一直没发现 bug，这套自动化还有意义吗？",a:"有，回归价值在于防劣化和快速反馈；同时应补充新场景、接口层断言和探索性测试，不能只靠 UI 自动化找新 bug。"},
{q:"自动化脚本报错怎么定位？失败用例怎么分析？",a:"看堆栈、截图、日志、请求响应；区分环境、数据、脚本、产品问题；本地复跑最小步骤定位。"},
{q:"自动化里的日志是怎么处理的？",a:"logging 分级输出到文件与控制台，失败自动截图，记录请求 URL/参数/响应摘要，便于回溯。"},
{q:"UI 自动化的覆盖率怎么统计？UI 和接口自动化怎么分工？",a:"覆盖率按核心流程/需求覆盖统计；接口覆盖业务逻辑与异常，UI 只覆盖关键用户路径。"},
{q:"哪些场景适合做界面自动化？投入产出怎么判断值不值？",s:true,a:"适合：稳定、回归频繁、跨版本重复执行的主流程，以及数据可造、断言明确的场景。\nROI 算法：执行频次 × 单次节省时间 > 开发与维护成本，再考虑失败排查成本。\n不做：一次性活动、频繁改版、强探索与体验判断类场景，改用接口自动化或手工。\n【追问】脚本维护成本变高时，你会砍用例还是重构框架？"},
{q:"自动化占比多少？脚本多少条？跑一次要多久？",a:"按实际回答，数字要能对应到用例清单和流水线记录，不要编造。"},
{q:"UI 自动化和手工测试的区别和关系？",a:"手工擅长探索、体验与异常发现；自动化擅长重复回归与快速反馈。两者互补，不是替代关系。"},
{q:"前端自动化你都了解多少？",a:"Selenium/WebDriver、Playwright、Cypress；了解 PO 模式、显式等待、断言、CI 集成与报告。"},
{q:"你们跑自动化是在什么阶段？每日执行还是迭代执行？",a:"提测后跑冒烟与主流程，日常每日定时跑接口回归，迭代末跑全量 UI 回归。"},
{q:"下拉框、日期控件、单选复选怎么操作？",a:"原生 select 用 Select 类：select_by_value、select_by_index、select_by_visible_text，先确认是否支持多选。\n非原生下拉（div 模拟）先点开再点选项，用显式等待等列表出现；日期控件可直接对输入框 send_keys，只读时用 JS 去掉 readonly 再赋值。\n单选复选先判断是否已选中再点击，避免反向取消。\n【易错】对 div 下拉用 Select 类会直接抛异常。"},
{q:"鼠标悬停、拖拽、滚动怎么实现？",a:"悬停、拖拽、右键用 ActionChains：move_to_element、drag_and_drop、context_click，最后 perform() 才生效。\n滚动可用 execute_script 把元素 scrollIntoView，或发送 PageDown；拖拽不稳定时改用 JS 触发事件或分步移动。\n操作前先等元素可见，操作后再等状态变化。\n【追问】悬停后菜单一闪就消失，怎么排查？"},
{q:"Selenium 怎么处理 alert / confirm 弹窗和滑块验证码？",s:true,a:"原生弹窗用 switch_to.alert：读 text、accept 确认、dismiss 取消、send_keys 输入，处理完再操作页面。\n非原生弹窗是页面内 div，按普通元素定位，不要用 alert。\n滑块优先在测试环境关掉校验或用固定通过参数，其次用图像缺口识别加 ActionChains 分步拖动，生产不建议硬绕。\n【易错】弹窗没处理就点页面元素，会一直超时。"},
{q:"自动化用例怎么并行执行来缩短时间？",s:true,a:"先做用例解耦：数据独立、无顺序依赖、登录态可复用，否则并行只会放大不稳定。\npytest 用 pytest-xdist 按用例或按文件分发，多浏览器和多环境用 Selenium Grid 或容器化节点。\n并行度按机器资源定，观察失败率与资源占用，报告里区分真失败与环境失败。\n【易错】共享同一账号或同一测试数据，并行时必然互相干扰。"}
]});

window.QB_PARTS.push({name:"五、接口自动化与接口测试",items:[
{q:"接口自动化是怎么做的？框架怎么分层？",s:true,a:"① 分层：config（环境、账号）→ common（请求、登录、DB、日志）→ api（业务封装）→ tests（用例）→ data（数据）。\n② token 在 fixture 统一处理，用例只写步骤与断言，接口变更只改 api 层。\n③ 接 Jenkins 定时或提交触发，输出 Allure 报告。\n【追问】接口频繁变更怎么降低维护成本？答：URL 与字段收敛到 api 层，用契约测试提前发现变更。\n【易错】把具体断言写进 common 封装，会让所有用例只能校验同一套结果。"},
{q:"接口自动化用例由哪几部分组成？",a:"前置条件（登录、造数）、请求构造（URL/方法/头/参数）、响应断言（状态码/业务码/字段/DB）、后置清理。"},
{q:"接口测试的数据怎么管理？和代码分离还是写在一起？",a:"推荐分离：YAML/JSON/Excel 或数据库造数，用例通过参数化读取；动态数据用唯一标识生成，避免互相污染。"},
{q:"新增或变更的接口，脚本怎么维护？",a:"接口地址与业务封装在 api 层，变更只改封装；契约变更走评审并同步更新用例与断言。"},
{q:"接口之间的动态参数怎么解决？",s:true,a:"① 在上一接口响应里用 JSONPath/正则提取目标字段（如 $.data.orderId），存入全局变量、pytest fixture 或临时缓存。\n② 下一接口用变量占位引用，不要把值写死在用例里。\n③ 若依赖异步落库，要加轮询等待与重试，而不是固定 sleep。\n【追问】提取不到字段怎么办？答：断言该字段必须存在并打印完整响应，快速暴露上游变更。\n【易错】用固定 sleep 等异步结果，环境一慢就失败，应改成在超时时间内轮询。"},
{q:"接口断言怎么做？",s:true,a:"① 协议层：HTTP 状态码、Content-Type、响应时间。\n② 业务层：code/message、关键字段的值与类型、列表长度与元素结构，不能只看 code=0。\n③ 数据层：写操作要查库核对落库结果、状态与关联数据。\n④ 异常场景要断言失败提示与回滚，而不是只测成功路径。\n【易错】只断言 HTTP 200 不够，业务失败常以 200 + 非 0 code 返回。"},
{q:"登录 token 怎么处理？",a:"调登录接口获取 token，缓存到文件/session 级 fixture；失效自动重新登录，请求头统一注入 Bearer。"},
{q:"接口自动化的前置条件和后置条件怎么设计？",a:"前置：登录、造数、依赖服务可用；后置：删除或标记测试数据、释放资源，保证可重复执行。"},
{q:"接口的签名、加密、验签怎么测？",a:"按文档实现签名算法，验证正常签名、篡改参数、错误密钥、过期时间、重复请求；确认服务端确实验签而不是只做前端校验。"},
{q:"接口测试重点关注什么？测哪些维度？",s:true,a:"① 功能：正常参数、组合参数、业务规则与状态流转。\n② 异常：必填/类型/长度/枚举边界、特殊字符与注入、依赖服务超时。\n③ 安全与权限：未登录、越权访问他人数据、水平与垂直越权。\n④ 数据与稳定性：幂等与并发、落库一致性、重复提交、性能与限流。\n【追问】哪个维度最容易被漏？答：越权和并发幂等，需绕过前端直接调接口验证。"},
{q:"怎么设计接口测试用例？维度有哪些？",a:"正向单参数/组合参数；逆向必填缺失、类型错误、长度越界、非法枚举；权限、幂等、并发、依赖异常。"},
{q:"校验入参都要校验哪些内容？",a:"必填、类型、长度、格式（手机/邮箱/日期）、枚举范围、数值边界、特殊字符与注入、多余字段。"},
{q:"给你一个接口，你怎么测试？",s:true,a:"① 读文档或抓包，明确业务规则、依赖接口、鉴权方式和数据来源。\n② 正向：正常参数调通，校验响应结构、字段值与业务状态。\n③ 逆向：必填、类型、长度、枚举、特殊字符、超时与下游异常。\n④ 专项：未登录/越权、重复提交幂等、并发、查库核对、日志与耗时。\n【易错】漏掉「接口能被绕过前端直接调用」，权限必须用无权限账号直调验证。"},
{q:"GET 请求怎么验证？GET 和 POST 有什么区别？",a:"GET 参数在 URL、幂等可缓存、有长度限制；POST 参数在 body、通常非幂等、可传大数据。验证时关注编码、重复参数、超长 URL。"},
{q:"常见响应码有哪些？400、401、403、404、500 分别什么意思？",s:true,a:"① 2xx：200 成功、201 创建、204 无内容。\n② 4xx 客户端：400 参数错误、401 未认证、403 已登录但无权限、404 资源不存在、405 方法不允许、429 限流。\n③ 5xx 服务端：500 内部异常、502 网关上游异常、504 网关超时。\n④ 状态码要与业务 code 一起看，不能只看 HTTP 层。\n【易错】401 和 403 常混：token 缺失或失效是 401，有身份但无权访问是 403。"},
{q:"请求次数过多返回什么码？请求方法错误返回什么码？",a:"次数过多：429 Too Many Requests；方法错误：405 Method Not Allowed。"},
{q:"幂等性怎么测？数据库重复提交的缺陷怎么测？",a:"同一请求重复发送（含并发），验证只产生一条业务数据、余额/库存只扣一次；用唯一业务号与数据库计数核对。"},
{q:"接口出问题怎么定位？",a:"看请求是否到达、参数是否正确、响应码与业务码、服务日志与 traceId、依赖服务、数据库结果；逐层排除前端、网关、应用、DB。"},
{q:"后端接口正常，但前后端交互导致整个功能异常，怎么排查？",a:"抓包比对请求参数与响应结构，检查字段名/类型/序列化、跨域、鉴权头、编码；确认前端是否按契约解析。"},
{q:"接口测试什么时间介入？什么情况下要做接口测试？",a:"接口开发完成或联调阶段介入；多端共用、核心逻辑、权限与数据一致性场景必做。"},
{q:"Web 测试和接口测试有什么区别？",a:"Web 测试偏端到端用户路径与界面；接口测试偏服务逻辑、参数、异常、鉴权与数据，执行更快、定位更准。"},
{q:"用什么工具做接口测试？公司有没有自研平台？",a:"Postman 调试、pytest+requests 自动化、JMeter 压测；有自研平台则支持用例管理、环境切换与报告。"},
{q:"接口自动化接入 Jenkins 后用例大面积挂掉，可能是什么原因？",a:"环境地址/配置错、token 失效、测试数据被污染、依赖服务未启动、并发冲突、时区/编码差异、网络受限。"},
{q:"接口自动化覆盖率怎么算？",a:"按接口数量与业务路径覆盖统计，而不是代码行覆盖；核心接口与主流程优先做到全覆盖。"},
{q:"接口测试做完之后，界面测试算功能测试吗？",a:"算。接口验证服务逻辑，界面验证用户端到端操作与展示，二者都属于功能测试的不同层次。"},
{q:"返回大批量数据的接口怎么验证？",a:"分页与总数自洽、字段抽样+脚本全量比对、排序稳定、性能与内存、导出结果一致。"},
{q:"接口自动化用例越跑越慢，怎么优化执行时间？",s:true,a:"① 分层执行：提交时只跑 smoke 标记用例，全量回归放夜间定时任务。\n② 并发执行：pytest-xdist 按文件或用例分发，但测试数据必须隔离，不能抢同一账号或同一订单。\n③ 减少重复动作：登录 token 用 session 级 fixture 复用，外部依赖用 mock。\n④ 去掉固定 sleep，异步结果改成轮询等待。\n【易错】并发后仍共用同一测试账号会出现随机失败，必须先把数据隔离再提高并发。"},
{q:"接口自动化用例经常偶发失败（flaky），怎么排查和治理？",a:"① 先分类统计：环境、数据、时序、依赖四类，找失败用例的共同点。\n② 数据：用例自造自清，用 uuid 前缀避免相互污染，不依赖其他用例遗留数据。\n③ 时序：异步落库用轮询等待，下游调用设合理超时，不要用固定 sleep。\n④ 环境：固定配置与版本，外部依赖用 mock 挡板。\n【追问】可以直接加重试吗？答：重试只会掩盖问题，先定位根因，仅对已知网络抖动重试并记录次数。"},
{q:"用 pytest 做接口自动化，参数化和数据驱动怎么写？",s:true,a:"① 用 @pytest.mark.parametrize 把数据抽成列表或字典，每个元素对应一组入参与预期。\n② 数据放 YAML/JSON/Excel，用 fixture 读取后再参数化，实现用例与数据分离。\n③ 用 ids 给每组数据命名，失败时报告能直接看出是哪组。\n④ 前置登录、造数与后置清理用 fixture 的 yield 完成。\n【易错】parametrize 在收集阶段执行，读文件失败会让整个用例集报错，文件路径要用项目根目录定位。"},
{q:"依赖的第三方或上游接口不稳定，接口自动化怎么处理？",a:"① 用 mock 服务（WireMock、responses、Mock Server）返回约定的成功、失败、超时、空数据。\n② 分层：核心逻辑用 mock 保证稳定，另建少量真实联调用例单独标记、单独执行。\n③ 异常覆盖：模拟 500、超时、字段缺失，验证系统的降级、重试与提示。\n【易错】全量 mock 会漏掉真实契约变更，要保留契约测试或定期跑真实环境冒烟。"}
]});

{q:"用 Postman 怎么做接口测试？具体步骤是什么？",a:"建 Collection → 配 Environment 变量 → 新建请求（方法/URL/Header/Body）→ 写 Tests 断言 → 保存 → Collection Runner 批量执行 → 查看结果。"},
{q:"用 Postman 怎么做断言？断言怎么设计？",a:"在 Tests 里用 pm.test 断言状态码、响应时间、业务码、字段值与 JSON 结构；断言要覆盖成功与失败两类。"},
{q:"Postman 里参数关联怎么做？",a:"在第一个请求的 Tests 中用 JSONPath 提取字段并 pm.environment.set，后续请求用 {{变量}} 引用。"},
{q:"Postman 怎么实现批量执行？",a:"用 Collection Runner 选择集合与环境，设置迭代次数与数据文件；CI 里用 Newman 命令行执行。"},
{q:"Postman 全局变量怎么加？和环境变量有什么区别？",a:"全局变量对所有集合生效，环境变量按环境切换；优先用环境变量，避免环境污染。"},
{q:"Postman 里常见响应码的含义？",a:"200 成功、201 创建、400 参数错误、401 未认证、403 无权限、404 不存在、429 限流、500 服务端异常。"},
{q:"Postman 和 JMeter 做接口测试有什么区别？",a:"Postman 偏调试与功能验证，脚本化弱；JMeter 偏并发与性能，支持线程组、定时器、聚合报告。"},
{q:"Postman 的 Tests 脚本常用哪些写法？怎么断言 JSON 字段和数组？",s:true,a:"① pm.test('状态码', () => pm.response.to.have.status(200))。\n② const j = pm.response.json()，pm.expect(j.code).to.eql(0)。\n③ 类型 to.be.a('number')，数组 to.be.an('array') 加 lengthOf(3)。\n④ responseTime 断言耗时阈值。\n【易错】json() 只能取一次，非 JSON 响应抛错。"},
{q:"Postman 的 Pre-request Script 一般用来做什么？",a:"① 动态参数：生成时间戳 pm.environment.set('ts', Date.now())，或随机串、uuid。\n② 签名：按文档拼接参数后做 MD5/HMAC，把 sign 写入环境变量，请求里用 {{sign}}。\n③ 前置取数：先调一个接口拿 token 或配置，再发当前请求。\n④ 重置或清理变量，避免上次运行残留影响本次结果。\n【易错】Pre-request 在请求发出前执行，拿不到本次响应；需要响应数据必须写在 Tests 里。"},
{q:"Postman 变量作用域优先级是怎样的？同名变量以哪个为准？",s:true,a:"① 从高到低：Local > Data（Runner 文件）> Environment > Collection > Global。\n② 同名变量取优先级最高的，{{var}} 解析的就是它。\n③ 调试可在 Console 打印，或在变量面板悬停看生效值。\n④ 环境相关放 Environment，公共配置放 Collection，Global 少用。\n【易错】Runner 的 CSV 列名会覆盖环境变量，同名时实际用的是文件值。"},
{q:"Postman 的 Collection Runner 怎么用数据文件跑多组用例？",a:"① Tests 里用 pm.iterationData.get('字段') 或 {{变量}} 引用数据。\n② Runner 选择 Collection 与环境，Data 选 CSV/JSON，按文件行数或设置 Iterations。\n③ 每行数据执行一次完整集合，首行表头即列名。\n④ 运行后看每轮通过/失败，CI 中改用 newman。\n【易错】CSV 要 UTF-8 无 BOM、列名一致；Iterations 超过行数会循环读，数据易错乱。"},
{q:"Postman 里怎么测 Bearer Token、Basic Auth、API Key 这类鉴权？",a:"① Authorization 选类型：Bearer 填 token，Basic 填账号密码，API Key 填 key/value。\n② 集合级设 Authorization，子请求继承即可。\n③ 登录 Tests 里把 token set 到 collectionVariables，用 {{token}} 引用。\n④ 测不带、错误、过期 token，断言 401。\n【易错】Authorization 页与 Headers 同名头会重复，只留一个。"},
{q:"Postman 里怎么测文件上传接口？",a:"① POST + Body 选 form-data，key 类型从 Text 切成 File，再选本地文件。\n② 普通字段保持 Text，不要手动设置 Content-Type。\n③ 多文件传多个 File 类型的 key，或按后端约定写成 files[]。\n④ 文件路径可用变量，便于团队复用。\n【易错】手写 multipart/form-data 会丢 boundary 导致解析失败；大小、类型、空文件限制要单独造用例。"}
]});

window.QB_PARTS.push({name:"七、JMeter 与性能测试",items:[
{q:"用 JMeter 做性能测试 / 压测的流程是什么？",s:true,a:"① 定目标：确认 TPS、P95、错误率和持续时间，来源是 SLA 或业务峰值。\n② 建场景：按业务比例设计接口组合，明确并发、时长与数据量。\n③ 写脚本：线程组 + HTTP 取样器 + 断言 + 定时器，用 CSV 参数化、提取器做关联。\n④ 执行：先单接口基线，再梯度加压找拐点，同时监控应用、DB、中间件资源。\n⑤ 输出：聚合报告 + 瓶颈结论 + 优化建议。\n【易错】不要在 GUI 模式压测，GUI 只用于调试，正式压测必须用非 GUI 模式。"},
{q:"用 JMeter 做接口测试怎么做？举个例子详细说明。",a:"线程组 + HTTP 请求（方法/路径/参数/头）+ 响应断言 + 查看结果树/聚合报告；登录接口用 JSON 提取 token 供后续请求使用。"},
{q:"场景：500 并发，包含登录接口和新增接口，新增接口达不到指标就报错，脚本怎么编？登录和新增要放两个线程组吗？",a:"建议两个线程组：登录用 setUp 线程组只跑一次或少量，提取 token 写入属性；新增线程组 500 并发引用 token。\n用断言+If 控制器判断失败，聚合报告看新增接口的 TPS 与 P95。"},
{q:"JMeter 里的控制器有哪些？",a:"简单控制器、循环控制器、Once Only、If、Switch、Random、Throughput、事务控制器、Include。"},
{q:"复杂流程控制、多个控制器叠加使用，举个例子说明。",a:"线程组 → 事务控制器包住一次完整下单 → 循环控制器跑 N 次 → If 控制器按库存/条件分支。"},
{q:"要模拟用户随机行为（50% 看订单、30% 下单、20% 看报表），用哪个控制器？",a:"Random Controller 或 Throughput Controller 按百分比分配。"},
{q:"JMeter 常用定时器有哪些？",a:"固定、随机、高斯随机、常数吞吐量、同步定时器（集合点）、BeanShell 定时器。"},
{q:"压测要传数据怎么办？数据量非常大怎么操作？",a:"用 CSV Data Set Config 读取参数文件；超大数据用分片、分布式压测或数据库造数。"},
{q:"JMeter 里登录获取 token 怎么做？",a:"登录请求后置 JSON Extractor 提取 accessToken，存为变量，后续请求在 Header 引用 ${token}。"},
{q:"多接口 / 串联接口怎么做批量压测？",a:"多个 HTTP 取样器按顺序放同一事务控制器，用提取变量做关联；必要时用 Once Only 控制登录。"},
{q:"聚合报告看哪些指标？平均响应时间、P90、P95 拿哪个和需求对比？",s:true,a:"① 指标：Average、Median、90%/95%/99% Line、Min/Max、Error%、Throughput。\n② 与需求对比优先看 P95，部分场景看 P99，它代表大多数用户的真实体感。\n③ Error% 要与 TPS 一起看，错误率高时 TPS 再高也没有意义。\n④ 平均响应时间会被少数长尾请求掩盖，只作参考。\n【追问】需求写「响应时间 3 秒内」怎么验收？答：先确认口径是 P95 还是平均值，口径不同结论可能相反。"},
{q:"为什么重点看 P95 而不是平均响应时间？",a:"平均值会被少数极快或极慢请求拉偏，P95 能反映大多数用户的实际体验，也更容易暴露长尾问题。"},
{q:"TPS、QPS、RPS 有什么区别？",s:true,a:"① TPS：每秒完成的事务数，一个事务可含多个请求（如一次下单 = 校验 + 扣库存 + 写订单）。\n② QPS：每秒查询数，偏数据库或接口查询视角。\n③ RPS：每秒请求数，HTTP 层计数，最直观。\n④ 业务达标看 TPS，接口层压测常看 RPS。\n【易错】把 TPS 和请求数混为一谈会高估吞吐，聚合报告的 Throughput 按事务还是按请求统计要看清事务控制器。"},
{q:"TPS 上不去怎么排查？",s:true,a:"① 先查压测端：线程数是否够、Ramp-up 是否太慢、集合点是否生效、压测机 CPU/带宽/端口是否耗尽。\n② 再看应用：线程池与连接池大小、GC 日志、CPU 与内存、锁竞争。\n③ 最后看依赖：DB 慢 SQL 与锁等待、Redis、MQ、第三方接口超时与限流。\n④ 方法：固定其他变量逐层替换压测，对比 TPS 定位瓶颈层。\n【易错】TPS 上不去不一定是服务端问题，压测机先到瓶颈会把结论带偏。"},
{q:"响应时间、并发数、吞吐量之间是什么关系？",a:"利特尔法则：并发数 ≈ 吞吐量 × 响应时间。并发增加初期吞吐上升，到拐点后响应时间陡增、吞吐不再增长。"},
{q:"性能测试怎么判断到了拐点？",a:"继续加压但 TPS 不再上升、响应时间明显上升、错误率升高、资源接近饱和，即为拐点。"},
{q:"性能测试的关注点有哪些？指标怎么确定？",s:true,a:"① 业务指标：TPS、P95 响应时间、错误率、并发用户数。\n② 系统指标：CPU、内存、GC、磁盘 IO、网络带宽、连接数。\n③ 稳定性：长时间运行的响应时间漂移、内存泄漏、日志与告警。\n④ 指标来源：SLA、业务峰值预估、生产 APM 与日志基线，不能拍脑袋。\n【追问】没有 SLA 怎么定？答：用生产高峰的 1.5–2 倍作为目标，并与产品、开发确认口径。"},
{q:"性能测试用例怎么设计？参数是怎么来的？",a:"按业务比例设计场景（浏览/下单/支付），并发与数据来自生产日志、业务峰值预估和目标 SLA。"},
{q:"负载测试、压力测试、稳定性测试有什么区别？",s:true,a:"① 负载测试：在预期峰值负载下验证 TPS、P95、错误率是否达标。\n② 压力测试：持续阶梯加压，找系统极限、拐点与崩溃点。\n③ 稳定性测试：70%–80% 负载持续 8–12 小时或 7×24 小时，看内存、句柄、响应时间是否漂移。\n④ 三者目的不同，报告里要写清场景类型。\n【易错】稳定性测试不是压得越久越好，负载过高测的是压力而不是稳定性。"},
{q:"稳定性测试怎么做？基于什么维度决定跑多长时间？",a:"固定负载持续 8–12 小时或 7×24 小时，监控错误率、响应时间、内存/句柄；时长按业务周期和发布窗口决定。"},
{q:"压测时出现瓶颈 / 性能不达标，怎么定位？",s:true,a:"① 压测端：压测机 CPU、带宽、连接数、JMeter 自身 GC，先排除工具瓶颈。\n② 入口层：Nginx/网关的连接数、限流、超时配置。\n③ 应用层：线程池与连接池、CPU、GC、线程 dump 看阻塞与锁。\n④ 存储层：DB 慢 SQL、锁等待、Redis 命中率、MQ 积压。\n⑤ 工具：APM、慢查询日志、jstack/jstat。\n【追问】怎么证明是 DB 瓶颈？答：DB CPU 或 IO 饱和、慢 SQL 增多，单独压 DB 对比 TPS。"},
{q:"你最大并发测到多少？有没有遇到过内存溢出或响应延迟？",a:"按实际回答，讲清场景、指标和定位过程，不要只报数字。"},
{q:"没有接口怎么做性能测试？",a:"通过 UI 录制/协议录制压测，或找开发提供内部接口；UI 压测成本高，通常只做小规模验证。"},
{q:"测试环境和生产环境的性能差异怎么考虑？",a:"配置、数据量、网络、依赖服务都可能不同；结论要标注环境，生产压测需审批、限流和回滚预案。"},
{q:"压测完之后怎么和数据库核对数据准确性？",a:"核对订单数、库存扣减、金额汇总、状态分布与日志，验证无超卖、无重复、无丢失。"},
{q:"性能测试结论怎么写？",a:"测试场景与指标、实际结果、是否达标、瓶颈与风险、优化建议、环境与数据说明。"},
{q:"一个接口一般压多长时间？是在测试环境还是生产环境压？",a:"基线压测 10–30 分钟，稳定性数小时；一般在测试环境，生产压测需严格审批与保护措施。"},
{q:"做压测时主要观测哪些业务上的不准确（比如并发领料）？",a:"超卖/超领、库存负数、重复单据、状态错乱、金额不平、消息重复消费。"},
{q:"JMeter 常用断言有哪些？分别适合什么场景？",s:true,a:"① 响应断言：校验状态码、响应文本是否含关键字，最常用。\n② JSON 断言：用 JSONPath 精确校验字段值，适合 JSON 接口。\n③ 持续时间断言：校验响应时间是否超过阈值，可作性能门槛。\n④ 大小断言、XPath 断言：校验响应体大小或 XML 节点。\n⑤ 断言加在取样器下只作用于该请求，加在线程组下作用于组内全部请求。\n【易错】把断言挂在线程组层级会作用于组内所有请求，登录接口的断言可能误判后续接口。"},
{q:"JMeter 线程组的线程数、Ramp-up、循环次数怎么设置？和并发是什么关系？",a:"① 线程数即并发用户数；Ramp-up 是多长时间内启动全部线程，如 100 线程/10 秒即每秒启动 10 个。\n② 循环次数决定每个线程执行几轮；勾选调度器可按持续时间运行，适合稳定性测试。\n③ 要真正同时并发，Ramp-up 要足够小并配合同步定时器（集合点）。\n④ Ramp-up 过大等于边加压边测，得到的不是目标并发下的指标。\n【易错】线程数不等于 TPS；循环次数设为永远时必须配调度器时长，否则脚本不会停。"},
{q:"JMeter 怎么用非 GUI 模式压测并生成 HTML 报告？",s:true,a:"① jmeter -n -t test.jmx -l result.jtl -e -o report：-n 非 GUI，-e -o 生成 HTML 报告。\n② 报告目录必须为空或不存在，结果 jtl 不要重复写同一文件。\n③ 用 -J 传线程数、时长，脚本里用 ${__P(threads,100)} 读取。\n④ 先在 GUI 调通脚本，压测时关闭监听器。\n【易错】GUI 模式自身耗资源，结果不可信；查看结果树缓存全部响应，容易内存溢出。"},
{q:"JMeter 分布式压测怎么搭？要注意什么？",a:"① master 配 remote_hosts=ip1,ip2，slave 启动 jmeter-server。\n② slave 需同版本 JMeter、同 JDK，jmx 与 CSV 要在 slave 上，放行 1099 等端口。\n③ jmeter -n -t x.jmx -R ip1,ip2 -l result.jtl，汇总在控制机。\n④ 总并发为各 slave 线程数之和。\n【易错】CSV 在 slave 上不存在会大量取样失败，结果文件别放共享盘。"}
]});

window.QB_PARTS.push({name:"八、Linux",items:[
{q:"常用的 Linux 命令有哪些？",s:true,a:"① 文件：ls、cd、pwd、cp、mv、rm、mkdir、find。\n② 文本：cat/less、tail/head、grep、awk、sed。\n③ 系统：ps、top、free、df、du、uptime。\n④ 网络服务：ss/netstat、curl、systemctl、scp。\n⑤ 其他：tar、chmod、chown。\n【追问】查日志常用组合？答：tail -f a.log 配合 grep -i error 和 grep -C 5 看上下文。"},
{q:"怎么查看日志？怎么抓日志、过滤 error？",s:true,a:"① 实时跟踪：tail -f app.log，先 tail -n 100 看尾部；less +F 也可。\n② 过滤：grep -i error app.log，多关键字用 grep -E 'error|exception'。\n③ 上下文：grep -C 5 看报错前后行，定位堆栈。\n④ 按时间筛：grep -E '10:[0-5][0-9]' a.log 再筛状态码。\n【易错】日志轮转后 tail -f 跟踪旧文件会失效，要用 tail -F。"},
{q:"怎么查 a.log 里昨天 10 点到 11 点的 500 错误？",a:"按日志时间格式用 awk/sed 截取 10:00–11:00 区间，再 grep ' 500 '；或 grep 时间前缀 + grep 状态码。"},
{q:"怎么查日志里的最后 30 行 / 文件末尾 100 行？",a:"tail -n 30 a.log；tail -n 100 a.log。"},
{q:"grep、awk、sed 分别用在什么场景？sed 除了替换还有什么用法？",a:"grep 查找匹配行；awk 按列统计与格式化输出；sed 流编辑。sed 还可删除行、插入、按行号打印、批量替换。"},
{q:"怎么查看磁盘空间、内存、CPU 占用？",a:"df -h 磁盘、du -sh 目录、free -m 内存、top/htop CPU 与进程。"},
{q:"怎么查看占用内存最多的进程？怎么看进程？",a:"ps aux --sort=-%mem | head；ps -ef 看进程，top 按 M 排序。"},
{q:"怎么查网络端口？怎么查防火墙是否关闭？",a:"ss -lntp 或 netstat -tlnp；防火墙 systemctl status firewalld / iptables -L。"},
{q:"修改文件权限用什么命令？可读可写、可读可写可执行分别怎么给？",a:"chmod；读写 6（r+w），读写执行 7（rwx），如 chmod 644 file、chmod 755 dir。"},
{q:"权限的读写执行用数字怎么表示？给文件夹加权限怎么写？",a:"r=4、w=2、x=1；文件夹常用 chmod 755 或 chmod -R 755 dir。"},
{q:"文件查找用什么命令？修改文件名用什么命令？",a:"find /path -name '*.log'；改名用 mv old new。"},
{q:"移动文件、复制文件、两台服务器之间复制文件分别用什么命令？",a:"mv、cp、scp（或 rsync）。"},
{q:"打包压缩文件用什么命令？解压呢？",a:"tar -zcvf x.tar.gz dir；解压 tar -zxvf x.tar.gz。"},
{q:"软链接怎么建？",a:"ln -s /target /link。"},
{q:"怎么确认一个文件是否存在？",a:"test -f file && echo yes；或 [ -f file ]；脚本里用 -e 判断存在。"},
{q:"怎么查 IP、改 IP？",a:"ip addr / ifconfig 查看；修改 /etc/sysconfig/network-scripts 下网卡配置或 nmcli。"},
{q:"Shell 脚本怎么用？你写过什么脚本？",a:"用于启停服务、日志清理、备份、环境巡检、批量执行；讲一个真实脚本的目的与关键步骤。"},
{q:"Shell 里 #、$?、$#、$*、$2 分别代表什么？",a:"# 注释；$? 上一条命令退出码；$# 参数个数；$* 全部参数；$2 第二个参数。"},
{q:"自动化里怎么登录 Linux 服务器执行命令？（Python 连 Linux）",a:"paramiko 建立 SSH 连接执行命令并读取输出；或用 pexpect 处理交互。"},
{q:"怎么查看服务占用了哪些端口？怎么部署服务？",a:"ss -lntp | grep 端口 或 lsof -i:端口；部署 jar 用 nohup java -jar，前端用 nginx。"},
{q:"Linux 怎么排查系统异常？",a:"top/free/df 看资源，dmesg 看内核，journalctl/systemctl 看服务日志，再结合应用日志定位。"},
{q:"CentOS 装包用什么命令？",a:"yum 或 dnf，如 yum install -y 包名。"},
{q:"除了 CentOS，还了解哪些 Linux 系统？",a:"Ubuntu/Debian、CentOS/RHEL、Alma/Rocky、麒麟/统信等国产系统。"},
{q:"磁盘写满报 No space left on device，怎么排查？",s:true,a:"① df -h 看哪个分区满，df -i 看 inode 是否耗尽，小文件太多也会报满。\n② du -sh /var/* | sort -rh | head 逐层定位大目录。\n③ 查已删除但被进程占用的文件：lsof | grep deleted，重启或清理对应进程释放空间。\n④ 清理旧日志、临时文件与 core dump，必要时扩容或迁移。\n【易错】只删日志文件但进程还持有句柄，df 仍显示满，要 truncate 或重启服务才释放。"},
{q:"怎么统计日志里各状态码或错误出现的次数并排序？",a:"① 统计次数：grep -c ' 500 ' a.log。\n② 按状态码：awk '{print $9}' a.log | sort | uniq -c | sort -rn。\n③ 接口 TopN：awk '{print $7}' a.log | sort | uniq -c | sort -rn | head -10。\n④ 先 grep 过滤再用 awk 聚合。\n【易错】$9 是状态码只对常见 combined 格式成立，先确认格式否则结果全错。"},
{q:"crontab 定时任务怎么写？任务没执行怎么排查？",a:"① crontab -e 编辑，格式：分 时 日 月 周 命令，如 0 2 * * * /data/backup.sh。\n② 排查：看 /var/log/cron 或 journalctl -u crond 有无执行记录，脚本要有执行权限。\n③ 常见原因：PATH 缺失、目录不对、相对路径、命令没写绝对路径。\n④ 脚本内先 cd 到目录，并把输出重定向到日志。\n【易错】crontab 里 % 必须转义；任务跑了但没输出，通常是没显式重定向被日志吞掉。"},
{q:"top 里的 load average 是什么？负载高怎么排查？",a:"① load average 是 1/5/15 分钟的平均运行队列长度，含运行中与不可中断的进程。\n② 长期高于 CPU 核数（nproc）说明在排队，4 核机器 load 8 已明显过载。\n③ top 按 P 排 CPU、按 M 排内存，看是哪个进程，再看 %wa 判断 IO 等待。\n④ 结合 vmstat 1 看 r 列与 wa，iostat 看磁盘。\n【易错】load 高不等于 CPU 高，IO 阻塞同样推高 load，只看 CPU 会误判。"}
]});

window.QB_PARTS.push({name:"九、MySQL 与数据库",items:[
{q:"MySQL 增删改查语句分别怎么写？",s:true,a:"① 增：insert into t(a,b) values(1,2)，批量用 values(1,2),(3,4)。\n② 查：select * from t where id=1，生产上按需取列。\n③ 改：update t set a=2 where id=1。\n④ 删：delete from t where id=1，清空整表用 truncate。\n【易错】update/delete 漏写 where 会全表操作，先写同样的 where 用 select 确认行数。"},
{q:"多表联查怎么写？内连接和外连接的区别和使用场景？",s:true,a:"① 内连接 inner join 只返回两表都匹配的行，适合主表与明细都必须存在的场景。\n② 左外连接 left join 保留左表全部行，右表无匹配显示 NULL，适合主表全展示、明细可为空的场景。\n③ 右连接可改写成左连接，实际少用；多表联查要关注驱动表与关联字段索引。\n【易错】left join 后把右表过滤条件写在 where 里会退化成内连接，应放到 on 后面。"},
{q:"学生表有学号、姓名、性别，怎么查男女各有多少人？",a:"select gender, count(*) from student group by gender;"},
{q:"怎么查单表的第 5 到 8 条数据？怎么确定是第 5 到 8 条？",s:true,a:"① 写法：select * from t order by id limit 4,4；limit 偏移量,条数，偏移从 0 开始。\n② 第 5 到 8 条即跳过前 4 条再取 4 条，等价于 limit 4 offset 4。\n③ 必须有唯一且稳定的排序字段（如 id），否则数据库返回顺序不保证。\n④ 验证时连续取两页，比对是否重复或漏数据。\n【易错】只按非唯一字段（如 create_time）排序，相同时间的数据可能重复出现在相邻页。"},
{q:"索引是什么？你了解哪些索引？怎么判断有没有走索引？",s:true,a:"① 索引是加速检索的数据结构，InnoDB 用 B+ 树，减少扫描行数与回表。\n② 类型：主键、唯一、普通、联合、全文索引，联合索引遵循最左前缀。\n③ explain 看 key（实际索引）、type（ALL 为全表扫描）、rows（扫描行数）、Extra（filesort/临时表）。\n④ key 有值且 type 为 ref/range/eq_ref，基本说明走了索引。\n【易错】rows 是估算值，key 有值也不代表高效，要结合真实耗时判断。"},
{q:"了解 SQL 的执行计划吗？怎么看？",a:"explain 加在 SQL 前，关注 type（访问方式）、key（实际索引）、rows（扫描行数）、Extra（是否 filesort/临时表）。"},
{q:"有 10 张表 user1 到 user10，结构一样，给你一个 uid 怎么查它在哪张表？",a:"用 union all 把 10 张表一起查，或用脚本循环查询并在命中时返回表名；数据量大时优先按分表规则直接定位。"},
{q:"写一个你做过的比较复杂的核对 SQL，是为了验证什么？",a:"例如订单金额与明细求和、库存扣减与领用记录、状态分布与业务流水；目的是验证多表数据一致，发现漏记/重复/金额不平。"},
{q:"测试过程中数据库主要用来做什么？",a:"校验落库结果与状态、核对数据一致性、构造与清理测试数据、定位前后端问题。"},
{q:"怎么用数据库验证数据一致性（前端、库、上游三方）？",a:"以业务唯一键关联，比对各方的数量、金额、状态与时间戳；用汇总 SQL 和对账脚本做全量比对。"},
{q:"删除数据、修改数据要注意什么？",a:"先备份或事务，where 条件精确并先 select 确认，避免全表更新；生产环境需审批与权限控制。"},
{q:"Redis 了解多少？在项目里怎么用？",a:"缓存热点数据、分布式锁、会话/验证码；关注缓存穿透/击穿/雪崩、过期策略与一致性。"},
{q:"Kafka 了解吗？",a:"分布式消息队列，用于异步解耦、削峰、日志/事件流；关注分区、消费组、重复消费与积压。"},
{q:"存储单位有哪些？换算关系是什么？",a:"bit → byte(8bit) → KB(1024B) → MB → GB → TB → PB。"},
{q:"事务的 ACID 是什么？MySQL 的四种隔离级别分别解决什么问题？",s:true,a:"① ACID：原子性（undo log）、一致性、隔离性（锁与 MVCC）、持久性（redo log）。\n② 读未提交有脏读，读已提交避免脏读，可重复读避免不可重复读（MySQL 默认），串行化避免幻读但最慢。\n③ InnoDB 的 RR 用 MVCC 加间隙锁基本解决幻读。\n④ 用两个会话并发更新，切隔离级别看读到旧值还是新值。\n【易错】MySQL 默认 REPEATABLE READ，Oracle 与 PostgreSQL 是 READ COMMITTED。"},
{q:"索引失效有哪些常见场景？怎么验证？",s:true,a:"① like '%xx' 前置通配、索引列上做函数或运算、隐式类型转换（字符串列传数字）。\n② or 两侧字段未都建索引、联合索引不满足最左前缀、范围查询后后续列失效。\n③ 区分度太低（如性别）时优化器可能主动不走索引。\n④ 验证：explain 看 key 是否为 NULL、type 是否 ALL，再用真实数据对比执行耗时。\n【易错】explain 只是估算，key 有值也不代表高效，要结合 rows 与实际耗时判断。"},
{q:"慢 SQL 怎么定位和优化？",a:"① 开启 slow_query_log，设 long_query_time（如 1 秒），mysqldumpslow 汇总 Top SQL。\n② explain 看 type/key/rows/Extra，重点排查 ALL、Using filesort、Using temporary。\n③ 加合适索引、避免 select *、减少回表、拆分大查询。\n④ 优化后回归验证耗时与结果集正确性。\n【易错】索引越多写入成本越高，要评估读写比例与区分度。"},
{q:"两个事务互相等待、出现死锁或锁等待超时，怎么排查？",a:"① 报 Deadlock 或锁等待超时，先确认涉及的表与 SQL。\n② show engine innodb status 看 LATEST DETECTED DEADLOCK，含双方 SQL 与锁等待关系。\n③ 查 innodb_trx 与 data_locks 看持锁和等待。\n④ 治理：统一加锁顺序、缩短事务、避免大事务和无索引更新。\n【易错】where 没索引时 update/delete 会锁大量行甚至整表。"},
{q:"limit 深分页（如 limit 100000,20）很慢，怎么优化？",a:"① 原因：要先扫描并丢弃前 100000 行再取 20 行，偏移越大越慢。\n② 游标：记住上页最后一条 id，where id > 上页最大 id order by id limit 20。\n③ 延迟关联：先用覆盖索引取主键再 join 回表。\n④ 业务上限制最大页数，或用搜索条件缩小范围。\n【易错】排序字段没索引，游标与延迟关联都避免不了全表排序。"}
]});

window.QB_PARTS.push({name:"十、Python",items:[
{q:"Python 常见数据类型有哪些？哪些可变、哪些不可变？",s:true,a:"【要点】\n1. 不可变：int、float、complex、bool、str、tuple、frozenset；可变：list、dict、set、bytearray。\n2. 不可变对象可作 dict 的 key 和 set 的元素（需可哈希），可变对象不行。\n3. 不可变不等于不能重新赋值，而是对象本身不能被原地修改，a += 1 会生成新对象。\n【追问】tuple 里放了 list 还算不可变吗？\n【易错】tuple 本身不可变，但内部含 list 仍可被修改，这类 tuple 不能作 dict 的 key。"},
{q:"列表和元组的区别？",s:true,a:"【要点】\n1. 列表可变：append/insert/pop/排序都能原地改，用 []。\n2. 元组不可变：创建后不能增删改，用 ()，内存更省、遍历更快。\n3. 元组可作 dict key、可放入 set，适合固定结构（坐标、配置项）；列表适合频繁增删的集合。\n【追问】元组一定比列表快吗？\n【易错】单元素元组必须写成 (1,)；元组不可变指引用不变，内部可变对象仍可改。"},
{q:"列表和字典分别在什么场景用？字典和集合有什么区别？",s:true,a:"【要点】\n1. 列表：有序、可重复、按下标访问，适合队列、结果集、需要保序的场景。\n2. 字典：key 到 value 的映射，按 key 查找复杂度 O(1)，适合配置、缓存、计数。\n3. 集合：只存唯一元素，支持交并差，适合去重和成员判断；字典键也唯一，但存的是键值对。\n【追问】dict 和 set 的查找复杂度？\n【易错】集合元素必须可哈希，list/dict 不能放进 set；用 set 去重会丢失原顺序。"},
{q:"集合里的元素可以重复吗？",a:"不可以。集合自动去重，且元素必须可哈希；重复加入不会报错但不会增加元素。"},
{q:"is 和 == 的区别？= 和 == 的区别？",s:true,a:"【要点】\n1. is 比较对象身份（id，即内存地址），== 调用 __eq__ 比较值。\n2. = 是赋值语句，== 是比较运算符，三者完全不同。\n3. 判断 None 用 is None，判断值相等用 ==。\n【追问】a = 257; b = 257 时 a is b 为什么可能是 False？\n【易错】小整数和部分字符串有驻留机制，is 偶尔为 True 只是实现细节，不能作为比较值的依据。"},
{q:"深拷贝和浅拷贝的区别？",s:true,a:"【要点】\n1. 浅拷贝只复制最外层容器，内层对象仍共享引用：copy.copy()、lst[:]、dict.copy()。\n2. 深拷贝递归复制每一层：copy.deepcopy()，与原对象完全独立。\n3. 判断标准：嵌套可变对象会被后续修改影响时，必须深拷贝。\n【追问】deepcopy 遇到循环引用会怎样？\n【易错】deepcopy 有 memo 机制能处理循环引用，但性能开销大；全不可变对象拷贝后可能返回同一对象。"},
{q:"*args 和 **kwargs 的区别？",a:"*args 接收任意位置参数，打包成元组；**kwargs 接收任意关键字参数，打包成字典。\n常用于封装通用函数和装饰器。"},
{q:"装饰器是什么？怎么实现？你用过哪些装饰器？",s:true,a:"【要点】\n1. 本质：接收函数并返回新函数的高阶函数，@decorator 是 f = decorator(f) 的语法糖。\n2. 结构：外层接收 func，内层 wrapper(*args, **kwargs) 执行前后逻辑并 return func(...)，最后 return wrapper。\n3. 必须用 functools.wraps 保留原函数名与文档，否则日志和 pytest 用例名会乱。\n4. 用途：日志、耗时统计、失败重试、权限校验、pytest fixture、allure 步骤。\n【追问】带参数的装饰器怎么写？\n【易错】忘了 return wrapper 会得到 None；多个装饰器叠加时执行顺序是自下而上。"},
{q:"try / except / else / finally 的执行顺序和执行内容？",s:true,a:"【要点】\n1. 顺序：try → 有异常进匹配的 except → 无异常执行 else → 无论是否异常都执行 finally。\n2. else 只在 try 无异常时执行，适合放成功后才会做的逻辑，避免被 try 内异常误捕获。\n3. finally 用于释放资源（关文件、关连接、删临时数据），即使有 return 也会先执行。\n【追问】finally 里写 return 会发生什么？\n【易错】finally 中的 return 会覆盖 try/except 的返回值并吞掉异常；except 顺序要从具体到宽泛。"},
{q:"常用的异常类型有哪些？异常处理平时怎么做？",a:"ValueError、TypeError、KeyError、IndexError、AttributeError、FileNotFoundError、TimeoutError。\n处理原则：捕获具体异常、记录日志、必要时重试或抛出，不用裸 except 吞掉所有错误。"},
{q:"生成器是什么？和迭代器有什么区别？可迭代对象有哪些？",a:"生成器用 yield 逐个产出值，惰性计算、省内存；生成器一定是迭代器，迭代器不一定生成器。\n可迭代对象：list、tuple、str、dict、set、range、文件对象。"},
{q:"进程、线程、协程的区别？哪个占资源大？GIL 是什么？",s:true,a:"【要点】\n1. 进程有独立内存空间，开销最大，进程间用队列/共享内存通信。\n2. 线程共享进程内存，开销较小，但有锁竞争和线程安全问题。\n3. 协程在单线程内经事件循环协作式切换，最轻量，适合高并发 IO。\n4. GIL 是 CPython 全局解释器锁，同一时刻只有一个线程执行字节码：CPU 密集用多进程，IO 密集用线程/协程。\n【追问】多进程一定更快吗？\n【易错】GIL 不等于线程安全，共享变量仍需加锁；进程启动与序列化开销大，小任务用进程池。"},
{q:"同步和异步的区别？",a:"同步按顺序等待上一步完成；异步发起后不阻塞，通过回调/await 获取结果，适合 IO 密集场景。"},
{q:"实例方法、类方法、静态方法有什么区别？分别怎么用？",s:true,a:"【要点】\n1. 实例方法：第一参数 self，能访问实例属性，最常用。\n2. 类方法：@classmethod，第一参数 cls，能访问类属性，常用于工厂方法、读配置。\n3. 静态方法：@staticmethod，无 self/cls，相当于挂在类命名空间下的普通函数。\n【追问】什么时候该用类方法而不是静态方法？\n【易错】类方法里修改 cls.attr 会影响所有实例；静态方法不能访问实例和类属性，别滥用。"},
{q:"继承是什么？子类怎么调用父类的方法？super 怎么用？",a:"继承让子类复用父类属性与方法并扩展。\n子类中用 super().方法() 调用父类实现，常见于 __init__ 中初始化父类。"},
{q:"self 的作用是什么？",a:"self 指向当前实例，用于访问实例属性和方法；Python 显式传递 self，名字可改但不建议。"},
{q:"闭包是什么？",a:"内层函数引用外层函数的变量，外层返回内层函数；即使外层执行结束，变量仍被保留。常用于装饰器、工厂函数。"},
{q:"正则表达式里数字怎么表示？你一般在哪些地方用正则？",a:"数字用 \\d 或 [0-9]，多位用 \\d+。\n用于提取响应中的 ID/token、校验手机号/邮箱/日期、日志过滤、字符串替换。"},
{q:"常用的字符串方法有哪些？非空字符和数字怎么表示？",a:"strip、split、join、replace、find、startswith/endswith、upper/lower、format、isdigit。\n正则中非空字符 \\S，数字 \\d。"},
{q:"两个列表合并有哪些方法？",s:true,a:"【要点】\n1. a + b：生成新列表，原列表不变，数据量大时内存翻倍。\n2. a.extend(b)：原地扩展，效率最高，返回 None。\n3. [*a, *b] 解包写法适合少量列表；itertools.chain 惰性拼接，适合大数据或只遍历一次。\n4. 多个 DataFrame 合并用 pandas.concat。\n【追问】合并后要去重保序怎么写？\n【易错】a = a.extend(b) 会把 a 变成 None；+= 与 extend 等价，都是原地修改。"},
{q:"列表去重有哪些方法？去重后再从大到小排序怎么写？",s:true,a:"【要点】\n1. list(set(lst))：最快，但打乱原顺序，元素必须可哈希。\n2. dict.fromkeys(lst)：按首次出现顺序去重，最常用；也可循环配合 seen 集合。\n3. 去重后降序：sorted(set(lst), reverse=True)。\n【追问】列表里是字典这种不可哈希元素怎么去重？\n【易错】降序要用 reverse=True 而不是 key；set 里放 list 会直接报 TypeError。"},
{q:"sort 和 sorted 有什么区别？升序降序怎么写？",a:"list.sort() 原地修改、返回 None；sorted() 返回新列表、可用于任意可迭代对象。\n升序默认，降序 reverse=True，或 key 自定义排序。"},
{q:"把列表中最后一个元素移到最前面，用什么方法？",a:"lst = lst[-1:] + lst[:-1]；或 lst.insert(0, lst.pop())。"},
{q:"字典怎么合并？怎么加一个键值对？怎么遍历输出键和值？",a:"合并：d1.update(d2) 或 {**d1, **d2} 或 d1 | d2。\n新增：d[key] = value。\n遍历：for k, v in d.items(): print(k, v)。"},
{q:"字典怎么转 JSON？JSON 字符串怎么转字典？有几种方式？",a:"json.dumps(d, ensure_ascii=False) 转字符串；json.loads(s) 转字典。\n也可用 eval（不安全，不推荐）；文件读写用 json.dump/json.load。"},
{q:"怎么获取字典的所有键和值？",a:"d.keys()、d.values()、d.items()；需要列表时用 list(d.keys())。"},
{q:"一行代码写出 1 加到 100 的结果。",a:"sum(range(1, 101))；或 100 * 101 // 2。"},
{q:"用 Python 判断一个数字是奇数还是偶数。",a:"n = int(input())\nprint('偶数' if n % 2 == 0 else '奇数')"},
{q:"输入年月日，输出这一天是当年的第几天。",a:"import datetime\ns = input('YYYY-MM-DD')\nd = datetime.datetime.strptime(s, '%Y-%m-%d')\nprint(d.timetuple().tm_yday)"},
{q:"写一个循环 100 次，第一条命令的结果作为第二条命令的参数，统计正确和错误的次数。",a:"import subprocess\nok = fail = 0\nfor _ in range(100):\n    r = subprocess.run(['cmd1'], capture_output=True, text=True)\n    if r.returncode != 0:\n        fail += 1; continue\n    r2 = subprocess.run(['cmd2', r.stdout.strip()], capture_output=True, text=True)\n    ok += 1 if r2.returncode == 0 else 0\n    fail += 0 if r2.returncode == 0 else 1\nprint(ok, fail)"},
{q:"字符串处理返回一大堆数据，怎么按行输出？读大文件怎么按行读？",a:"按行输出用 splitlines() 或按 \\n 切分后逐行 print。\n大文件不要 read() 全读，用 for line in f 逐行迭代，内存占用稳定。"},
{q:"Python 里怎么定义全局变量？怎么创建文件、修改权限？",a:"模块顶层变量即全局；函数内修改需 global 声明。\n创建：open(path, 'w') 或 pathlib.Path.touch()。\n改权限：os.chmod(path, 0o644)。"},
{q:"三元表达式怎么写？",a:"值1 if 条件 else 值2，例如 '通过' if ok else '失败'。"},
{q:"Python 的内存管理是怎么实现的？",a:"引用计数为主，分代垃圾回收处理循环引用；小整数/字符串有驻留与内存池，对象释放由解释器自动管理。"},
{q:"你常用哪些标准库和第三方库？",a:"标准库：os、sys、json、re、time、datetime、random、subprocess、pathlib、logging。\n第三方：requests、pytest、selenium、allure-pytest、pymysql、paramiko、faker、ddddocr。"},
{q:"造测试数据用什么库？",a:"Faker 生成姓名/手机号/地址；random 生成随机值与边界；pandas 批量构造；结合数据库脚本批量插入。"},
{q:"怎么获取时间戳？时间怎么格式化？",a:"time.time() 秒级时间戳，time.time_ns() 纳秒；datetime.now().strftime('%Y-%m-%d %H:%M:%S') 格式化。"},
{q:"你 Python 用了多久？一个周期能写多少代码？代码量怎么样？",a:"按实际答，强调能独立写自动化框架、接口用例和数据处理脚本，不虚报行数。"},
{q:"你用 Python 具体做过什么？",a:"接口自动化框架、UI 自动化、测试数据生成、日志与数据库校验、报表比对脚本、CI 集成。"},
{q:"Python 的序列有哪些？",a:"list、tuple、str、bytes、range，以及自定义实现 __getitem__ 的对象。"},
{q:"列表推导式、生成器表达式和字典推导式有什么区别？分别用在什么场景？",s:true,a:"【要点】\n1. 列表推导式 [x*2 for x in lst] 立即生成完整列表，占内存，适合结果要复用或需要下标。\n2. 生成器表达式 (x*2 for x in lst) 惰性求值，适合大数据或只遍历一次，可配 sum/max。\n3. 字典与集合推导式直接构造 dict 和去重集合，过滤条件 if 写末尾。\n【追问】生成器表达式能重复遍历吗？\n【易错】生成器耗尽后再遍历为空，嵌套超过两层建议改普通循环。"},
{q:"with 语句和上下文管理器是怎么实现的？自己写一个要注意什么？",a:"【要点】\n1. with 进入调 __enter__、退出调 __exit__，异常也执行，释放文件、连接、锁。\n2. 类实现：__enter__ 返回资源，__exit__ 清理，返回 True 会吞异常。\n3. 函数实现：@contextlib.contextmanager 装饰生成器，清理放 yield 之后。\n【追问】__exit__ 返回 True 意味着什么？\n【易错】清理不写 finally，yield 后异常会泄漏资源。"},
{q:"Python 虚拟环境和依赖管理怎么做？pip 常用命令有哪些？",a:"【要点】\n1. 建环境：python -m venv venv 后激活，Windows 用 Scripts，Linux 用 bin。\n2. 装依赖：pip install 包==版本，导出 pip freeze > requirements.txt，恢复 pip install -r。\n3. CI 先建虚拟环境再装依赖，保证与本地一致。\n【追问】为什么要锁版本？\n【易错】freeze 会带全部间接依赖，不锁会今天能跑明天挂。"}
]});

window.QB_PARTS.push({name:"十一、AI 与大模型测试",items:[
{q:"RAG 是什么？完整链路是怎样的？每一步可能出现什么问题？",s:true,a:"【要点】\n1. 链路：采集 → 解析 → 清洗 → 切分 → embedding → 入向量库 → 检索 Top-K → rerank → 拼 Prompt → LLM 生成 → 带引用返回。\n2. 数据层问题：表格图片解析丢失、切分断章、元数据缺失、入库数量与维度不符。\n3. 检索层问题：embedding 模型与索引不匹配、召回低、rerank 误排、相似但无关片段挤占上下文。\n4. 生成层问题：上下文超长被截断、幻觉、引用错位、答案不完整。\n【追问】怎么判断是检索问题还是生成问题？\n【易错】只看最终答案会误判，应先看召回片段里是否已有正确答案。"},
{q:"RAG 的全链路测试流程怎么做？",s:true,a:"【要点】\n1. 数据层：文档完整性、解析准确率、切分质量、向量条数与维度校验。\n2. 检索层：Recall@K、MRR、Context Precision，用标注问题集回归。\n3. 生成层：Faithfulness、Answer Relevancy、引用正确率、格式合规。\n4. 端到端：60–100 条标注集跑通过率，再做性能、并发、安全与版本回归。\n【追问】标注集怎么保证覆盖度？\n【易错】只测有答案的问题会漏掉拒答场景；知识库更新后必须重跑同一套标注集对比。"},
{q:"RAG 的底层流程是什么？原始文档在 RAG 里怎么处理？",a:"原始文档先解析为文本（PDF/Word/HTML），清洗去噪，按语义或固定长度切块并保留元数据，再 embedding 入向量库；查询时同样向量化并检索。"},
{q:"文档分页了怎么办？表格、图文混排文档入库怎么测？",a:"分页要保留页码与章节元数据，切分时避免跨页断句；表格按行列结构化或转 Markdown，图片走 OCR/多模态描述。\n测试：跨页问题能否召回、表格数值是否错位、图片描述是否准确。"},
{q:"文档切分怎么影响召回？",s:true,a:"【要点】\n1. 切太碎：上下文断裂，答案缺前因后果，召回片段无法支撑结论。\n2. 切太大：混入无关内容，浪费上下文窗口，还可能超长被截断。\n3. 常用策略：按标题或段落语义切分，设置 10%–20% overlap，保留页码与章节元数据。\n4. 验证：同一批问题对比不同 chunk_size 与 overlap 的 Recall@K 和答案完整度。\n【追问】长文档和 FAQ 的切分策略一样吗？\n【易错】overlap 过大会让重复片段挤占 Top-K；只调参不重跑标注集无法证明变好。"},
{q:"向量库的原理是什么？向量召回怎么做的？",a:"文本经 embedding 变成高维向量，向量库用余弦/内积计算相似度，并用 HNSW/IVF 等近似最近邻索引加速。\n查询时把问题向量化，取 Top-K 最相似片段。"},
{q:"召回率和精确率怎么理解？阈值怎么设定、多少算达标？",s:true,a:"【要点】\n1. 召回率 = 找回的相关片段 / 全部相关片段；精确率 = 找回结果中相关的 / 找回总数。\n2. 阈值按业务定：知识问答通常 Recall@5 ≥ 0.8、Context Precision ≥ 0.7。\n3. 两者冲突时优先保召回，再用 rerank 提精确；最终以标注集 F1 和端到端通过率为准。\n【追问】Top-K 调大一定更好吗？\n【易错】K 越大召回越高，但精确率下降、延迟和 token 成本上升；报指标要带上样本量。"},
{q:"上下文召回率是什么？怎么计算？",a:"衡量标准答案所需的信息有多少被检索上下文覆盖。\n计算：标注每个问题所需证据片段，统计被召回的比例 = 命中证据数 / 应召回证据总数。"},
{q:"RAGAS 是什么？RAG 测试有哪些指标？",a:"RAGAS 是 RAG 评估框架，常用指标：Faithfulness（忠实度）、Answer Relevancy（答案相关性）、Context Precision、Context Recall。\n还可加引用准确率、答案完整度、延迟与成本。"},
{q:"忠实度（忠诚度）是什么？和正确率差在哪？百分比怎么算？",a:"忠实度：回答中的每个结论是否能被检索上下文支持，衡量有没有编造；正确率：回答是否与标准答案一致。\n计算：被上下文支持的陈述数 / 总陈述数 × 100%。"},
{q:"大模型有幻觉，怎么测？怎么用脚本判断一条回答是幻觉？",s:true,a:"【要点】\n1. 造三类题：知识库无答案、诱导性提问、时效性问题，看是否编造或给过期信息。\n2. 脚本判断：抽取回答中的事实陈述 → 在召回片段中做证据匹配（字符串/语义相似/NLI）→ 无证据的标记疑似幻觉 → LLM Judge 或人工复核。\n3. 指标：幻觉率 = 无证据支持的陈述数 / 总陈述数，同时统计拒答率与误拒率。\n【追问】数值计算类幻觉怎么校验？\n【易错】回答听起来合理不代表忠实；Judge 与被测模型同源会有自偏好，需换模型或人工抽检。"},
{q:"评判大模型用的什么模型？为什么不用同一家的模型？",a:"常用 GPT-4o、Claude、Qwen 等作为 Judge；避免与被测模型同源，减少自偏好和同风格偏差，必要时多模型投票。"},
{q:"大模型输出的评估标准是什么？具体流程和量化指标是怎样的（100 条里多少条通过算过）？",s:true,a:"【要点】\n1. 标准维度：事实正确、忠实于上下文、切题、信息完整、格式合规、无安全风险。\n2. 流程：建 100 条标注集 → 定义 rubric 与评分档 → 自动指标 + LLM/人工双评 → 统计通过率和失败归因。\n3. 门槛：核心场景 ≥ 90%，一般场景 ≥ 80%，安全与合规类必须 100%。\n【追问】通过率不达标怎么定位？\n【易错】只报总分不看分母和样本分布；rubric 不版本化会让两次结果不可比。"},
{q:"怎么评估一个大模型应用的好坏？指标有哪些？",a:"效果：准确率、忠实度、相关性、完整性、引用正确率；体验：首字延迟、端到端耗时；工程：并发、成本、稳定性；安全：拒答、越权、注入防护。"},
{q:"知识库里没有答案的场景怎么测？",a:"应明确说不知道或建议转人工，不能编造；用无答案集测拒答率与误拒率，并检查是否给出错误引用。"},
{q:"多轮对话怎么判断记忆算通过？短期和长期记忆怎么实现、怎么验证？",a:"短期靠上下文窗口/会话缓存，长期靠摘要或向量库。\n验证：后续轮次追问前文实体、约束与指代，回答保持一致；跨会话验证用户偏好是否被正确记住且不越权。"},
{q:"同一问题多次提问，第一次和第二次回答不一致，怎么处理？",a:"先看 temperature/top_p 与是否命中不同检索片段；用多次采样统计语义一致性。\n产品上可固定低温度、缓存稳定答案；测试上允许表述差异但关键事实必须一致。"},
{q:"大模型输出和问题完全不相关，但把问题复述了一遍、关键词也包进去了，怎么判断？",a:"不能只看关键词重合。用答案相关性评分：是否直接回答了问题、是否提供新信息；可用 LLM Judge + 人工 rubric，检测复述套话。"},
{q:"AI 同一个输入输出时好时坏，怎么处理？",a:"固定随机性（temperature=0、固定 seed）、固定检索结果；用多次采样看分布，按业务设通过阈值，不因单次波动判失败。"},
{q:"AI 功能没有固定回复，断言怎么设计？",a:"用 rubric 断言：必须包含的事实点、禁止出现的内容、引用来源、格式；结合语义相似度与 LLM Judge，避免字符串精确匹配。"},
{q:"提示词和约束条件是测试维护还是开发维护？",a:"通常算法/开发维护，测试评审并版本化；测试负责验证约束是否生效、回归提示词变更影响。"},
{q:"Agent 是什么？完整链路是怎样的？了解哪些框架？",a:"Agent 能感知任务、规划步骤、调用工具、观察结果并迭代。\n链路：理解目标 → 计划 → 工具调用 → 结果观察 → 反思/重试 → 输出。\n框架：LangChain/LangGraph、Dify、AutoGen、CrewAI。"},
{q:"Skill 是什么？对模型输出起什么作用？Skill 和 RAG 是什么关系？",a:"Skill 是可复用的能力封装（工具/流程/提示模板），让模型按固定方法完成任务；RAG 提供外部知识，Skill 提供做事方法，二者互补。"},
{q:"MCP 了解吗？",a:"Model Context Protocol，统一模型与外部工具/数据源的接入协议，让 Agent 以标准方式发现和调用工具。"},
{q:"LangChain、FastAPI、Vite 在项目里各自起什么作用？",a:"LangChain 编排模型、检索与工具链；FastAPI 提供后端 API 与流式输出；Vite 构建前端页面。"},
{q:"训练、微调、RAG、Agent 分别是什么？适用场景有什么区别？",a:"训练从零学参数，成本最高；微调在基座模型上适配领域风格/任务；RAG 外挂知识、更新快、可溯源；Agent 让模型规划并调用工具完成多步任务。\n知识频繁更新用 RAG，固定任务风格用微调，多步操作外部系统用 Agent。"},
{q:"温度系数（temperature）的作用和影响？",a:"控制采样随机性：越低越确定、适合事实问答；越高越发散、适合创意生成。测试需固定温度保证可复现。"},
{q:"模型参数规模（比如 72B、32B）是什么意思？本地部署怎么选型？",a:"B 指十亿参数，规模越大能力通常越强但显存与延迟越高。\n选型看显存、并发、延迟和效果评测，不只看参数量。"},
{q:"量化原理是什么？",a:"把权重从 FP16/FP32 压缩到 INT8/INT4 等低精度，减少显存和带宽、提升推理速度，代价是轻微精度损失。"},
{q:"用 Ollama 部署大模型有哪些参数规模？怎么选型？",a:"常见 1B/3B/7B/8B/14B/32B/70B 等量化版本；按显存、并发与效果评测选，先用小模型验证链路再上大模型。"},
{q:"本地部署的大模型怎么对外提供服务？",a:"ollama serve 暴露 API，前面加 FastAPI/Nginx 网关做鉴权、限流、日志与流式转发。"},
{q:"大模型响应慢怎么优化？线上大模型服务怎么做监控？",a:"优化：流式输出、缩短上下文、缓存、并发批处理、量化、GPU 扩容、检索裁剪。\n监控：首字延迟、端到端耗时、TPS、错误率、token 消耗、GPU 利用率、队列长度。"},
{q:"SSE 流式协议是什么？解析器怎么写的？",a:"SSE 基于 HTTP 长连接，服务端持续推送 data: 事件。\n解析：按行读取，遇到空行分帧，提取 data: 后拼接，处理 [DONE] 结束；注意超时、断线重连与增量渲染。"},
{q:"大模型用什么方式接入？智能体会不会访问外部信息？",a:"通过 HTTP/OpenAI 兼容 API 或 SDK 接入，配鉴权、超时、重试与流式。\n智能体是否访问外部信息取决于是否配置工具/检索权限，需要验证越权与数据边界。"},
{q:"传统测试和 AI 测试有什么区别？Web 测试和智能体测试有什么区别？",s:true,a:"【要点】\n1. 传统测试输出确定，断言精确（状态码、字段、DB 值）；AI 输出概率性，只能用品质量指标和 rubric 判定。\n2. 传统用例靠等价类与边界值；AI 靠评测集、标注和统计通过率。\n3. Web 测试关注页面渲染、接口和交互；智能体测试关注规划合理性、工具选择与参数、多轮状态、异常恢复。\n4. 智能体还要额外关注越权、提示注入、调用成本与延迟。\n【追问】概率性输出怎么判定失败？\n【易错】用字符串精确匹配断言 AI 回答必然误报；单次波动不能直接判缺陷，要看多次采样分布。"},
{q:"智能体的测试重点是什么？",a:"任务完成率、规划合理性、工具选择与参数正确性、多轮状态、异常恢复、越权与注入、调用成本与延迟。"},
{q:"AI 生成的用例怎么判断业务上正确？需求文档写得不好、缺少上下文怎么办？",a:"用需求条款、业务规则和已有用例作为校验集，人工评审关键路径；文档不全时拉产品对齐并补术语表，AI 只做初稿。"},
{q:"你用过哪些 AI 工具？具体怎么提效（造数据、写用例、写脚本）？token 用了多少？",s:true,a:"【要点】\n1. 用途：生成用例初稿、造测试数据、写 pytest/SQL 脚本、总结日志与报错、辅助定位根因。\n2. 流程：给需求 + 业务约束 + 输出格式 → 生成初稿 → 人工评审修订 → 沉淀为模板复用。\n3. 提效点：重复性文本和脚本骨架交给 AI，核心场景设计与断言由人把关。\n4. token 用量按实际平台账单回答，不虚报。\n【追问】怎么防止 AI 生成的用例带入错误业务规则？\n【易错】直接把 AI 输出贴进用例库会积累错误；敏感数据不要粘贴到外部模型。"},
{q:"用 AI 生成测试用例需要提供什么数据？用例里 AI 占比多少？",a:"提供需求/原型、业务规则、接口文档、历史用例与缺陷、输出模板。\nAI 适合生成初稿与补充边界，核心场景人工设计；占比按实际，通常初稿 50%–70%，需人工评审。"},
{q:"AI 的优势和劣势是什么？",a:"优势：快、覆盖广、能补边界与文案；劣势：会编造、缺业务上下文、质量不稳定，必须人工校验。"},
{q:"你觉得怎么构建 AI 能力才有竞争力？",a:"把 AI 嵌入真实业务闭环：高质量数据与评测集、可观测与反馈机制、成本与延迟优化、安全合规，而不是只接一个模型。"},
{q:"Prompt 注入怎么测？有哪些防御手段？",s:true,a:"【要点】\n1. 直接注入：让模型忽略系统提示、泄露初始 Prompt、执行越权指令，逐条记录是否被突破。\n2. 间接注入：恶意指令藏在知识库文档、网页、工具返回里，检索后被劫持，最容易漏测。\n3. 防御：输入过滤、系统提示与用户内容分隔、工具白名单与参数校验、输出审查、最小权限。\n【追问】为什么只加「不要被注入」的提示不够？\n【易错】防御不能只靠 Prompt，必须在代码层做权限校验。"},
{q:"Function Calling（工具调用）怎么测？参数错误和异常怎么断言？",a:"【要点】\n1. 正常：模型选对工具、参数名与类型符合 schema、必填齐全、能串联多工具。\n2. 异常：工具超时、500、空结果、参数缺失或类型错、工具名不存在，都要优雅提示或重试。\n3. 断言：解析 tool_calls，校验 name 在白名单、arguments 符合 schema、调用次数与顺序符合预期。\n【追问】怎么构造工具返回异常的用例？\n【易错】只看最终回答会漏参数错误，模型还可能编造工具结果。"},
{q:"大模型接口的性能怎么测？TTFT、TPOT、并发这些指标怎么看？",a:"【要点】\n1. TTFT 首字延迟：从发请求到收到第一个 token 的时间，流式接口必测，直接决定体感。\n2. TPOT：每个输出 token 的平均耗时，结合输出长度估算端到端耗时。\n3. 并发用 JMeter 或 Locust 阶梯加压，看 P95/P99 延迟、错误率、队列长度、GPU 利用率和 token 成本。\n【追问】非流式接口怎么算 TTFT？\n【易错】只测单请求延迟没有意义，非流式的响应时间不能当 TTFT 报。"}
]});

window.QB_PARTS.push({name:"十二、持续集成、Jenkins 与 Git",items:[
{q:"你对持续集成怎么理解？",s:true,a:"【要点】\n1. 开发频繁提交到主干，每次提交自动触发拉代码、构建、静态检查和单元/接口测试。\n2. 失败快速反馈，尽早暴露集成问题，避免到提测才发现大面积冲突。\n3. 产物可归档、可追溯（构建号关联 commit），保证随时能拿出一个可发布版本。\n【追问】CI 和 CD 的区别？\n【易错】CI 不等于自动跑一遍用例，缺少构建产物和失败阻断就只是定时任务；主干长期不可用说明 CI 形同虚设。"},
{q:"你用 Jenkins 做了什么？大概讲一下你们的 Jenkins 流程。",a:"拉代码 → 装依赖 → 构建镜像/启动环境 → 跑接口与 UI 用例 → 生成 Allure 报告 → 归档并通知。"},
{q:"Jenkins 流水线里 JMeter 相关的配置项有哪些？Jenkins 加 JMeter 的完整流程怎么做？",a:"配置 JMeter 路径、jmx 脚本、CSV 数据、线程数与持续时间、报告输出；流程：构建 → 执行 jmeter -n -t x.jmx -l result.jtl → 生成 HTML 报告 → 归档。"},
{q:"接口自动化接 Jenkins 后用例大面积挂掉，原因是什么？",a:"环境地址/配置错、token 失效、数据污染、依赖服务未启动、并发冲突、网络与编码差异、时区问题。"},
{q:"用 Jenkins 一般怎么管控版本、怎么跟包？",a:"按分支/标签触发构建，构建号关联 commit；产物归档并记录版本号，测试按构建号取包验证。"},
{q:"了解 Git 吗？切换分支用什么命令？",a:"git checkout 分支 / git switch 分支；查看分支 git branch -a。"},
{q:"提交代码和主分支有冲突怎么解决？",a:"先 git fetch 拉最新，切到分支 rebase 或 merge 主干，解决冲突后测试再提交；避免直接强推主干。"},
{q:"自动化代码上库冲突怎么处理？",a:"小步提交、按模块分工，冲突时沟通后合并；公共文件改动先同步，合并后本地跑一遍再推。"},
{q:"测试报告保存在本地还是集成工具里？对集成工具有了解吗？",a:"CI 中归档到 Jenkins，或用 Allure/TestNG 报告、钉钉/飞书通知；也可接测试平台统一管理。"},
{q:"版本发布流程是怎样的？灰度环境怎么用？",a:"开发自测 → 提测 → 测试环境验证 → 预发/灰度 → 小流量验证 → 全量发布 → 监控与回滚预案。灰度用于验证真实流量下的稳定性。"},
{q:"声明式 Pipeline 和脚本式 Pipeline 有什么区别？Jenkinsfile 怎么写？",s:true,a:"【要点】\n1. 声明式：pipeline 下写 agent、stages、stage、steps，自带 post、environment。\n2. 脚本式：node 内写 stage，本质是 Groovy，可循环判断。\n3. Jenkinsfile 放仓库根目录，用 Pipeline script from SCM 拉取。\n【追问】声明式里怎么跑 Groovy 循环？\n【易错】循环必须写在 script 块内，stage 重复会错乱。"},
{q:"Jenkins 里账号密码、token、SSH key 怎么管理？流水线里怎么用？",s:true,a:"【要点】\n1. 凭据统一放 Credentials：用户名密码、Secret text、SSH 私钥、Secret file。\n2. 声明式用 environment 里的 credentials 绑定凭据 ID，自动生成 TOKEN 系列变量。\n3. 脚本式用 withCredentials 包裹，变量仅块内有效。\n【追问】凭据泄露怎么排查？\n【易错】echo 变量会把凭据打到控制台，密码严禁写进 Jenkinsfile。"},
{q:"Jenkins 的构建触发器有哪些？Webhook 和轮询怎么选？",a:"【要点】\n1. 触发方式：手动、SCM 轮询、定时 cron、上游 Job 触发、Webhook。\n2. Webhook 由代码平台在 push、MR 时回调，实时且省资源；轮询有延迟且频繁拉代码。\n3. 多分支流水线按分支自动建 Job，定时构建跑 nightly 回归。\n【追问】cron 里的 H 是什么？\n【易错】Webhook 要求 Jenkins 可被访问并配 token，轮询间隔过短会拖垮代码平台。"},
{q:"构建产物（jar、镜像、测试报告）在 Jenkins 里怎么归档和传递？",a:"【要点】\n1. 归档：用 archiveArtifacts 指定路径并开启 fingerprint，可在构建页下载。\n2. 报告：junit 读 TEST xml，或用 Allure 插件；跨 Job 用 stash/unstash 或制品库。\n3. 产物命名带版本号和构建号，镜像打 commit 短 SHA 标签，便于回滚定位。\n【追问】归档和 stash 的区别？\n【易错】大文件归档拖慢构建占磁盘；只存 latest 无法回溯历史。"},
{q:"上线后发现严重问题，怎么用 CI/CD 做回滚？回滚要注意什么？",a:"【要点】\n1. 应用回滚：重新部署上一个稳定版本镜像或包，镜像必须保留历史 tag（commit SHA），不能只用 latest。\n2. 数据库最难：变更前备份、脚本可逆，先兼容后删除，避免代码回滚后表结构不匹配。\n3. 流程：切灰度或停流量 → 回滚 → 校验核心接口与数据 → 看监控 → 复盘，回滚也走流水线留痕。\n【追问】回滚还是热修复，怎么选？\n【易错】只回滚代码不回滚配置或数据会二次故障，回滚后记得清缓存。"},
{q:"日常开发中常用的 Git 操作有哪些？stash、cherry-pick、reset、revert 怎么用？",a:"【要点】\n1. 日常：status、add、commit、push、diff。\n2. stash 暂存改动，pop 恢复，适合临时切分支。\n3. cherry-pick 把某个 commit 摘到当前分支，用于同步修复到 release。\n4. reset 改本地历史，已推送的共享分支用 revert 生成反向提交。\n【追问】reset --hard 后还能找回吗？\n【易错】共享分支强推会覆盖他人提交，reflog 可短期找回。"}
]});

window.QB_PARTS.push({name:"十三、Docker",items:[
{q:"Docker 常用命令有哪些？",s:true,a:"【要点】\n1. 镜像：docker images、pull、build -t、tag、push、rmi、save/load。\n2. 容器：docker run -d -p --name、ps、stop/start/restart、rm、exec -it、logs -f。\n3. 排查：docker inspect 看配置与状态、docker stats 看资源、docker port 看映射。\n4. 清理：docker system df 看占用，prune 清理无用镜像、容器、卷。\n【追问】容器删了镜像还在吗？\n【易错】rm 删容器、rmi 删镜像；镜像被容器引用时需先删容器；prune 会清未使用的卷，慎用。"},
{q:"加载镜像、启动容器分别用什么命令？",a:"加载：docker load -i x.tar 或 docker pull；启动：docker run -d --name x -p 8080:80 image。"},
{q:"启动容器要挂载目录进去用什么参数？",a:"-v 宿主机目录:容器目录，如 -v /data/logs:/app/logs；也可用 --mount。"},
{q:"怎么查看指定端口的日志？怎么查看容器日志？",a:"docker logs -f 容器名；按端口先 docker ps 找到容器，再 logs；可用 --since/--tail 过滤。"},
{q:"怎么做容器化部署？Dockerfile 怎么写？",a:"FROM 基础镜像 → WORKDIR → COPY 依赖 → RUN 安装 → COPY 代码 → EXPOSE → CMD/ENTRYPOINT；分层利用缓存，减小镜像体积。"},
{q:"Docker Compose 是什么？编排命令有哪些？",a:"用 YAML 定义多容器服务与网络、卷。命令：docker compose up -d、down、ps、logs、build、restart。"},
{q:"Compose 的 YAML 里有几个服务？怎么分层和拆分？",a:"按实际项目回答；一般拆成应用、数据库、缓存、网关等；按环境用 override 文件拆分配置。"},
{q:"项目里 Linux 和 Docker 主要用在哪里？具体部署过什么软件？",a:"用 Docker 部署被测服务、MySQL、Redis、Jenkins、测试镜像；Linux 上启停服务、看日志、排查端口。"},
{q:"Docker 最大的优势是什么？",a:"环境一致、隔离、启动快、易交付；一次构建到处运行，减少环境差异问题。"},
{q:"你自己编写过 Docker 镜像吗？",a:"写过测试镜像：Python 基础镜像 + chromium/chromedriver + allure + 依赖，构建后推仓库供 CI 使用。"},
{q:"你的服务是用 Docker 部署的吗？部署完怎么看服务端口？",a:"docker ps 看端口映射，docker port 容器，或 ss -lntp 查宿主端口。"},
{q:"测 App 的时候会用到 Docker 吗？",a:"会用：跑 Appium 服务、设备农场、mock 服务、测试报告与 CI 环境；真机通常外接。"},
{q:"Docker 镜像的分层原理是什么？怎么写 Dockerfile 才能用好缓存？",s:true,a:"【要点】\n1. 镜像由只读层叠加，每条 RUN/COPY 生成一层，容器启动再加一层可写层，层可被多个镜像共享。\n2. 缓存按层命中：COPY 依赖 → RUN 安装 → COPY 代码，代码改动不会让依赖层失效。\n3. 优化：合并 RUN、清理 apt/pip 缓存、配 .dockerignore，控制体积和构建时间。\n【追问】ADD 和 COPY 有什么区别？\n【易错】COPY . . 放在最前面会让后面所有层的缓存失效。"},
{q:"容器之间怎么互相访问？bridge、host、none 网络模式有什么区别？",a:"【要点】\n1. 默认 bridge：容器有独立 IP，但没有内建 DNS，只能用 IP 互访。\n2. 自定义网络：同一网络内可用容器名做 DNS，如 mysql:3306，用 docker network create app-net 创建。\n3. host 共享宿主网络栈，性能好但端口冲突；none 只有 lo，适合纯计算任务。\n【追问】overlay 网络用在哪？\n【易错】-p 8080:80 是宿主端口:容器端口，写反会连不上。"},
{q:"数据卷 volume 和绑定挂载 bind mount 有什么区别？数据怎么持久化？",s:true,a:"【要点】\n1. volume 由 Docker 管理，存在 /var/lib/docker/volumes，跨容器共享、易备份。\n2. bind mount 直接映射宿主目录 -v 宿主:容器，适合开发看日志，但依赖权限。\n3. 容器删除后卷仍保留，需 volume rm 清理；数据库容器必须挂数据目录。\n【追问】volume 里的数据怎么备份？\n【易错】bind mount 目录不存在会建空目录，可能覆盖镜像内文件。"},
{q:"Docker Compose 里怎么控制服务启动顺序和健康检查？",a:"【要点】\n1. depends_on 只保证启动先后，不保证就绪；配 service_healthy 才等就绪。\n2. healthcheck 写 test、interval、retries 等参数。\n3. 配置用 environment 或 env_file 注入，override 文件按环境拆分。\n【追问】只写 depends_on 能解决连不上数据库吗？\n【易错】down -v 会删数据卷，没有健康检查时应用仍可能启动失败。"},
{q:"容器启动就退出或一直起不来，怎么排查？",a:"【要点】\n1. ps -a 看状态与退出码：0 命令执行完，1 应用报错，137 多为 OOM，143 是 SIGTERM。\n2. logs --tail 100 看日志，为空说明进程没起来；inspect 看 OOMKilled。\n3. 用 run --entrypoint sh 进容器，检查配置、端口、依赖连通性。\n【追问】137 一定是内存不足吗？\n【易错】CMD 必须前台运行，用 nohup 或 & 会立即退出。"}
]});

window.QB_PARTS.push({name:"十四、App 与移动端测试",items:[
{q:"App 的用例设计流程是什么样的？",s:true,a:"【要点】\n1. 需求与平台差异分析：先确认 iOS/Android/鸿蒙的交互与权限差异，标出受影响的功能。\n2. 维度拆分：功能、兼容性、网络、中断、性能、安全与升级各成体系列点，避免只列功能点。\n3. 设计与评审：写用例并标注优先级与是否进回归集，评审后准备机型和测试账号。\n4. 执行闭环：提单跟踪、修复验证与回归，最后沉淀可复用的用例资产。\n【追问】时间只够跑一遍，怎么砍用例？→ 保 P0 主流程和资损、权限相关。\n【易错】漏掉安装升级、弱网与中断恢复，线上最容易出问题恰是这些。"},
{q:"常用 adb 命令有哪些？monkey 怎么用？",s:true,a:"【要点】\n1. 设备与装卸：adb devices 看连接状态，install/uninstall 装卸应用，push/pull 传文件。\n2. 调试与日志：adb shell 进设备，logcat 看运行日志，dumpsys 查系统状态（如 activity、meminfo）。\n3. 操作模拟：am start 拉起页面，input tap/swipe/text 模拟点击、滑动与输入。\n4. monkey 稳定性：adb shell monkey -p 包名 -v 500，加 --throttle 控制间隔、--ignore-crashes 遇崩溃继续跑，最后看崩溃与 ANR。\n【追问】跑完怎么判断结果？→ 看日志末尾 monkey finished 与崩溃堆栈、ANR 记录。\n【易错】-p 后写应用名而不是包名，或事件数写成 0，等于没跑。"},
{q:"adb 看日志时，什么场景下看前端日志？logcat 怎么用？",a:"排查 UI 渲染、崩溃、JS 报错时看前端日志；adb logcat -v time 按级别过滤，崩溃看 AndroidRuntime/E/ANR。"},
{q:"抓包一般用什么工具？Charles 还是 Fiddler？",a:"Charles 常用于移动端（证书、弱网、Map Local），Fiddler 偏 Windows；两者都能做代理抓包。"},
{q:"抓包的主要目的是什么？什么场景下用抓包？",a:"定位前后端问题、验证参数与响应、弱网模拟、Mock 异常返回、安全测试（明文/越权）。"},
{q:"弱网测试怎么做？",s:true,a:"【要点】\n1. 工具限速：Charles/Fiddler 设带宽、延迟、丢包，或用系统与厂商的网络模拟器。\n2. 场景覆盖：2G/3G/4G/弱 WiFi、高延迟高丢包、断网、断网重连、WiFi 与蜂窝切换。\n3. 关注表现：超时与重试、加载提示与骨架屏、是否重复提交、缓存与断点续传兜底。\n4. 通过标准：弱网下不崩溃不卡死、有明确提示，恢复网络后状态能自愈。\n【追问】弱网下重复提交订单怎么防？→ 前端防抖加服务端幂等键，两边都要验。\n【易错】只测慢不测断，断网重连后的数据错乱才是高频缺陷。"},
{q:"App 稳定性怎么测？",a:"monkey 长时间随机操作、主流程反复执行、后台/前台切换、低内存与低电量场景，监控崩溃率与 ANR。"},
{q:"兼容性测试怎么做？",a:"覆盖主流机型、系统版本、分辨率、厂商 ROM；优先真机云测，关注安装、启动、UI 适配与功能差异。"},
{q:"安卓、iOS、鸿蒙三端测试有什么差异？鸿蒙常用什么命令？",a:"Android 用 adb，iOS 用 Xcode/idevice 工具，鸿蒙用 hdc（如 hdc shell、hdc install）；差异在权限、返回机制、推送与后台策略。"},
{q:"OTA 升级的测试点有哪些？大版本和小版本升级的区别？",a:"下载、校验、安装、失败回滚、断电、空间不足、数据保留、跨版本升级；大版本重兼容与迁移，小版本重修复验证。"},
{q:"安装、卸载、覆盖安装、升级、降级怎么测？",a:"首次安装、重复安装、覆盖安装保留数据、卸载残留、跨版本升级、降级兼容与数据兼容。"},
{q:"App 的权限、中断（来电、切后台、锁屏）怎么测？",a:"首次授权/拒绝/永久拒绝、权限变更；来电、短信、切后台、锁屏、耳机插拔后的状态恢复与数据保存。"},
{q:"耗电、流量、内存、发热、启动时间怎么测？",a:"用系统工具/Perfdog 采集：启动耗时、CPU/内存/流量/电量/温度，做前后版本对比与长时间监控。"},
{q:"推送 / 通知收不到怎么排查？",a:"查设备 token、推送权限、厂商通道、服务端日志、网络与免打扰；区分前台/后台/杀进程三种状态。"},
{q:"App 崩溃、ANR 日志怎么看？",a:"崩溃看 logcat 的 AndroidRuntime 堆栈与 tombstone；ANR 看 traces.txt 主线程阻塞点与 CPU 占用。"},
{q:"App 测试和 Web 测试的区别？",a:"App 多了安装升级、权限、中断、弱网、兼容性、耗电与推送；Web 关注浏览器兼容、缓存与跨域。"},
{q:"手机外设主要测哪些模块？",a:"开关机、充电、红外、指纹/人脸、相机、OTA、传感器与按键。"},
{q:"手机相机、相册相关怎么测？",a:"拍照/录像、对焦变焦、闪光、模式、存储与权限、中断、图片编辑与删除、云同步。"},
{q:"你们做的都是 Web 端还是有 App 端？App 测得多吗？",a:"按实际回答，说明平台占比与个人负责范围。"},
{q:"移动端除了功能层面和网络层面，还要考虑哪些层面？",a:"兼容性、性能（启动/内存/耗电/流量）、稳定性、安全与隐私、交互体验、升级与灰度。"},
{q:"App 的自动化怎么做的？（Appium）",a:"Appium + 设备农场，PO 模式封装页面，capabilities 指定平台/包名/设备，接 CI 跑主流程回归。"},
{q:"手势、横竖屏、刘海屏适配怎么测？",a:"点击/滑动/长按/双击/缩放；旋转后布局与数据保持；刘海/挖孔/折叠屏安全区不遮挡关键元素。"},
{q:"iOS 上架审核与 TestFlight 灰度怎么测？",s:true,a:"【要点】\n1. 提审前：核对隐私清单、权限用途说明、第三方 SDK 合规、图标与截图规范，减少审核被拒。\n2. TestFlight 内测：按内部与外部测试分组分发，验证安装、覆盖升级、崩溃收集与反馈渠道。\n3. 灰度放量：按比例逐步放开，观察崩溃率、核心转化与接口错误率，异常时暂停并回滚。\n4. 差异点：iOS 审核周期不可控且热修复受限，紧急修复只能走新版本重新提审。\n【追问】被拒常见原因怎么快速定位？→ 看审核回复中的条款编号，逐条对照权限与支付规则。\n【易错】用企业证书或描述文件绕过审核分发给外部用户，属于违规分发。"},
{q:"Hybrid 混合开发的内嵌 H5 页面怎么测？",a:"【要点】\n1. 容器交互：H5 与原生互调（登录态、支付、分享、返回键），参数、回调与失败分支都要验。\n2. 兼容性：不同系统的 WebView 内核版本、字体与安全区、横竖屏、键盘弹起是否遮挡。\n3. 网络与缓存：弱网加载、离线缓存、H5 发版后是否命中旧缓存导致白屏或旧逻辑。\n4. 调试手段：Android 用 chrome://inspect，iOS 用 Safari 网页检查器，配合抓包看 H5 请求。\n【追问】H5 白屏怎么排查？→ 先看容器日志与静态资源加载，再查 JS 报错、证书与跨域。\n【易错】只测浏览器不测 App 内 WebView，UA、Cookie 与内核差异会在真机上暴露。"},
{q:"定位与地图相关功能怎么测？",a:"【要点】\n1. 权限链路：首次授权、拒绝、仅本次允许、永久拒绝后在设置里改回，验证提示与降级表现。\n2. 定位能力：GPS、WiFi、基站、室内与地下车库，弱信号下的首次定位时间与漂移范围。\n3. 模拟与异常：开发者选项模拟位置、跨城市切换、跨时区、系统时间被修改。\n4. 业务联动：打卡范围、电子围栏触发、轨迹回放、距离计算与逆地理编码结果是否一致。\n【追问】定位不准怎么判断是手机还是应用问题？→ 用系统地图对比坐标，再看应用是否做了偏移纠正。\n【易错】忽略坐标系差异（GCJ-02 与 WGS84），会导致整体位置偏移。"},
{q:"移动端隐私合规与安全怎么测？",a:"【要点】\n1. 权限最小化：逐项确认申请的权限与功能对应，非必要不申请，拒绝后不影响主流程。\n2. 隐私政策：首次启动弹窗、同意前不采集、撤回同意后能真正关闭采集。\n3. 传输与存储：抓包确认走 HTTPS、敏感字段不明文、日志与本地缓存不落明文。\n4. 安全加固：防重打包、防调试、防截屏录屏、越权访问与任意文件读取。\n【追问】怎么验证同意前不采集？→ 抓包加系统权限调用记录，看弹窗出现前是否已有上报请求。\n【易错】只核对隐私政策文本，不看实际请求，真实违规常在后台静默上报。"}
]});

{q:"TCP 三次握手、四次挥手的过程？",s:true,a:"【要点】\n1. 三次握手：客户端 SYN(seq=x) → 服务端 SYN+ACK(seq=y, ack=x+1) → 客户端 ACK(ack=y+1)，确认收发能力并同步序列号。\n2. 四次挥手：主动方 FIN → 对方 ACK → 对方 FIN → 主动方 ACK，全双工两个方向各自独立关闭。\n3. TIME_WAIT：主动关闭方等 2MSL，确保最后的 ACK 能到达，且旧连接的报文不会混入新连接。\n4. 测试用途：弱网、超时、连接复用异常时抓包看握手挥手是否完整，可快速区分网络与服务问题。\n【追问】为什么握手三次、挥手四次？→ 握手时 ACK 可与 SYN 合并；挥手时对方可能还有数据要发，ACK 与 FIN 不能合并。\n【易错】把 TIME_WAIT 当成服务端状态，它出现在主动关闭的一方。"},
{q:"TCP 和 UDP 的区别？",s:true,a:"【要点】\n1. TCP：面向连接、可靠传输、按序到达，有确认重传、流量控制与拥塞控制，头部开销大。\n2. UDP：无连接、不保证可靠与顺序，开销小、延迟低，适合视频、游戏、DNS、广播。\n3. 选择依据：要可靠和顺序用 TCP（文件、支付），要低延迟且可容忍丢包用 UDP（实时音视频）。\n4. 测试关注：TCP 看连接数、超时与重传；UDP 看丢包率、乱序与抖动。\n【追问】HTTP/3 为什么改用 UDP？→ 基于 QUIC 在 UDP 上自建可靠传输，减少握手延迟并支持多路复用。\n【易错】认为 UDP 不可靠就没法用，应用层可自行补确认与重传。"},
{q:"HTTP 和 HTTPS 的区别？",a:"HTTPS 在 HTTP 与 TCP 之间加 TLS，加密传输、身份认证、防篡改，默认 443；HTTP 明文、默认 80。"},
{q:"HTTP 常见状态码及含义？",a:"200 成功、201 创建、204 无内容、301/302 重定向、304 未修改、400 参数错、401 未认证、403 无权限、404 不存在、405 方法不允许、429 限流、500 服务端错误、502/504 网关超时。"},
{q:"OSI 七层模型是哪七层？TCP/IP 四层？",s:true,a:"【要点】\n1. OSI 七层：物理、数据链路、网络、传输、会话、表示、应用。\n2. TCP/IP 四层：网络接口层、网际层、传输层、应用层，相当于把 OSI 上三层合并为应用层。\n3. 对应关系：IP 与路由在网络层，TCP/UDP 在传输层，HTTP/DNS 在应用层；交换机多在链路层，路由器在网络层。\n4. 测试用途：按层定位问题，物理与链路看连通和丢包，网络看 IP 与路由，应用层看状态码与报文。\n【追问】ping 和 telnet 各测哪层？→ ping 测网络层可达性，telnet 端口测传输层连通。\n【易错】把 HTTP 归到传输层，或以为 OSI 就是实际实现的协议栈。"},
{q:"DHCP 是什么？",a:"动态主机配置协议，自动为客户端分配 IP、掩码、网关和 DNS，避免手工配置冲突。"},
{q:"静态路由和动态路由的区别？有哪些路由协议？",a:"静态路由手工配置、稳定但维护成本高；动态路由自动学习与收敛。\n协议：RIP、OSPF、BGP、IS-IS。"},
{q:"子网掩码 255.255.255.0 有多少个可用 IP？",a:"/24 共 256 个地址，去掉网络地址和广播地址，可用 254 个。"},
{q:"255 转成二进制是多少？254 呢？",a:"255 = 11111111；254 = 11111110。"},
{q:"与、或、非、异或，1 和 0 的结果分别是什么？",a:"与：1&1=1，其余 0；或：0|0=0，其余 1；非：!1=0、!0=1；异或：相同为 0、不同为 1。"},
{q:"计算机网络你都了解哪些内容？",a:"分层模型、TCP/UDP、HTTP/HTTPS、DNS、路由与交换、NAT、抓包与常见网络故障排查。"},
{q:"5G 基站了解吗？蜂窝通信、WiFi 了解吗？",a:"5G 由基站、核心网组成，特点是高速率、低时延、大连接；蜂窝用授权频谱广覆盖，WiFi 用非授权频谱局域覆盖。"},
{q:"通信协议里 TCP 之外还了解什么？",a:"UDP、QUIC、HTTP/1.1/2/3、WebSocket、MQTT、SSE。"},
{q:"SSE、WebSocket 这类长连接协议了解吗？",a:"SSE 是服务端单向推送、基于 HTTP；WebSocket 全双工、需握手升级。SSE 适合流式输出，WebSocket 适合实时双向通信。"},
{q:"为什么 TCP 握手是三次，两次或四次会有什么问题？",a:"【要点】\n1. 两次不够：服务端无法确认客户端已收到自己的 SYN，可能建立无效连接并占用资源。\n2. 四次多余：第二步的 ACK 可与 SYN 合并成一个报文，拆开只是多一次往返。\n3. 根本目的：双方都确认「我能发、你能收」，并同步初始序列号，为可靠传输打基础。\n4. 异常视角：网络中滞留的历史 SYN 到达时，三次握手能避免服务端误建连接。\n【追问】SYN Flood 攻击利用的是哪个环节？→ 大量伪造 SYN 占满服务端的半连接队列。\n【易错】只背流程不讲原因，被追问「为什么不是两次」时容易卡壳。"},
{q:"HTTP 502、503、504 有什么区别？测试中怎么定位？",s:true,a:"【要点】\n1. 502 Bad Gateway：网关从上游收到无效响应，常见于上游进程崩溃或返回格式异常。\n2. 503 Service Unavailable：服务暂不可用，多为过载、限流、发布中或健康检查失败。\n3. 504 Gateway Timeout：网关等待上游超时，常见于慢查询、下游阻塞或超时配置过短。\n4. 定位顺序：先看网关日志与上游健康状态，再看应用日志与耗时，最后查依赖服务与数据库。\n【追问】502 和 504 会同时出现吗？→ 会，上游半死时部分请求超时、部分连接被重置。\n【易错】看到 5xx 就直接提单给后端；502/504 常出在网关与部署层，应先分层再定责。"},
{q:"HTTPS 的 TLS 握手与证书校验是怎么做的？测试怎么验证？",a:"【要点】\n1. 握手流程：协商协议版本与加密套件，服务端下发证书，客户端校验通过后生成会话密钥，后续用对称加密传输。\n2. 证书校验：检查证书链、域名匹配、有效期与吊销状态，任一不通过就告警并中断。\n3. 加密范围：HTTP 报文在 TLS 之上，路径与参数均被加密，通常只有 SNI 和目标 IP 可见。\n4. 测试验证：抓包确认走 443 且为 TLS；用过期、自签、域名不匹配的证书验证客户端是否拒绝。\n【追问】为什么抓 HTTPS 要装证书？→ 代理要做中间人重新签名，客户端必须信任该根证书才能解密。\n【易错】以为上了 HTTPS 就绝对安全，客户端若关闭证书校验仍可被中间人攻击。"},
{q:"一次完整的 DNS 解析过程是怎样的？解析失败怎么排查？",a:"【要点】\n1. 解析顺序：本机 hosts 与缓存 → 本地 DNS 服务器 → 递归查询根、顶级域、权威服务器，结果逐级缓存。\n2. 记录类型：A/AAAA 给地址，CNAME 做别名，MX 管邮件，TXT 做校验，TTL 决定缓存时长。\n3. 失败排查：nslookup 或 dig 看返回码，检查 hosts、DNS 配置、记录是否生效、TTL 缓存与 CDN 调度。\n4. 测试场景：域名切换、解析超时、返回空记录、多线路解析与就近调度是否一致。\n【追问】改了 DNS 为什么不生效？→ 本地与各级缓存未过期，等 TTL 结束或清缓存再验。\n【易错】把解析失败都归为网络不通，也可能是记录未生效、域名拼错或 CDN 回源异常。"},
{q:"抓包发现请求超时或失败，怎么逐层定位是网络、服务还是前端的问题？",s:true,a:"【要点】\n1. 先分层：ping 或 telnet 确认网络与端口可达，curl 直连接口排除前端，再用抓包看请求是否真的发出。\n2. 看时序：区分 DNS 慢、TCP 握手慢、TLS 握手慢、等待首字节慢还是传输慢。\n3. 看状态：连接被重置多为网络或网关，5xx 指向上游服务，4xx 多为参数与鉴权，无请求则前端未发。\n4. 交叉验证：换多端、多网络、多账号复测，结合服务端日志与链路追踪确认耗时落点。\n【追问】首字节很慢但服务端日志很快，问题在哪？→ 网关排队、连接池耗尽或网络链路拥塞。\n【易错】抓不到包就说接口没通；先确认代理、证书、内网直连与 VPN 是否绕过了抓包。"}
]});

window.QB_PARTS.push({name:"十六、业务与行业场景题",items:[
{q:"一个生产工单完工要经过哪些状态？",a:"创建/草稿 → 下达 → 开工 → 报工 → 完工 → 入库 → 关闭；异常时有暂停、返工、作废。"},
{q:"委外工单从下发到完成，哪些节点会影响库存？",a:"下发发料扣减原料库存，委外入库增加成品/半成品库存，退料回补，损耗与差异调整库存。"},
{q:"一批来料从到货到检验判定的流程是什么？检验不合格后续怎么处理，对库存有什么影响？",a:"到货收货 → 待检入库 → 抽样检验 → 合格入库/不合格隔离。\n不合格：退货、让步接收、返工、报废；库存从待检转合格或隔离/扣减。"},
{q:"不合格的库存怎么处理？",a:"隔离、退货、让步接收、返工返修、报废；每种处理都要有审批、状态流转和库存台账记录。"},
{q:"审批流里有哪些状态？有几级审批？驳回是等级驳回还是分别驳回？",a:"草稿、审批中、通过、驳回、撤销、终止。\n级数按金额/类型配置；驳回可回到发起人或上一节点，需按产品规则验证。"},
{q:"法务系统审批流转有哪些状态？",a:"起草、审批中、审批通过、驳回、撤回、归档；可能含会签、或签、转办、加签。"},
{q:"怎么保证单据状态机覆盖完整、识别非法跳变？状态流转时还要注意什么？",a:"画状态图并列出状态×事件矩阵，覆盖合法迁移、非法跳转、重复触发、撤销/超时；注意并发、幂等、权限与库存联动。"},
{q:"权限架构怎么设计测试？角色数据权限隔离怎么测？",a:"功能权限（菜单/按钮/接口）+ 数据权限（本人/部门/全部）。\n用不同角色交叉验证：看不到、点不了、直接调接口被拒、导出不越权。"},
{q:"单据数据一致性怎么验证？",a:"以单据号关联主表与明细、库存、财务流水，核对数量、金额、状态和时间；用 SQL 汇总与对账脚本。"},
{q:"上游同步类接口的数据一致性怎么测？看不到上游页面怎么保证落库数据一致？",a:"用上游提供的文件/接口报文作为基准，建字段映射表，写脚本逐字段比对；再验重复、乱序、失败重试与幂等。"},
{q:"报表 / 大屏的数据怎么核对？",a:"先确认统计口径与时间范围，再用明细 SQL 汇总比对；覆盖空数据、边界、跨期与刷新。"},
{q:"能耗项目都统计了哪些能耗指标？怎么测？",a:"电、水、气、蒸汽等用量与折算能耗、单位产值能耗、峰谷值。\n测试：采集口径、单位换算、缺失/异常值、汇总与报表一致性。"},
{q:"智能工厂平台微服务多实例部署，可靠性怎么验证？",a:"验证负载均衡、实例宕机自动摘除、会话/任务不丢、消息重复消费、数据库连接与限流熔断。"},
{q:"RNG 模块具体怎么测？",a:"验证取值范围、分布均匀性、种子可复现、边界与异常输入、并发唯一性；用统计检验与固定种子回归。"},
{q:"选择器 / 解析器这类模块怎么测？",a:"覆盖正常/异常/边界输入、非法格式、超长与特殊字符、歧义选择、性能与内存；用样例集做回归比对。"},
{q:"工厂智能运营平台是整个平台你测还是只测部分微服务？",a:"按实际回答，说明负责的微服务范围与跨服务联调方式。"},
{q:"银行系统了解吗？信贷业务怎么快速了解？",a:"了解存贷汇基本流程；快速了解信贷：看产品要素、申请-审批-放款-还款-逾期链路，画状态机与资金流。"},
{q:"绩效评价系统怎么理解、怎么测？",a:"目标设定 → 自评/他评 → 校准 → 结果应用；重点测评分规则、权重、权限、周期与数据汇总。"},
{q:"秒杀、库存扣减这类高并发业务怎么测？",a:"压测并发、验证不超卖、不重复、不少卖；检查锁/队列/缓存、限购、幂等与对账。"},
{q:"交管 / 物流 / 租车这类调度类系统怎么测？",a:"验证资源分配、时间窗、路径/价格计算、并发抢占、取消改派、状态流转与异常补偿。"},
{q:"多租户 SaaS 系统的数据隔离怎么测？",s:true,a:"【要点】\n1. 隔离维度：数据、配置、文件与消息按租户隔离，账号只能看到本租户资源。\n2. 越权验证：拿 A 租户的 token 直接调 B 租户的 ID 或 URL，接口必须拒绝而不是返回数据。\n3. 共享资源：字典、模板、计费等公共数据只读共享，不能互相篡改。\n4. 边界场景：租户切换、成员邀请、租户停用或删除后的数据归档与残留。\n【追问】列表接口怎么验隔离？→ 造两租户同名数据，检查返回条数、总量与导出结果只含本租户。\n【易错】只测页面看不到，不测直接调接口，越权往往藏在未加租户条件的查询里。"},
{q:"新旧系统数据迁移（割接）怎么测？",a:"【要点】\n1. 迁移前：确认字段映射表、清洗规则与迁移范围，先抽样比对源库与目标库。\n2. 全量核对：按主键比对条数、金额、状态、时间戳，用脚本输出差异清单而不是人工抽查。\n3. 增量与切换：割接窗口内的增量是否补齐、双写是否一致、回滚方案是否验证过。\n4. 迁移后：老数据能否查询、编辑并走完后续流程，附件与关联关系是否完整。\n【追问】迁移后金额差几分钱怎么查？→ 查精度截断、汇率与四舍五入规则在映射中是否丢失。\n【易错】只核对条数相等就通过，字段值与状态错位同样会造成业务事故。"},
{q:"定时任务、跑批作业怎么测？",a:"【要点】\n1. 触发方式：定时表达式、手动触发、错过触发后的补跑，以及时区与夏令时的影响。\n2. 数据覆盖：空数据、单条、大批量与异常数据，分批大小与分片能否覆盖全量。\n3. 幂等与并发：重复执行不重复入账，多实例部署时同一任务不并发执行。\n4. 异常恢复：中途失败能否续跑、失败告警、重试次数与死信处理，执行日志可追溯。\n【追问】跑批把数据库压垮怎么排查？→ 看批量大小、事务范围与 SQL，改分批、加索引或错峰执行。\n【易错】只测正常跑通，不测重跑与并发，重复记账类问题几乎都出在这里。"},
{q:"消息队列异步业务怎么测？",a:"【要点】\n1. 正常链路：生产者发送、消费者处理，业务状态与下游通知最终一致。\n2. 异常场景：消息丢失、重复消费、乱序、消费失败重试与死信队列。\n3. 幂等与顺序：重复消息只生效一次，依赖顺序的业务要验证分区键是否正确。\n4. 积压与恢复：消费堆积时的告警、扩容与补偿脚本，恢复后数据是否补齐。\n【追问】怎么验证最终一致？→ 按业务单号对账，比对消息记录、业务表状态与下游数据。\n【易错】只测发送成功，不看消费结果，异步链路的坑基本都在消费端。"}
]});
